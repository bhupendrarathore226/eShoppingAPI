etails\u0027,\r\n    loadComponent: () =\u003e\r\n      import(\u0027./store/product-details/product-details.component\u0027)\r\n        .then(m =\u003e m.ProductDetailsComponent),\r\n    resolve: { product: productResolver },\r\n  },\r\n\r\n  {\r\n    path: \u0027checkout\u0027,\r\n    title: \u0027Checkout\u0027,\r\n    canActivate: [authGuard],\r\n    loadChildren: () =\u003e\r\n      import(\u0027./checkout/checkout.routes\u0027).then(m =\u003e m.checkoutRoutes),\r\n  },\r\n\r\n  {\r\n    path: \u0027account\u0027,\r\n    canActivate: [authGuard],\r\n    loadChildren: () =\u003e\r\n      import(\u0027./account/account.routes\u0027).then(m =\u003e m.accountRoutes),\r\n  },\r\n\r\n  { path: \u0027login\u0027,    loadComponent: () =\u003e import(\u0027./account/login/login.component\u0027).then(m =\u003e m.LoginComponent) },\r\n  { path: \u0027register\u0027, loadComponent: () =\u003e import(\u0027./account/register/register.component\u0027).then(m =\u003e m.RegisterComponent) },\r\n\r\n  { path: \u0027**\u0027, loadComponent: () =\u003e import(\u0027./core/not-found/not-found.component\u0027).then(m =\u003e m.NotFoundComponent) },\r\n];\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Feature | API |\r\n|---------|-----|\r\n| Define routes | `Routes` array in `app.routes.ts` |\r\n| Bootstrap router | `provideRouter(routes, ...)` |\r\n| Render outlet | `\u003crouter-outlet\u003e` |\r\n| Navigate in template | `routerLink`, `routerLinkActive` |\r\n| Navigate in code | `Router.navigate()` |\r\n| Read params | `ActivatedRoute.paramMap` or `@Input` with `withComponentInputBinding()` |\r\n| Protect routes | `canActivate`, `canDeactivateChild`, `canMatch` |\r\n| Pre-fetch data | `resolve: { key: resolverFn }` |\r\n| Lazy load | `loadComponent`, `loadChildren` |\r\n\r\n**Next:** [06 — Forms →](./06-forms.md)\r\n",
  "06-forms": "# Chapter 06 — Forms\r\n\r\nAngular provides two approaches to forms:\r\n\r\n| | Template-Driven | Reactive |\r\n|--|----------------|---------|\r\n| Logic lives in | HTML template | TypeScript class |\r\n| API | `NgModel`, `NgForm` | `FormGroup`, `FormControl`, `FormBuilder` |\r\n| Best for | Simple forms | Complex, dynamic, testable forms |\r\n| Validation | HTML attributes | Validator functions |\r\n| Type safety | Limited | Full (Angular 14+) |\r\n\r\n---\r\n\r\n## PART A — Template-Driven Forms\r\n\r\n### 1. Setup\r\n\r\n```typescript\r\nimport { Component } from \u0027@angular/core\u0027;\r\nimport { FormsModule } from \u0027@angular/forms\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-login\u0027,\r\n  standalone: true,\r\n  imports: [FormsModule],  // required\r\n  templateUrl: \u0027./login.component.html\u0027,\r\n})\r\nexport class LoginComponent { }\r\n```\r\n\r\n### 2. Basic Login Form\r\n\r\n```html\r\n\u003c!-- login.component.html --\u003e\r\n\u003cform #loginForm=\"ngForm\" (ngSubmit)=\"onSubmit(loginForm)\"\u003e\r\n\r\n  \u003cdiv class=\"field\"\u003e\r\n    \u003clabel for=\"email\"\u003eEmail\u003c/label\u003e\r\n    \u003cinput\r\n      id=\"email\"\r\n      name=\"email\"\r\n      type=\"email\"\r\n      [(ngModel)]=\"credentials.email\"\r\n      required\r\n      email\r\n      #emailField=\"ngModel\"\r\n    /\u003e\r\n    @if (emailField.invalid \u0026\u0026 emailField.touched) {\r\n      @if (emailField.errors?.[\u0027required\u0027]) {\r\n        \u003cspan class=\"error\"\u003eEmail is required\u003c/span\u003e\r\n      }\r\n      @if (emailField.errors?.[\u0027email\u0027]) {\r\n        \u003cspan class=\"error\"\u003eMust be a valid email\u003c/span\u003e\r\n      }\r\n    }\r\n  \u003c/div\u003e\r\n\r\n  \u003cdiv class=\"field\"\u003e\r\n    \u003clabel for=\"password\"\u003ePassword\u003c/label\u003e\r\n    \u003cinput\r\n      id=\"password\"\r\n      name=\"password\"\r\n      type=\"password\"\r\n      [(ngModel)]=\"credentials.password\"\r\n      required\r\n      minlength=\"8\"\r\n      #passwordField=\"ngModel\"\r\n    /\u003e\r\n    @if (passwordField.invalid \u0026\u0026 passwordField.touched) {\r\n      \u003cspan class=\"error\"\u003ePassword must be at least 8 characters\u003c/span\u003e\r\n    }\r\n  \u003c/div\u003e\r\n\r\n  \u003cbutton type=\"submit\" [disabled]=\"loginForm.invalid || isLoading\"\u003e\r\n    {{ isLoading ? \u0027Logging in…\u0027 : \u0027Login\u0027 }}\r\n  \u003c/button\u003e\r\n\u003c/form\u003e\r\n```\r\n\r\n```typescript\r\nexport class LoginComponent {\r\n  credentials = { email: \u0027\u0027, password: \u0027\u0027 };\r\n  isLoading   = false;\r\n\r\n  onSubmit(form: NgForm) {\r\n    if (form.invalid) return;\r\n    this.isLoading = true;\r\n    console.log(\u0027Submitting:\u0027, this.credentials);\r\n    // call service...\r\n  }\r\n}\r\n```\r\n\r\n### 3. Form States\r\n\r\nAngular adds CSS classes to inputs automatically:\r\n\r\n| Class | Meaning |\r\n|-------|---------|\r\n| `ng-pristine` | Never changed |\r\n| `ng-dirty` | Has been modified |\r\n| `ng-untouched` | Never focused |\r\n| `ng-touched` | Has been focused and left |\r\n| `ng-valid` | Passes all validators |\r\n| `ng-invalid` | Fails at least one validator |\r\n\r\n```scss\r\ninput.ng-invalid.ng-touched {\r\n  border-color: red;\r\n}\r\n```\r\n\r\n---\r\n\r\n## PART B — Reactive Forms\r\n\r\n### 1. Setup\r\n\r\n```typescript\r\nimport { ReactiveFormsModule } from \u0027@angular/forms\u0027;\r\n\r\n@Component({\r\n  standalone: true,\r\n  imports: [ReactiveFormsModule],\r\n  ...\r\n})\r\n```\r\n\r\n### 2. FormControl — Single Field\r\n\r\n```typescript\r\nimport { Component } from \u0027@angular/core\u0027;\r\nimport { FormControl, Validators, ReactiveFormsModule } from \u0027@angular/forms\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-search\u0027,\r\n  standalone: true,\r\n  imports: [ReactiveFormsModule],\r\n  template: `\r\n    \u003cinput [formControl]=\"searchCtrl\" placeholder=\"Search…\" /\u003e\r\n    @if (searchCtrl.errors?.[\u0027minlength\u0027]) {\r\n      \u003cspan\u003eMinimum 3 characters\u003c/span\u003e\r\n    }\r\n  `,\r\n})\r\nexport class SearchComponent {\r\n  searchCtrl = new FormControl(\u0027\u0027, [Validators.minLength(3)]);\r\n}\r\n```\r\n\r\n### 3. FormGroup — Multiple Fields\r\n\r\n```typescript\r\nimport { Component, inject } from \u0027@angular/core\u0027;\r\nimport { FormBuilder, FormGroup, Validators, ReactiveFormsModule } from \u0027@angular/forms\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-register\u0027,\r\n  standalone: true,\r\n  imports: [ReactiveFormsModule],\r\n  templateUrl: \u0027./register.component.html\u0027,\r\n})\r\nexport class RegisterComponent {\r\n  private fb = inject(FormBuilder);\r\n\r\n  form = this.fb.group({\r\n    firstName: [\u0027\u0027, [Validators.required, Validators.minLength(2)]],\r\n    lastName:  [\u0027\u0027, Validators.required],\r\n    email:     [\u0027\u0027, [Validators.required, Validators.email]],\r\n    password:  [\u0027\u0027, [Validators.required, Validators.minLength(8), this.strongPassword]],\r\n    confirm:   [\u0027\u0027, Validators.required],\r\n    agree:     [false, Validators.requiredTrue],\r\n  }, { validators: this.passwordMatch });\r\n\r\n  // Custom validator function\r\n  strongPassword(control: AbstractControl) {\r\n    const v = control.value as string;\r\n    return /[A-Z]/.test(v) \u0026\u0026 /[0-9]/.test(v) ? null : { weakPassword: true };\r\n  }\r\n\r\n  // Cross-field validator\r\n  passwordMatch(group: AbstractControl) {\r\n    const pw  = group.get(\u0027password\u0027)?.value;\r\n    const cfm = group.get(\u0027confirm\u0027)?.value;\r\n    return pw === cfm ? null : { mismatch: true };\r\n  }\r\n\r\n  // Typed helpers\r\n  get f() { return this.form.controls; }\r\n\r\n  onSubmit() {\r\n    if (this.form.invalid) {\r\n      this.form.markAllAsTouched();\r\n      return;\r\n    }\r\n    console.log(this.form.getRawValue());\r\n  }\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- register.component.html --\u003e\r\n\u003cform [formGroup]=\"form\" (ngSubmit)=\"onSubmit()\"\u003e\r\n\r\n  \u003cinput formControlName=\"firstName\" placeholder=\"First name\" /\u003e\r\n  @if (f.firstName.invalid \u0026\u0026 f.firstName.touched) {\r\n    \u003cspan\u003eFirst name is required (min 2 chars)\u003c/span\u003e\r\n  }\r\n\r\n  \u003cinput formControlName=\"email\" type=\"email\" placeholder=\"Email\" /\u003e\r\n  @if (f.email.errors?.[\u0027required\u0027] \u0026\u0026 f.email.touched) {\r\n    \u003cspan\u003eEmail required\u003c/span\u003e\r\n  }\r\n  @if (f.email.errors?.[\u0027email\u0027] \u0026\u0026 f.email.touched) {\r\n    \u003cspan\u003eInvalid email format\u003c/span\u003e\r\n  }\r\n\r\n  \u003cinput formControlName=\"password\" type=\"password\" placeholder=\"Password\" /\u003e\r\n  @if (f.password.errors?.[\u0027weakPassword\u0027] \u0026\u0026 f.password.touched) {\r\n    \u003cspan\u003ePassword needs uppercase + number\u003c/span\u003e\r\n  }\r\n\r\n  \u003cinput formControlName=\"confirm\" type=\"password\" placeholder=\"Confirm password\" /\u003e\r\n  @if (form.errors?.[\u0027mismatch\u0027] \u0026\u0026 f.confirm.touched) {\r\n    \u003cspan\u003ePasswords do not match\u003c/span\u003e\r\n  }\r\n\r\n  \u003clabel\u003e\r\n    \u003cinput type=\"checkbox\" formControlName=\"agree\" /\u003e\r\n    I agree to the terms\r\n  \u003c/label\u003e\r\n\r\n  \u003cbutton type=\"submit\" [disabled]=\"form.invalid\"\u003eRegister\u003c/button\u003e\r\n\u003c/form\u003e\r\n```\r\n\r\n---\r\n\r\n## 4. Built-in Validators\r\n\r\n```typescript\r\nimport { Validators } from \u0027@angular/forms\u0027;\r\n\r\nValidators.required\r\nValidators.requiredTrue          // for checkboxes\r\nValidators.email\r\nValidators.minLength(n)\r\nValidators.maxLength(n)\r\nValidators.min(n)                // numeric\r\nValidators.max(n)\r\nValidators.pattern(/regex/)\r\nValidators.nullValidator         // always valid (no-op)\r\n```\r\n\r\n---\r\n\r\n## 5. Custom Validators\r\n\r\n### Sync Validator\r\n\r\n```typescript\r\n// validators/no-spaces.validator.ts\r\nimport { AbstractControl, ValidationErrors } from \u0027@angular/forms\u0027;\r\n\r\nexport function noSpaces(control: AbstractControl): ValidationErrors | null {\r\n  const hasSpaces = (control.value as string)?.includes(\u0027 \u0027);\r\n  return hasSpaces ? { noSpaces: true } : null;\r\n}\r\n```\r\n\r\n```typescript\r\nusername: [\u0027\u0027, [Validators.required, noSpaces]],\r\n```\r\n\r\n### Validator with Parameters\r\n\r\n```typescript\r\nexport function forbiddenWords(words: string[]) {\r\n  return (control: AbstractControl): ValidationErrors | null =\u003e {\r\n    const found = words.find(w =\u003e\r\n      control.value?.toLowerCase().includes(w.toLowerCase())\r\n    );\r\n    return found ? { forbiddenWord: { word: found } } : null;\r\n  };\r\n}\r\n\r\n// usage\r\nusername: [\u0027\u0027, forbiddenWords([\u0027admin\u0027, \u0027root\u0027, \u0027system\u0027])],\r\n```\r\n\r\n### Async Validator — Check Uniqueness via API\r\n\r\n```typescript\r\n// validators/unique-email.validator.ts\r\nimport { inject }            from \u0027@angular/core\u0027;\r\nimport { AbstractControl }   from \u0027@angular/forms\u0027;\r\nimport { UserService }       from \u0027../services/user.service\u0027;\r\nimport { debounceTime, distinctUntilChanged, switchMap, map, first } from \u0027rxjs\u0027;\r\n\r\nexport function uniqueEmailValidator(userService: UserService) {\r\n  return (control: AbstractControl) =\u003e\r\n    control.valueChanges.pipe(\r\n      debounceTime(400),\r\n      distinctUntilChanged(),\r\n      switchMap(email =\u003e userService.checkEmailAvailable(email)),\r\n      map(available =\u003e (available ? null : { emailTaken: true })),\r\n      first(),\r\n    );\r\n}\r\n```\r\n\r\n```typescript\r\nemail: [\u0027\u0027, [Validators.required, Validators.email],\r\n        [uniqueEmailValidator(this.userService)]],\r\n```\r\n\r\n---\r\n\r\n## 6. FormArray — Dynamic Lists\r\n\r\n```typescript\r\nimport { FormArray, FormGroup, FormControl, FormBuilder, Validators } from \u0027@angular/forms\u0027;\r\n\r\n@Component({ ... })\r\nexport class OrderFormComponent {\r\n  private fb = inject(FormBuilder);\r\n\r\n  form = this.fb.group({\r\n    customerName: [\u0027\u0027, Validators.required],\r\n    items: this.fb.array([this.newItem()]),\r\n  });\r\n\r\n  get items(): FormArray {\r\n    return this.form.get(\u0027items\u0027) as FormArray;\r\n  }\r\n\r\n  newItem(): FormGroup {\r\n    return this.fb.group({\r\n      productId: [null, Validators.required],\r\n      quantity:  [1,    [Validators.required, Validators.min(1)]],\r\n    });\r\n  }\r\n\r\n  addItem()          { this.items.push(this.newItem()); }\r\n  removeItem(i: number) { this.items.removeAt(i); }\r\n}\r\n```\r\n\r\n```html\r\n\u003cdiv formArrayName=\"items\"\u003e\r\n  @for (item of items.controls; track $index; let i = $index) {\r\n    \u003cdiv [formGroupName]=\"i\" class=\"item-row\"\u003e\r\n      \u003cselect formControlName=\"productId\"\u003e\r\n        @for (p of products; track p.id) {\r\n          \u003coption [value]=\"p.id\"\u003e{{ p.name }}\u003c/option\u003e\r\n        }\r\n      \u003c/select\u003e\r\n      \u003cinput type=\"number\" formControlName=\"quantity\" /\u003e\r\n      \u003cbutton type=\"button\" (click)=\"removeItem(i)\"\u003eRemove\u003c/button\u003e\r\n    \u003c/div\u003e\r\n  }\r\n  \u003cbutton type=\"button\" (click)=\"addItem()\"\u003e+ Add Item\u003c/button\u003e\r\n\u003c/div\u003e\r\n```\r\n\r\n---\r\n\r\n## 7. Typed Reactive Forms (Angular 14+)\r\n\r\n```typescript\r\nimport { FormControl, FormGroup } from \u0027@angular/forms\u0027;\r\n\r\n// Fully typed — TypeScript knows every field\u0027s type\r\nconst form = new FormGroup({\r\n  email:    new FormControl\u003cstring\u003e(\u0027\u0027, { nonNullable: true }),\r\n  age:      new FormControl\u003cnumber | null\u003e(null),\r\n  agree:    new FormControl\u003cboolean\u003e(false, { nonNullable: true }),\r\n});\r\n\r\n// TypeScript infers: { email: string; age: number | null; agree: boolean }\r\nconst value = form.getRawValue();\r\n```\r\n\r\n### Using `FormBuilder` with types\r\n\r\n```typescript\r\nconst fb = inject(FormBuilder);\r\n\r\nconst form = fb.nonNullable.group({\r\n  username: [\u0027\u0027, Validators.required],   // FormControl\u003cstring\u003e\r\n  age:      [0,  Validators.min(0)],     // FormControl\u003cnumber\u003e\r\n});\r\n// All fields are non-nullable with nonNullable.group()\r\n```\r\n\r\n---\r\n\r\n## 8. Reacting to Value Changes\r\n\r\n```typescript\r\n// Listen to entire form\r\nthis.form.valueChanges.subscribe(value =\u003e {\r\n  console.log(\u0027Form changed:\u0027, value);\r\n});\r\n\r\n// Listen to single control\r\nthis.form.get(\u0027email\u0027)!.valueChanges\r\n  .pipe(debounceTime(300), distinctUntilChanged())\r\n  .subscribe(email =\u003e this.checkEmail(email));\r\n\r\n// With takeUntilDestroyed (Angular 16+)\r\nimport { takeUntilDestroyed } from \u0027@angular/core/rxjs-interop\u0027;\r\n\r\nthis.form.valueChanges.pipe(\r\n  takeUntilDestroyed()   // auto-unsubscribes when component destroyed\r\n).subscribe(console.log);\r\n```\r\n\r\n---\r\n\r\n## 9. Patching vs Setting Values\r\n\r\n```typescript\r\n// setValue — must provide ALL fields\r\nthis.form.setValue({\r\n  firstName: \u0027John\u0027,\r\n  lastName: \u0027Doe\u0027,\r\n  email: \u0027john@example.com\u0027,\r\n  password: \u0027\u0027,\r\n  confirm: \u0027\u0027,\r\n  agree: false,\r\n});\r\n\r\n// patchValue — partial update, only named fields change\r\nthis.form.patchValue({\r\n  firstName: \u0027John\u0027,\r\n  email: \u0027john@example.com\u0027,\r\n});\r\n\r\n// Reset to initial values\r\nthis.form.reset();\r\n\r\n// Reset to specific values\r\nthis.form.reset({ email: \u0027default@example.com\u0027 });\r\n```\r\n\r\n---\r\n\r\n## 10. Complete Registration Form Example\r\n\r\n```typescript\r\n// register.component.ts\r\nimport { Component, inject, signal } from \u0027@angular/core\u0027;\r\nimport { FormBuilder, Validators, ReactiveFormsModule, AbstractControl } from \u0027@angular/forms\u0027;\r\nimport { Router } from \u0027@angular/router\u0027;\r\nimport { AuthService } from \u0027../../core/services/auth.service\u0027;\r\nimport { takeUntilDestroyed } from \u0027@angular/core/rxjs-interop\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-register\u0027,\r\n  standalone: true,\r\n  imports: [ReactiveFormsModule],\r\n  templateUrl: \u0027./register.component.html\u0027,\r\n})\r\nexport class RegisterComponent {\r\n  private fb      = inject(FormBuilder);\r\n  private auth    = inject(AuthService);\r\n  private router  = inject(Router);\r\n\r\n  isLoading = signal(false);\r\n  serverError = signal(\u0027\u0027);\r\n\r\n  form = this.fb.nonNullable.group({\r\n    firstName: [\u0027\u0027, [Validators.required, Validators.minLength(2)]],\r\n    lastName:  [\u0027\u0027, Validators.required],\r\n    email:     [\u0027\u0027, [Validators.required, Validators.email]],\r\n    password:  [\u0027\u0027, [Validators.required, Validators.minLength(8),\r\n                     Validators.pattern(/^(?=.*[A-Z])(?=.*[0-9]).*$/)]],\r\n    confirm:   [\u0027\u0027, Validators.required],\r\n  }, { validators: (g: AbstractControl) =\u003e {\r\n    const pw  = g.get(\u0027password\u0027)?.value;\r\n    const cfm = g.get(\u0027confirm\u0027)?.value;\r\n    return pw === cfm ? null : { mismatch: true };\r\n  }});\r\n\r\n  get f() { return this.form.controls; }\r\n\r\n  async onSubmit() {\r\n    if (this.form.invalid) { this.form.markAllAsTouched(); return; }\r\n    this.isLoading.set(true);\r\n    this.serverError.set(\u0027\u0027);\r\n\r\n    try {\r\n      const { confirm, ...payload } = this.form.getRawValue();\r\n      await this.auth.register(payload);\r\n      this.router.navigate([\u0027/account\u0027]);\r\n    } catch (err: any) {\r\n      this.serverError.set(err.message ?? \u0027Registration failed\u0027);\r\n    } finally {\r\n      this.isLoading.set(false);\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Concept | Template-Driven | Reactive |\r\n|---------|----------------|---------|\r\n| Bind control | `ngModel` | `formControlName` |\r\n| Group controls | `ngForm` | `FormGroup` |\r\n| Dynamic lists | not ideal | `FormArray` |\r\n| Custom validators | directive | function |\r\n| Async validators | directive | async function array |\r\n| Value access | template variable | `form.getRawValue()` |\r\n\r\n**Next:** [07 — HTTP Client →](./07-http-client.md)\r\n",
  "07-http-client": "# Chapter 07 — HTTP Client\r\n\r\n---\r\n\r\n## 1. Setup\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { provideHttpClient, withInterceptors, withFetch } from \u0027@angular/common/http\u0027;\r\n\r\nexport const appConfig: ApplicationConfig = {\r\n  providers: [\r\n    provideHttpClient(\r\n      withFetch(),                            // use fetch API instead of XHR (Angular 18+)\r\n      withInterceptors([authInterceptor, errorInterceptor]),\r\n    ),\r\n  ],\r\n};\r\n```\r\n\r\n---\r\n\r\n## 2. Basic HTTP Calls\r\n\r\n```typescript\r\nimport { Injectable, inject }  from \u0027@angular/core\u0027;\r\nimport { HttpClient }          from \u0027@angular/common/http\u0027;\r\nimport { Observable }          from \u0027rxjs\u0027;\r\nimport { environment }         from \u0027../../environments/environment\u0027;\r\nimport { Product }             from \u0027../models/product.model\u0027;\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class ProductService {\r\n  private http   = inject(HttpClient);\r\n  private apiUrl = `${environment.apiUrl}/products`;\r\n\r\n  getAll(): Observable\u003cProduct[]\u003e {\r\n    return this.http.get\u003cProduct[]\u003e(this.apiUrl);\r\n  }\r\n\r\n  getById(id: number): Observable\u003cProduct\u003e {\r\n    return this.http.get\u003cProduct\u003e(`${this.apiUrl}/${id}`);\r\n  }\r\n\r\n  create(dto: Omit\u003cProduct, \u0027id\u0027\u003e): Observable\u003cProduct\u003e {\r\n    return this.http.post\u003cProduct\u003e(this.apiUrl, dto);\r\n  }\r\n\r\n  update(id: number, dto: Partial\u003cProduct\u003e): Observable\u003cProduct\u003e {\r\n    return this.http.put\u003cProduct\u003e(`${this.apiUrl}/${id}`, dto);\r\n  }\r\n\r\n  patch(id: number, dto: Partial\u003cProduct\u003e): Observable\u003cProduct\u003e {\r\n    return this.http.patch\u003cProduct\u003e(`${this.apiUrl}/${id}`, dto);\r\n  }\r\n\r\n  delete(id: number): Observable\u003cvoid\u003e {\r\n    return this.http.delete\u003cvoid\u003e(`${this.apiUrl}/${id}`);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 3. Consuming HTTP in a Component\r\n\r\n### With `async` pipe (preferred — no manual subscribe/unsubscribe)\r\n\r\n```typescript\r\n@Component({\r\n  selector: \u0027app-product-list\u0027,\r\n  standalone: true,\r\n  imports: [AsyncPipe, ProductCardComponent],\r\n  template: `\r\n    @if (products$ | async; as products) {\r\n      @for (p of products; track p.id) {\r\n        \u003capp-product-card [product]=\"p\" /\u003e\r\n      }\r\n    } @else {\r\n      \u003capp-spinner /\u003e\r\n    }\r\n  `,\r\n})\r\nexport class ProductListComponent {\r\n  private service = inject(ProductService);\r\n  products$ = this.service.getAll();\r\n}\r\n```\r\n\r\n### With Signals + `toSignal` (Angular 16+)\r\n\r\n```typescript\r\nimport { toSignal } from \u0027@angular/core/rxjs-interop\u0027;\r\n\r\n@Component({ ... })\r\nexport class ProductListComponent {\r\n  private service = inject(ProductService);\r\n\r\n  products = toSignal(this.service.getAll(), { initialValue: [] });\r\n  // products() is now a regular signal — no async pipe needed in template\r\n}\r\n```\r\n\r\n```html\r\n@for (p of products(); track p.id) {\r\n  \u003capp-product-card [product]=\"p\" /\u003e\r\n}\r\n```\r\n\r\n---\r\n\r\n## 4. Query Parameters \u0026 Headers\r\n\r\n```typescript\r\nimport { HttpParams, HttpHeaders } from \u0027@angular/common/http\u0027;\r\n\r\ngetFiltered(filters: { category?: string; minPrice?: number; page?: number }) {\r\n  let params = new HttpParams();\r\n\r\n  if (filters.category) params = params.set(\u0027category\u0027, filters.category);\r\n  if (filters.minPrice) params = params.set(\u0027minPrice\u0027, filters.minPrice);\r\n  if (filters.page)     params = params.set(\u0027page\u0027,     filters.page);\r\n\r\n  const headers = new HttpHeaders({ \u0027X-Custom-Header\u0027: \u0027MyApp\u0027 });\r\n\r\n  return this.http.get\u003cProduct[]\u003e(this.apiUrl, { params, headers });\r\n}\r\n```\r\n\r\n---\r\n\r\n## 5. Full HTTP Response (status, headers)\r\n\r\n```typescript\r\nimport { HttpResponse } from \u0027@angular/common/http\u0027;\r\n\r\ngetWithMeta(): Observable\u003cHttpResponse\u003cProduct[]\u003e\u003e {\r\n  return this.http.get\u003cProduct[]\u003e(this.apiUrl, { observe: \u0027response\u0027 });\r\n}\r\n\r\n// Usage\r\nthis.service.getWithMeta().subscribe(response =\u003e {\r\n  console.log(\u0027Status:\u0027, response.status);\r\n  console.log(\u0027Total:\u0027, response.headers.get(\u0027X-Total-Count\u0027));\r\n  console.log(\u0027Body:\u0027, response.body);\r\n});\r\n```\r\n\r\n---\r\n\r\n## 6. Upload Progress\r\n\r\n```typescript\r\nimport { HttpEventType, HttpEvent } from \u0027@angular/common/http\u0027;\r\n\r\nuploadFile(file: File): Observable\u003cnumber\u003e {\r\n  const formData = new FormData();\r\n  formData.append(\u0027file\u0027, file);\r\n\r\n  return this.http.post(\u0027/api/upload\u0027, formData, {\r\n    reportProgress: true,\r\n    observe: \u0027events\u0027,\r\n  }).pipe(\r\n    map((event: HttpEvent\u003cany\u003e) =\u003e {\r\n      if (event.type === HttpEventType.UploadProgress \u0026\u0026 event.total) {\r\n        return Math.round(100 * event.loaded / event.total);\r\n      }\r\n      return 0;\r\n    }),\r\n  );\r\n}\r\n```\r\n\r\n---\r\n\r\n## 7. RxJS Operators for HTTP\r\n\r\n### `catchError` — handle errors\r\n\r\n```typescript\r\nimport { catchError, throwError } from \u0027rxjs\u0027;\r\n\r\ngetAll(): Observable\u003cProduct[]\u003e {\r\n  return this.http.get\u003cProduct[]\u003e(this.apiUrl).pipe(\r\n    catchError(err =\u003e {\r\n      console.error(\u0027HTTP error:\u0027, err);\r\n      return throwError(() =\u003e new Error(err.error?.message ?? \u0027Server error\u0027));\r\n    }),\r\n  );\r\n}\r\n```\r\n\r\n### `retry` — automatic retries\r\n\r\n```typescript\r\nimport { retry, catchError } from \u0027rxjs\u0027;\r\n\r\ngetAll() {\r\n  return this.http.get\u003cProduct[]\u003e(this.apiUrl).pipe(\r\n    retry({ count: 3, delay: 1000 }),   // retry 3 times with 1s delay\r\n    catchError(err =\u003e throwError(() =\u003e err)),\r\n  );\r\n}\r\n```\r\n\r\n### `switchMap` — cancel previous request on new emission\r\n\r\n```typescript\r\n// Search with debounce — cancels inflight request on each new keystroke\r\nsearchCtrl.valueChanges.pipe(\r\n  debounceTime(300),\r\n  distinctUntilChanged(),\r\n  switchMap(term =\u003e this.productService.search(term)),\r\n).subscribe(results =\u003e this.results.set(results));\r\n```\r\n\r\n### `forkJoin` — parallel requests\r\n\r\n```typescript\r\nimport { forkJoin } from \u0027rxjs\u0027;\r\n\r\n// Fires all requests simultaneously, emits when ALL complete\r\nconst init$ = forkJoin({\r\n  products:   this.productService.getAll(),\r\n  categories: this.categoryService.getAll(),\r\n  user:       this.userService.getCurrent(),\r\n});\r\n\r\ninit$.subscribe(({ products, categories, user }) =\u003e {\r\n  this.products.set(products);\r\n  this.categories.set(categories);\r\n  this.user.set(user);\r\n});\r\n```\r\n\r\n### `tap` — side-effects without modifying data\r\n\r\n```typescript\r\nreturn this.http.get\u003cProduct[]\u003e(this.apiUrl).pipe(\r\n  tap(products =\u003e console.log(\u0027Fetched:\u0027, products.length)),\r\n  map(products =\u003e products.filter(p =\u003e p.inStock)),\r\n);\r\n```\r\n\r\n---\r\n\r\n## 8. HTTP Interceptors (functional, Angular 15+)\r\n\r\nInterceptors run for every HTTP request/response in the app.\r\n\r\n### Auth Interceptor — attach JWT token\r\n\r\n```typescript\r\n// auth.interceptor.ts\r\nimport { HttpInterceptorFn } from \u0027@angular/common/http\u0027;\r\nimport { inject }            from \u0027@angular/core\u0027;\r\nimport { AuthService }       from \u0027../services/auth.service\u0027;\r\n\r\nexport const authInterceptor: HttpInterceptorFn = (req, next) =\u003e {\r\n  const token = inject(AuthService).getToken();\r\n\r\n  if (!token) return next(req);\r\n\r\n  const cloned = req.clone({\r\n    headers: req.headers.set(\u0027Authorization\u0027, `Bearer ${token}`),\r\n  });\r\n\r\n  return next(cloned);\r\n};\r\n```\r\n\r\n### Loading Interceptor — show/hide spinner\r\n\r\n```typescript\r\n// loading.interceptor.ts\r\nimport { HttpInterceptorFn } from \u0027@angular/common/http\u0027;\r\nimport { inject }            from \u0027@angular/core\u0027;\r\nimport { LoadingService }    from \u0027../services/loading.service\u0027;\r\nimport { finalize }          from \u0027rxjs\u0027;\r\n\r\nexport const loadingInterceptor: HttpInterceptorFn = (req, next) =\u003e {\r\n  const loader = inject(LoadingService);\r\n  loader.show();\r\n  return next(req).pipe(finalize(() =\u003e loader.hide()));\r\n};\r\n```\r\n\r\n### Error Interceptor — global error handling\r\n\r\n```typescript\r\n// error.interceptor.ts\r\nimport { HttpInterceptorFn, HttpErrorResponse } from \u0027@angular/common/http\u0027;\r\nimport { inject }           from \u0027@angular/core\u0027;\r\nimport { Router }           from \u0027@angular/router\u0027;\r\nimport { catchError, throwError } from \u0027rxjs\u0027;\r\n\r\nexport const errorInterceptor: HttpInterceptorFn = (req, next) =\u003e {\r\n  const router = inject(Router);\r\n\r\n  return next(req).pipe(\r\n    catchError((err: HttpErrorResponse) =\u003e {\r\n      switch (err.status) {\r\n        case 401:\r\n          router.navigate([\u0027/login\u0027]);\r\n          break;\r\n        case 403:\r\n          router.navigate([\u0027/forbidden\u0027]);\r\n          break;\r\n        case 404:\r\n          router.navigate([\u0027/not-found\u0027]);\r\n          break;\r\n        case 500:\r\n          router.navigate([\u0027/server-error\u0027], { state: { error: err } });\r\n          break;\r\n      }\r\n      return throwError(() =\u003e err);\r\n    }),\r\n  );\r\n};\r\n```\r\n\r\n### Caching Interceptor\r\n\r\n```typescript\r\n// cache.interceptor.ts\r\nimport { HttpInterceptorFn, HttpResponse } from \u0027@angular/common/http\u0027;\r\nimport { inject }  from \u0027@angular/core\u0027;\r\nimport { of, tap } from \u0027rxjs\u0027;\r\n\r\n// Simple in-memory cache\r\nconst cache = new Map\u003cstring, HttpResponse\u003cany\u003e\u003e();\r\n\r\nexport const cacheInterceptor: HttpInterceptorFn = (req, next) =\u003e {\r\n  if (req.method !== \u0027GET\u0027) return next(req);\r\n\r\n  const cached = cache.get(req.url);\r\n  if (cached) return of(cached);\r\n\r\n  return next(req).pipe(\r\n    tap(event =\u003e {\r\n      if (event instanceof HttpResponse) {\r\n        cache.set(req.url, event);\r\n      }\r\n    }),\r\n  );\r\n};\r\n```\r\n\r\n### Registering interceptors\r\n\r\n```typescript\r\n// app.config.ts\r\nprovideHttpClient(\r\n  withInterceptors([\r\n    authInterceptor,\r\n    loadingInterceptor,\r\n    errorInterceptor,\r\n    cacheInterceptor,\r\n  ]),\r\n)\r\n```\r\n\r\n\u003e Interceptors run in **registration order** on the way **out** and in **reverse order** on the way **back**.\r\n\r\n---\r\n\r\n## 9. Loading Service\r\n\r\n```typescript\r\n// loading.service.ts\r\nimport { Injectable, signal, computed } from \u0027@angular/core\u0027;\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class LoadingService {\r\n  private _count = signal(0);\r\n\r\n  isLoading = computed(() =\u003e this._count() \u003e 0);\r\n\r\n  show() { this._count.update(n =\u003e n + 1); }\r\n  hide() { this._count.update(n =\u003e Math.max(0, n - 1)); }\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- app.component.html --\u003e\r\n@if (loadingService.isLoading()) {\r\n  \u003cdiv class=\"loading-bar\"\u003e\u003c/div\u003e\r\n}\r\n```\r\n\r\n---\r\n\r\n## 10. Typed API Response Wrapper\r\n\r\n```typescript\r\n// models/api-response.model.ts\r\nexport interface PagedResult\u003cT\u003e {\r\n  data: T[];\r\n  pagination: {\r\n    pageIndex: number;\r\n    pageSize: number;\r\n    count: number;\r\n    totalPages: number;\r\n  };\r\n}\r\n```\r\n\r\n```typescript\r\n// product.service.ts\r\ngetPagedProducts(params: {\r\n  pageIndex: number;\r\n  pageSize: number;\r\n  search?: string;\r\n  sort?: string;\r\n}): Observable\u003cPagedResult\u003cProduct\u003e\u003e {\r\n  let httpParams = new HttpParams()\r\n    .set(\u0027pageIndex\u0027, params.pageIndex)\r\n    .set(\u0027pageSize\u0027,  params.pageSize);\r\n\r\n  if (params.search) httpParams = httpParams.set(\u0027search\u0027, params.search);\r\n  if (params.sort)   httpParams = httpParams.set(\u0027sort\u0027,   params.sort);\r\n\r\n  return this.http.get\u003cPagedResult\u003cProduct\u003e\u003e(this.apiUrl, { params: httpParams });\r\n}\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Task | API |\r\n|------|-----|\r\n| Setup | `provideHttpClient(withFetch(), withInterceptors([...]))` |\r\n| GET / POST / PUT / DELETE | `http.get\u003cT\u003e()`, `http.post\u003cT\u003e()` … |\r\n| Query params | `new HttpParams().set(key, value)` |\r\n| Custom headers | `new HttpHeaders({ key: value })` |\r\n| Interceptors | `HttpInterceptorFn` — functional |\r\n| Error handling | `catchError` operator |\r\n| Parallel requests | `forkJoin` |\r\n| Cancel on new | `switchMap` |\r\n| Signals integration | `toSignal(observable$)` |\r\n\r\n**Next:** [08 — Signals \u0026 State Management →](./08-signals-state.md)\r\n",
  "08-signals-state": "# Chapter 08 — Signals \u0026 State Management\r\n\r\n---\r\n\r\n## PART A — Angular Signals\r\n\r\nSignals are Angular\u0027s **built-in fine-grained reactivity system** (stable since Angular 17).  \r\nThey replace Zone.js-based change detection for most use cases.\r\n\r\n---\r\n\r\n### 1. `signal()` — Writable Signal\r\n\r\n```typescript\r\nimport { signal } from \u0027@angular/core\u0027;\r\n\r\n// Create\r\nconst count = signal(0);\r\n\r\n// Read — always call as a function\r\nconsole.log(count()); // 0\r\n\r\n// Write\r\ncount.set(5);         // replace value\r\ncount.update(n =\u003e n + 1);  // update based on current value\r\n\r\n// Mutate (for objects/arrays — avoid if possible, prefer immutable updates)\r\nconst list = signal\u003cstring[]\u003e([]);\r\nlist.mutate(arr =\u003e arr.push(\u0027item\u0027));  // mutates in place (use with caution)\r\n```\r\n\r\n### 2. `computed()` — Derived Signal\r\n\r\nAutomatically recalculates when its dependencies change.\r\n\r\n```typescript\r\nimport { signal, computed } from \u0027@angular/core\u0027;\r\n\r\nconst firstName = signal(\u0027John\u0027);\r\nconst lastName  = signal(\u0027Doe\u0027);\r\n\r\n// Automatically recomputes when firstName or lastName changes\r\nconst fullName  = computed(() =\u003e `${firstName()} ${lastName()}`);\r\n\r\nconsole.log(fullName()); // \"John Doe\"\r\nfirstName.set(\u0027Jane\u0027);\r\nconsole.log(fullName()); // \"Jane Doe\"\r\n```\r\n\r\n\u003e `computed()` is **lazy** (recalculates only when read) and **memoized** (same dependencies → same value, no recalculation).\r\n\r\n### 3. `effect()` — Side Effects\r\n\r\nRuns a function whenever its signal dependencies change.\r\n\r\n```typescript\r\nimport { signal, effect, Component, OnInit } from \u0027@angular/core\u0027;\r\n\r\n@Component({ ... })\r\nexport class ThemeComponent implements OnInit {\r\n  theme = signal\u003c\u0027light\u0027 | \u0027dark\u0027\u003e(\u0027light\u0027);\r\n\r\n  ngOnInit() {\r\n    // Runs immediately, then re-runs when `theme` changes\r\n    effect(() =\u003e {\r\n      document.body.className = `theme-${this.theme()}`;\r\n      localStorage.setItem(\u0027theme\u0027, this.theme());\r\n    });\r\n  }\r\n}\r\n```\r\n\r\n\u003e **Cleanup:** return a cleanup function from `effect()` when needed:\r\n\r\n```typescript\r\neffect((onCleanup) =\u003e {\r\n  const timer = setInterval(() =\u003e console.log(\u0027tick\u0027), 1000);\r\n  onCleanup(() =\u003e clearInterval(timer));\r\n});\r\n```\r\n\r\n### 4. `toSignal()` — Observable → Signal\r\n\r\n```typescript\r\nimport { toSignal }    from \u0027@angular/core/rxjs-interop\u0027;\r\nimport { HttpClient }  from \u0027@angular/common/http\u0027;\r\n\r\n@Component({ ... })\r\nexport class ProductListComponent {\r\n  private http = inject(HttpClient);\r\n\r\n  // No async pipe needed — use directly in template\r\n  products = toSignal(\r\n    this.http.get\u003cProduct[]\u003e(\u0027/api/products\u0027),\r\n    { initialValue: [] as Product[] }\r\n  );\r\n}\r\n```\r\n\r\n```html\r\n@for (p of products(); track p.id) { ... }\r\n```\r\n\r\n### 5. `toObservable()` — Signal → Observable\r\n\r\n```typescript\r\nimport { toObservable } from \u0027@angular/core/rxjs-interop\u0027;\r\n\r\n@Component({ ... })\r\nexport class SearchComponent {\r\n  searchTerm = signal(\u0027\u0027);\r\n\r\n  results$ = toObservable(this.searchTerm).pipe(\r\n    debounceTime(300),\r\n    distinctUntilChanged(),\r\n    switchMap(term =\u003e this.productService.search(term)),\r\n  );\r\n}\r\n```\r\n\r\n### 6. `input()`, `output()`, `model()` Signals\r\n\r\n```typescript\r\nimport { Component, input, output, model } from \u0027@angular/core\u0027;\r\n\r\n@Component({ selector: \u0027app-slider\u0027, standalone: true, template: `\r\n  \u003cinput type=\"range\" [value]=\"value()\" (input)=\"value.set(+$event.target.value)\" /\u003e\r\n`})\r\nexport class SliderComponent {\r\n  // Signal input — read only, set by parent\r\n  min   = input(0);\r\n  max   = input(100);\r\n\r\n  // Two-way signal (replaces @Input + @Output combo)\r\n  value = model(50);  // parent binds with [(value)]=\"myVar\"\r\n\r\n  // Signal output — emits events to parent\r\n  changed = output\u003cnumber\u003e();\r\n}\r\n```\r\n\r\n---\r\n\r\n## PART B — Zoneless Angular (Angular 18+)\r\n\r\nRemove Zone.js entirely for maximum performance:\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { provideExperimentalZonelessChangeDetection } from \u0027@angular/core\u0027;\r\n\r\nexport const appConfig: ApplicationConfig = {\r\n  providers: [\r\n    provideExperimentalZonelessChangeDetection(),  // no zone.js needed\r\n    provideRouter(routes),\r\n  ],\r\n};\r\n```\r\n\r\n```json\r\n// Remove from polyfills.ts\r\n// import \u0027zone.js\u0027;  ← delete this line\r\n```\r\n\r\nWith zoneless Angular, **only signals and async pipe** trigger change detection.\r\n\r\n---\r\n\r\n## PART C — State Management Patterns\r\n\r\n### Pattern 1 — Service with Signals (simple apps)\r\n\r\n```typescript\r\n// store/product.state.ts\r\nimport { Injectable, signal, computed } from \u0027@angular/core\u0027;\r\nimport { HttpClient }                   from \u0027@angular/common/http\u0027;\r\nimport { inject }                       from \u0027@angular/core\u0027;\r\n\r\nexport interface ProductState {\r\n  products: Product[];\r\n  loading:  boolean;\r\n  error:    string | null;\r\n  selected: Product | null;\r\n}\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class ProductStateService {\r\n  private http = inject(HttpClient);\r\n\r\n  // State\r\n  private state = signal\u003cProductState\u003e({\r\n    products: [],\r\n    loading: false,\r\n    error: null,\r\n    selected: null,\r\n  });\r\n\r\n  // Selectors\r\n  products = computed(() =\u003e this.state().products);\r\n  loading  = computed(() =\u003e this.state().loading);\r\n  error    = computed(() =\u003e this.state().error);\r\n  selected = computed(() =\u003e this.state().selected);\r\n\r\n  // Actions\r\n  async loadProducts() {\r\n    this.state.update(s =\u003e ({ ...s, loading: true, error: null }));\r\n    try {\r\n      const products = await this.http.get\u003cProduct[]\u003e(\u0027/api/products\u0027).toPromise();\r\n      this.state.update(s =\u003e ({ ...s, products: products!, loading: false }));\r\n    } catch (err: any) {\r\n      this.state.update(s =\u003e ({ ...s, loading: false, error: err.message }));\r\n    }\r\n  }\r\n\r\n  selectProduct(product: Product) {\r\n    this.state.update(s =\u003e ({ ...s, selected: product }));\r\n  }\r\n\r\n  clearSelection() {\r\n    this.state.update(s =\u003e ({ ...s, selected: null }));\r\n  }\r\n}\r\n```\r\n\r\n### Pattern 2 — NgRx SignalStore (Angular 20 recommended)\r\n\r\n\u003e Install: `npm install @ngrx/signals`\r\n\r\n```typescript\r\n// store/product.store.ts\r\nimport { signalStore, withState, withComputed, withMethods } from \u0027@ngrx/signals\u0027;\r\nimport { withEntities, setAllEntities, selectEntity }        from \u0027@ngrx/signals/entities\u0027;\r\nimport { rxMethod }                                           from \u0027@ngrx/signals/rxjs-interop\u0027;\r\nimport { computed, inject }                                   from \u0027@angular/core\u0027;\r\nimport { switchMap, tap }                                     from \u0027rxjs\u0027;\r\nimport { ProductService }                                     from \u0027../services/product.service\u0027;\r\n\r\n// Entity type\r\ninterface Product { id: number; name: string; price: number; }\r\n\r\n// State shape\r\ninterface ProductState {\r\n  loading: boolean;\r\n  error:   string | null;\r\n  filter:  string;\r\n}\r\n\r\nexport const ProductStore = signalStore(\r\n  { providedIn: \u0027root\u0027 },\r\n\r\n  withEntities\u003cProduct\u003e(),                      // id-indexed entity map + helpers\r\n  withState\u003cProductState\u003e({\r\n    loading: false,\r\n    error: null,\r\n    filter: \u0027\u0027,\r\n  }),\r\n\r\n  withComputed(({ entities, filter }) =\u003e ({\r\n    filteredProducts: computed(() =\u003e\r\n      entities().filter(p =\u003e\r\n        p.name.toLowerCase().includes(filter().toLowerCase())\r\n      )\r\n    ),\r\n    totalCount: computed(() =\u003e entities().length),\r\n  })),\r\n\r\n  withMethods((store) =\u003e {\r\n    const service = inject(ProductService);\r\n    return {\r\n      loadProducts: rxMethod\u003cvoid\u003e(\r\n        switchMap(() =\u003e service.getAll().pipe(\r\n          tap({\r\n            next:  (products) =\u003e patchState(store, setAllEntities(products)),\r\n            error: (err)      =\u003e patchState(store, { error: err.message }),\r\n          })\r\n        ))\r\n      ),\r\n      setFilter(filter: string) {\r\n        patchState(store, { filter });\r\n      },\r\n    };\r\n  }),\r\n);\r\n```\r\n\r\n```typescript\r\n// product-list.component.ts\r\nimport { Component, inject, OnInit } from \u0027@angular/core\u0027;\r\nimport { ProductStore }               from \u0027../store/product.store\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-list\u0027,\r\n  standalone: true,\r\n  template: `\r\n    \u003cinput (input)=\"store.setFilter($event.target.value)\" placeholder=\"Filter...\" /\u003e\r\n    \u003cp\u003eTotal: {{ store.totalCount() }}\u003c/p\u003e\r\n    @for (p of store.filteredProducts(); track p.id) {\r\n      \u003capp-product-card [product]=\"p\" /\u003e\r\n    }\r\n  `,\r\n})\r\nexport class ProductListComponent implements OnInit {\r\n  store = inject(ProductStore);\r\n\r\n  ngOnInit() {\r\n    this.store.loadProducts();\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n### Pattern 3 — Classic NgRx Store (large apps)\r\n\r\n\u003e Install: `npm install @ngrx/store @ngrx/effects @ngrx/entity`\r\n\r\n```typescript\r\n// products/products.actions.ts\r\nimport { createAction, props } from \u0027@ngrx/store\u0027;\r\n\r\nexport const loadProducts        = createAction(\u0027[Products] Load\u0027);\r\nexport const loadProductsSuccess = createAction(\u0027[Products] Load Success\u0027, props\u003c{ products: Product[] }\u003e());\r\nexport const loadProductsFailure = createAction(\u0027[Products] Load Failure\u0027, props\u003c{ error: string }\u003e());\r\n```\r\n\r\n```typescript\r\n// products/products.reducer.ts\r\nimport { createReducer, on } from \u0027@ngrx/store\u0027;\r\n\r\ninterface ProductsState { products: Product[]; loading: boolean; error: string | null; }\r\nconst initial: ProductsState = { products: [], loading: false, error: null };\r\n\r\nexport const productsReducer = createReducer(\r\n  initial,\r\n  on(loadProducts,        state =\u003e ({ ...state, loading: true })),\r\n  on(loadProductsSuccess, (state, { products }) =\u003e ({ ...state, products, loading: false })),\r\n  on(loadProductsFailure, (state, { error })    =\u003e ({ ...state, error, loading: false })),\r\n);\r\n```\r\n\r\n```typescript\r\n// products/products.effects.ts\r\nimport { Injectable, inject } from \u0027@angular/core\u0027;\r\nimport { Actions, createEffect, ofType } from \u0027@ngrx/effects\u0027;\r\nimport { switchMap, map, catchError, of } from \u0027rxjs\u0027;\r\n\r\n@Injectable()\r\nexport class ProductsEffects {\r\n  private actions$ = inject(Actions);\r\n  private service  = inject(ProductService);\r\n\r\n  loadProducts$ = createEffect(() =\u003e\r\n    this.actions$.pipe(\r\n      ofType(loadProducts),\r\n      switchMap(() =\u003e\r\n        this.service.getAll().pipe(\r\n          map(products =\u003e loadProductsSuccess({ products })),\r\n          catchError(err =\u003e of(loadProductsFailure({ error: err.message }))),\r\n        )\r\n      )\r\n    )\r\n  );\r\n}\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Tool | Best for |\r\n|------|---------|\r\n| `signal()` + `computed()` + `effect()` | Component-level state, UI state |\r\n| Service with signals | Shared state in small/medium apps |\r\n| NgRx SignalStore | Feature-level state in medium/large apps |\r\n| Classic NgRx | Enterprise apps needing Redux DevTools, time-travel |\r\n| `toSignal()` / `toObservable()` | RxJS ↔ Signals bridge |\r\n\r\n**Next:** [09 — Standalone APIs →](./09-standalone.md)\r\n",
  "09-standalone": "# Chapter 09 — Standalone Components \u0026 Modern APIs\r\n\r\n---\r\n\r\n## 1. What is \"Standalone\"?\r\n\r\nBefore Angular 14, every component had to be declared inside an **NgModule**.  \r\nAngular 20 defaults to **standalone**: components manage their own imports directly.\r\n\r\n| NgModule style (old) | Standalone style (modern) |\r\n|---------------------|--------------------------|\r\n| Declare in `declarations: []` | No declaration needed |\r\n| Import modules like `CommonModule` | Import specific directives/pipes |\r\n| `BrowserModule`, `FormsModule` in AppModule | Import per-component |\r\n| Boilerplate `app.module.ts` | `bootstrapApplication()` |\r\n\r\n---\r\n\r\n## 2. Standalone Component\r\n\r\n```typescript\r\nimport { Component }      from \u0027@angular/core\u0027;\r\nimport { NgClass, NgIf }  from \u0027@angular/common\u0027;   // named imports\r\nimport { RouterLink }     from \u0027@angular/router\u0027;\r\nimport { FormsModule }    from \u0027@angular/forms\u0027;\r\nimport { ProductCardComponent } from \u0027./product-card.component\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-list\u0027,\r\n  standalone: true,\r\n  imports: [\r\n    NgClass,\r\n    NgIf,                     // or use @if in template (no import needed)\r\n    RouterLink,\r\n    FormsModule,\r\n    ProductCardComponent,     // import other standalone components\r\n  ],\r\n  templateUrl: \u0027./product-list.component.html\u0027,\r\n})\r\nexport class ProductListComponent { }\r\n```\r\n\r\n\u003e **In Angular 20:** `@if`, `@for`, `@switch` are **built-in** — no `NgIf`/`NgFor` imports required.\r\n\r\n---\r\n\r\n## 3. `bootstrapApplication` — No AppModule\r\n\r\n```typescript\r\n// main.ts\r\nimport { bootstrapApplication } from \u0027@angular/platform-browser\u0027;\r\nimport { AppComponent }         from \u0027./app/app.component\u0027;\r\nimport { appConfig }            from \u0027./app/app.config\u0027;\r\n\r\nbootstrapApplication(AppComponent, appConfig)\r\n  .catch(console.error);\r\n```\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { ApplicationConfig, importProvidersFrom } from \u0027@angular/core\u0027;\r\nimport { provideRouter }       from \u0027@angular/router\u0027;\r\nimport { provideHttpClient }   from \u0027@angular/common/http\u0027;\r\nimport { provideAnimations }   from \u0027@angular/platform-browser/animations\u0027;\r\nimport { routes }              from \u0027./app.routes\u0027;\r\n\r\nexport const appConfig: ApplicationConfig = {\r\n  providers: [\r\n    provideRouter(routes),\r\n    provideHttpClient(),\r\n    provideAnimations(),\r\n\r\n    // Legacy modules that haven\u0027t been migrated yet:\r\n    importProvidersFrom(SomeOldModule),\r\n  ],\r\n};\r\n```\r\n\r\n---\r\n\r\n## 4. Migrating from NgModule to Standalone\r\n\r\n### Before (NgModule)\r\n\r\n```typescript\r\n// old product.module.ts\r\n@NgModule({\r\n  declarations: [ProductListComponent, ProductCardComponent],\r\n  imports: [CommonModule, RouterModule, FormsModule],\r\n  exports: [ProductListComponent],\r\n})\r\nexport class ProductModule { }\r\n```\r\n\r\n### After (Standalone)\r\n\r\n```typescript\r\n// product-list.component.ts\r\n@Component({\r\n  standalone: true,\r\n  imports: [RouterLink, FormsModule, ProductCardComponent],\r\n  ...\r\n})\r\nexport class ProductListComponent { }\r\n\r\n// product-card.component.ts\r\n@Component({\r\n  standalone: true,\r\n  imports: [],\r\n  ...\r\n})\r\nexport class ProductCardComponent { }\r\n```\r\n\r\n**Migration command (automatic):**\r\n\r\n```bash\r\nng generate @angular/core:standalone\r\n# Follow prompts to migrate components, pipes, directives, and finally the AppModule\r\n```\r\n\r\n---\r\n\r\n## 5. Standalone Directives \u0026 Pipes\r\n\r\nSame pattern — add `standalone: true`:\r\n\r\n```typescript\r\n// truncate.pipe.ts\r\nimport { Pipe, PipeTransform } from \u0027@angular/core\u0027;\r\n\r\n@Pipe({ name: \u0027truncate\u0027, standalone: true })\r\nexport class TruncatePipe implements PipeTransform {\r\n  transform(value: string, limit = 50): string {\r\n    return value.length \u003e limit ? value.slice(0, limit) + \u0027…\u0027 : value;\r\n  }\r\n}\r\n```\r\n\r\n```typescript\r\n// highlight.directive.ts\r\nimport { Directive } from \u0027@angular/core\u0027;\r\n\r\n@Directive({ selector: \u0027[appHighlight]\u0027, standalone: true })\r\nexport class HighlightDirective { }\r\n```\r\n\r\nImport them directly in any component\u0027s `imports: []`.\r\n\r\n---\r\n\r\n## 6. Feature-level `ApplicationConfig` (environment providers)\r\n\r\nProvide services/routes at the route level:\r\n\r\n```typescript\r\n// checkout/checkout.routes.ts\r\nimport { Routes }              from \u0027@angular/router\u0027;\r\nimport { provideState }        from \u0027@ngrx/store\u0027;\r\nimport { checkoutReducer }     from \u0027./checkout.reducer\u0027;\r\nimport { CheckoutComponent }   from \u0027./checkout.component\u0027;\r\n\r\nexport const checkoutRoutes: Routes = [\r\n  {\r\n    path: \u0027\u0027,\r\n    component: CheckoutComponent,\r\n    providers: [\r\n      provideState(\u0027checkout\u0027, checkoutReducer),  // scoped NgRx state\r\n      CheckoutService,                             // scoped service\r\n    ],\r\n  },\r\n];\r\n```\r\n\r\n---\r\n\r\n## 7. `provideRouter` Feature Flags\r\n\r\n```typescript\r\nimport {\r\n  provideRouter,\r\n  withPreloading, PreloadAllModules,\r\n  withComponentInputBinding,\r\n  withViewTransitions,\r\n  withRouterConfig,\r\n  withDebugTracing,        // logs all router events (dev only)\r\n  withHashLocation,\r\n  withEnabledBlockingInitialNavigation,\r\n} from \u0027@angular/router\u0027;\r\n\r\nprovideRouter(\r\n  routes,\r\n  withPreloading(PreloadAllModules),\r\n  withComponentInputBinding(),      // route params → @Input\r\n  withViewTransitions(),            // CSS View Transitions API\r\n  withRouterConfig({ paramsInheritanceStrategy: \u0027always\u0027 }),\r\n)\r\n```\r\n\r\n---\r\n\r\n## 8. View Transitions API (Angular 17+)\r\n\r\n```typescript\r\n// app.config.ts\r\nprovideRouter(routes, withViewTransitions())\r\n```\r\n\r\n```scss\r\n/* styles.scss */\r\n::view-transition-old(root) {\r\n  animation: 200ms ease-out fade-out;\r\n}\r\n::view-transition-new(root) {\r\n  animation: 200ms ease-in fade-in;\r\n}\r\n```\r\n\r\nAngular automatically wraps route navigations in the browser\u0027s View Transitions API — smooth page transitions with no extra code!\r\n\r\n---\r\n\r\n## 9. Environment Injectors — Lazy Injection Context\r\n\r\n```typescript\r\nimport { EnvironmentInjector, inject, runInInjectionContext } from \u0027@angular/core\u0027;\r\n\r\n@Component({ ... })\r\nexport class MyComponent {\r\n  private envInjector = inject(EnvironmentInjector);\r\n\r\n  doLazyWork() {\r\n    runInInjectionContext(this.envInjector, () =\u003e {\r\n      // inject() works here even though we\u0027re not in a constructor\r\n      const service = inject(SomeService);\r\n      service.doWork();\r\n    });\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 10. Lazy-loaded Standalone Component with its own Providers\r\n\r\n```typescript\r\n// product-details.component.ts\r\nimport { Component }         from \u0027@angular/core\u0027;\r\nimport { ProductService }    from \u0027./product.service\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-details\u0027,\r\n  standalone: true,\r\n  providers: [ProductService],   // fresh instance scoped to this component\r\n  template: `...`,\r\n})\r\nexport class ProductDetailsComponent { }\r\n```\r\n\r\n```typescript\r\n// app.routes.ts\r\n{\r\n  path: \u0027products/:id\u0027,\r\n  loadComponent: () =\u003e\r\n    import(\u0027./products/product-details.component\u0027)\r\n      .then(m =\u003e m.ProductDetailsComponent),\r\n}\r\n```\r\n\r\n---\r\n\r\n## 11. Complete Standalone App Structure\r\n\r\n```\r\nsrc/\r\n  main.ts                    ← bootstrapApplication(AppComponent, appConfig)\r\n  app/\r\n    app.component.ts         ← Root standalone component\r\n    app.config.ts            ← ApplicationConfig (providers)\r\n    app.routes.ts            ← Top-level routes\r\n    core/\r\n      guards/\r\n        auth.guard.ts        ← Functional guards\r\n      interceptors/\r\n        auth.interceptor.ts  ← Functional interceptors\r\n      services/\r\n        auth.service.ts\r\n        cart.service.ts\r\n    shared/\r\n      components/\r\n        button/\r\n          button.component.ts     ← standalone: true\r\n        spinner/\r\n          spinner.component.ts    ← standalone: true\r\n      pipes/\r\n        truncate.pipe.ts          ← standalone: true\r\n      directives/\r\n        highlight.directive.ts    ← standalone: true\r\n    features/\r\n      store/\r\n        store.component.ts        ← standalone: true\r\n        store.routes.ts           ← feature routes\r\n        product-card/\r\n          product-card.component.ts\r\n      checkout/\r\n        checkout.component.ts\r\n        checkout.routes.ts\r\n      account/\r\n        account.component.ts\r\n        account.routes.ts\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Old NgModule API | Modern Standalone API |\r\n|------------------|-----------------------|\r\n| `@NgModule({ declarations })` | `@Component({ standalone: true })` |\r\n| `imports: [CommonModule]` | `imports: [NgClass, AsyncPipe, ...]` |\r\n| `AppModule` | `app.config.ts` + `bootstrapApplication()` |\r\n| Module-level providers | Route-level `providers:[]` |\r\n| `RouterModule.forChild()` | `loadChildren: () =\u003e import(\u0027./routes\u0027)` |\r\n| Class-based guards | Functional guards with `inject()` |\r\n| Class-based interceptors | `HttpInterceptorFn` |\r\n\r\n**Next:** [10 — Performance →](./10-performance.md)\r\n",
  "10-performance": "# Chapter 10 — Performance \u0026 Best Practices\r\n\r\n---\r\n\r\n## 1. OnPush Change Detection\r\n\r\nThe **single most impactful** performance change you can make.\r\n\r\n```typescript\r\nimport { Component, ChangeDetectionStrategy, input } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-card\u0027,\r\n  standalone: true,\r\n  changeDetection: ChangeDetectionStrategy.OnPush,\r\n  template: `\u003ch3\u003e{{ product().name }}\u003c/h3\u003e`,\r\n})\r\nexport class ProductCardComponent {\r\n  product = input.required\u003cProduct\u003e();\r\n  // Angular only checks this component when:\r\n  // 1. A signal changes\r\n  // 2. An @Input reference changes\r\n  // 3. An Observable emits via async pipe\r\n  // 4. markForCheck() is called\r\n}\r\n```\r\n\r\n**Rule:** Apply `OnPush` to **every** component except the root.\r\n\r\n---\r\n\r\n## 2. trackBy / track in @for\r\n\r\nWithout `track`, Angular re-creates all DOM nodes on any array change.  \r\nWith `track`, only changed items update.\r\n\r\n```html\r\n\u003c!-- Modern (Angular 17+) — use track expression directly --\u003e\r\n@for (product of products(); track product.id) {\r\n  \u003capp-product-card [product]=\"product\" /\u003e\r\n}\r\n\r\n\u003c!-- Legacy *ngFor --\u003e\r\n\u003capp-product-card\r\n  *ngFor=\"let p of products; trackBy: trackById\"\r\n  [product]=\"p\"\r\n/\u003e\r\n```\r\n\r\n```typescript\r\ntrackById(_index: number, item: { id: number }) {\r\n  return item.id;\r\n}\r\n```\r\n\r\n---\r\n\r\n## 3. Lazy Loading Routes\r\n\r\nSplit the bundle — load features only when needed:\r\n\r\n```typescript\r\n// app.routes.ts\r\n{\r\n  path: \u0027store\u0027,\r\n  loadChildren: () =\u003e import(\u0027./store/store.routes\u0027).then(m =\u003e m.storeRoutes),\r\n},\r\n{\r\n  path: \u0027admin\u0027,\r\n  loadComponent: () =\u003e import(\u0027./admin/admin.component\u0027).then(m =\u003e m.AdminComponent),\r\n},\r\n```\r\n\r\n**Preloading strategy** — load idle routes in background after initial navigation:\r\n\r\n```typescript\r\nprovideRouter(routes, withPreloading(PreloadAllModules))\r\n```\r\n\r\n**Custom preloading** — only preload routes marked with `data.preload`:\r\n\r\n```typescript\r\nimport { PreloadingStrategy, Route } from \u0027@angular/router\u0027;\r\nimport { Observable, of } from \u0027rxjs\u0027;\r\nimport { Injectable } from \u0027@angular/core\u0027;\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class SelectivePreloadingStrategy implements PreloadingStrategy {\r\n  preload(route: Route, load: () =\u003e Observable\u003cany\u003e): Observable\u003cany\u003e {\r\n    return route.data?.[\u0027preload\u0027] ? load() : of(null);\r\n  }\r\n}\r\n\r\n// app.routes.ts\r\n{ path: \u0027store\u0027, data: { preload: true }, loadChildren: ... }\r\n```\r\n\r\n---\r\n\r\n## 4. Deferrable Views `@defer`\r\n\r\nDefer loading of heavy components until needed:\r\n\r\n```html\r\n\u003c!-- Load only when scrolled into view --\u003e\r\n@defer (on viewport) {\r\n  \u003capp-product-reviews [productId]=\"product().id\" /\u003e\r\n} @placeholder {\r\n  \u003cdiv class=\"placeholder\" style=\"height: 300px\"\u003e\u003c/div\u003e\r\n} @loading (minimum 200ms) {\r\n  \u003capp-skeleton-loader /\u003e\r\n}\r\n\r\n\u003c!-- Load only when user interacts --\u003e\r\n@defer (on interaction) {\r\n  \u003capp-chat-widget /\u003e\r\n} @placeholder {\r\n  \u003cbutton\u003eOpen Chat\u003c/button\u003e\r\n}\r\n\r\n\u003c!-- Load after 3 seconds --\u003e\r\n@defer (on timer(3s)) {\r\n  \u003capp-newsletter-popup /\u003e\r\n}\r\n```\r\n\r\n---\r\n\r\n## 5. Pure Pipes vs Impure Pipes\r\n\r\n```typescript\r\n// Pure pipe (default) — only runs when input reference changes\r\n@Pipe({ name: \u0027filter\u0027, standalone: true, pure: true })\r\nexport class FilterPipe implements PipeTransform {\r\n  transform(items: Product[], search: string): Product[] {\r\n    return items.filter(p =\u003e p.name.includes(search));\r\n  }\r\n}\r\n\r\n// Impure pipe — runs every change detection cycle (avoid for performance)\r\n@Pipe({ name: \u0027myImpure\u0027, standalone: true, pure: false })\r\nexport class ImpurePipe implements PipeTransform { ... }\r\n```\r\n\r\n\u003e Prefer `pure: true` (default). If you need reactive filtering, use `computed()` signals instead.\r\n\r\n---\r\n\r\n## 6. Signals — Zoneless Angular\r\n\r\nThe future of Angular performance:\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { provideExperimentalZonelessChangeDetection } from \u0027@angular/core\u0027;\r\n\r\nexport const appConfig: ApplicationConfig = {\r\n  providers: [provideExperimentalZonelessChangeDetection()],\r\n};\r\n```\r\n\r\nWith signals + zoneless:\r\n- No Zone.js overhead\r\n- Only components that depend on changed signals re-render\r\n- Much faster initial load\r\n\r\n---\r\n\r\n## 7. Virtual Scrolling (CDK)\r\n\r\nFor very long lists (1000+ items), render only what\u0027s visible:\r\n\r\n```bash\r\nnpm install @angular/cdk\r\n```\r\n\r\n```typescript\r\nimport { ScrollingModule } from \u0027@angular/cdk/scrolling\u0027;\r\n\r\n@Component({\r\n  standalone: true,\r\n  imports: [ScrollingModule],\r\n  template: `\r\n    \u003ccdk-virtual-scroll-viewport itemSize=\"72\" style=\"height: 500px\"\u003e\r\n      \u003capp-product-card\r\n        *cdkVirtualFor=\"let p of products; trackBy: trackById\"\r\n        [product]=\"p\"\r\n      /\u003e\r\n    \u003c/cdk-virtual-scroll-viewport\u003e\r\n  `,\r\n})\r\nexport class ProductListComponent { }\r\n```\r\n\r\n---\r\n\r\n## 8. Server-Side Rendering (SSR) with Angular Universal\r\n\r\n```bash\r\n# Add SSR to existing project\r\nng add @angular/ssr\r\n```\r\n\r\n```typescript\r\n// app.config.server.ts (auto-generated)\r\nimport { mergeApplicationConfig, ApplicationConfig } from \u0027@angular/core\u0027;\r\nimport { provideServerRendering }                    from \u0027@angular/platform-server\u0027;\r\nimport { appConfig }                                 from \u0027./app.config\u0027;\r\n\r\nconst serverConfig: ApplicationConfig = {\r\n  providers: [provideServerRendering()],\r\n};\r\n\r\nexport const config = mergeApplicationConfig(appConfig, serverConfig);\r\n```\r\n\r\n```bash\r\n# Build and serve SSR\r\nng build\r\nnode dist/my-app/server/server.mjs\r\n```\r\n\r\n**Benefits:**\r\n- Faster First Contentful Paint (FCP)\r\n- Better SEO — search crawlers see full HTML\r\n- Social media link previews work correctly\r\n\r\n---\r\n\r\n## 9. Incremental Hydration (Angular 19+)\r\n\r\nHydrate only parts of the SSR-rendered page on demand:\r\n\r\n```html\r\n\u003c!-- Only hydrate when user scrolls to this section --\u003e\r\n@defer (hydrate on viewport) {\r\n  \u003capp-product-reviews [productId]=\"id\" /\u003e\r\n}\r\n\r\n\u003c!-- Hydrate when user interacts --\u003e\r\n@defer (hydrate on interaction) {\r\n  \u003capp-comment-section /\u003e\r\n}\r\n\r\n\u003c!-- Never hydrate — stays static HTML --\u003e\r\n@defer (hydrate never) {\r\n  \u003capp-static-footer /\u003e\r\n}\r\n```\r\n\r\n---\r\n\r\n## 10. Image Optimization with `NgOptimizedImage`\r\n\r\n```typescript\r\nimport { NgOptimizedImage } from \u0027@angular/common\u0027;\r\n\r\n@Component({\r\n  standalone: true,\r\n  imports: [NgOptimizedImage],\r\n  template: `\r\n    \u003c!-- Automatic lazy loading, intrinsic sizing, priority hints --\u003e\r\n    \u003cimg ngSrc=\"products/laptop.jpg\" width=\"400\" height=\"300\" alt=\"Laptop\" /\u003e\r\n\r\n    \u003c!-- Above-the-fold image — load eagerly with priority --\u003e\r\n    \u003cimg ngSrc=\"hero-banner.jpg\" width=\"1920\" height=\"600\" priority alt=\"Banner\" /\u003e\r\n  `,\r\n})\r\nexport class ProductCardComponent { }\r\n```\r\n\r\n**What `NgOptimizedImage` does automatically:**\r\n- Adds `loading=\"lazy\"` (except `priority`)\r\n- Prevents layout shift (requires `width`/`height`)\r\n- Adds `fetchpriority=\"high\"` for priority images\r\n- Warns about missing `alt`, wrong sizes\r\n\r\n---\r\n\r\n## 11. Bundle Size Optimization\r\n\r\n```bash\r\n# Analyze bundle\r\nng build --stats-json\r\nnpx webpack-bundle-analyzer dist/my-app/stats.json\r\n```\r\n\r\n**Common improvements:**\r\n\r\n```typescript\r\n// BAD — imports entire library\r\nimport * as _ from \u0027lodash\u0027;\r\n\r\n// GOOD — import only what you need\r\nimport { debounce } from \u0027lodash-es\u0027;\r\n```\r\n\r\n```typescript\r\n// BAD — import entire Angular Material module\r\nimport { MatModule } from \u0027@angular/material\u0027;  // doesn\u0027t exist but people do this pattern\r\n\r\n// GOOD — tree-shakeable named imports\r\nimport { MatButtonModule } from \u0027@angular/material/button\u0027;\r\nimport { MatInputModule }  from \u0027@angular/material/input\u0027;\r\n```\r\n\r\n```json\r\n// angular.json — production build budgets (warn/error if exceeded)\r\n\"budgets\": [\r\n  { \"type\": \"initial\",    \"maximumWarning\": \"500kB\", \"maximumError\": \"1MB\" },\r\n  { \"type\": \"anyScript\",  \"maximumWarning\": \"150kB\", \"maximumError\": \"300kB\" },\r\n  { \"type\": \"any\",        \"maximumWarning\": \"300kB\", \"maximumError\": \"600kB\" }\r\n]\r\n```\r\n\r\n---\r\n\r\n## 12. Security Best Practices\r\n\r\n```typescript\r\n// 1. Never use innerHTML with user content — use DomSanitizer\r\nimport { DomSanitizer } from \u0027@angular/platform-browser\u0027;\r\n\r\n@Component({ ... })\r\nexport class HtmlComponent {\r\n  private sanitizer = inject(DomSanitizer);\r\n\r\n  // WRONG\r\n  unsafeHtml = \u0027\u003cscript\u003ealert(\"XSS\")\u003c/script\u003e\u0027;\r\n\r\n  // CORRECT — Angular auto-sanitizes [innerHTML] in templates\r\n  // but use bypassSecurity ONLY for trusted content\r\n  safeHtml = this.sanitizer.bypassSecurityTrustHtml(\u0027\u003cb\u003eBold text\u003c/b\u003e\u0027);\r\n}\r\n\r\n// In template — Angular strips dangerous tags automatically\r\n\u003cdiv [innerHTML]=\"trustedContent\"\u003e\u003c/div\u003e\r\n```\r\n\r\n```typescript\r\n// 2. Use HttpClient — it automatically prevents XSRF/CSRF\r\n// Angular sets the X-XSRF-TOKEN header automatically\r\n\r\n// 3. Never expose secrets in environment.ts — they go into the bundle\r\n// Use server-side proxying for API keys\r\n\r\n// 4. Content Security Policy — configure in server headers\r\n// not in Angular\r\n\r\n// 5. Use strict TypeScript — catches many bugs at compile time\r\n// tsconfig.json: \"strict\": true\r\n```\r\n\r\n---\r\n\r\n## 13. Performance Checklist\r\n\r\n| ✅ | Optimization |\r\n|----|-------------|\r\n| ☐ | `ChangeDetectionStrategy.OnPush` on all components |\r\n| ☐ | `track` expression in all `@for` loops |\r\n| ☐ | Lazy-load all feature routes |\r\n| ☐ | `@defer` for below-the-fold content |\r\n| ☐ | `NgOptimizedImage` for all `\u003cimg\u003e` tags |\r\n| ☐ | Pure pipes or `computed()` signals for derived data |\r\n| ☐ | Virtual scrolling for lists \u003e 100 items |\r\n| ☐ | Bundle budget configured in `angular.json` |\r\n| ☐ | SSR enabled for public-facing pages |\r\n| ☐ | Avoid `any` type — use strict TypeScript |\r\n| ☐ | `takeUntilDestroyed()` for all subscriptions |\r\n| ☐ | `withFetch()` in `provideHttpClient()` |\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Technique | Impact |\r\n|-----------|--------|\r\n| OnPush | High — fewer renders |\r\n| `track` in @for | High — efficient DOM diffing |\r\n| Lazy loading | High — smaller initial bundle |\r\n| `@defer` | High — defer heavy components |\r\n| Signals + Zoneless | Very High — no Zone.js overhead |\r\n| SSR | High — faster FCP, better SEO |\r\n| Virtual scrolling | High — for long lists |\r\n| NgOptimizedImage | Medium — LCP improvement |\r\n\r\n**Next:** [11 — Testing →](./11-testing.md)\r\n",
  "11-testing": "# Chapter 11 — Testing\r\n\r\n---\r\n\r\n## 1. Testing Stack\r\n\r\n| Layer | Tool |\r\n|-------|------|\r\n| Unit tests | Jasmine + Karma (default) or Jest |\r\n| Component tests | Angular `TestBed` |\r\n| Component harnesses | Angular CDK Harnesses |\r\n| E2E tests | Playwright or Cypress |\r\n\r\n```bash\r\n# Run unit tests\r\nng test\r\n\r\n# Run with coverage\r\nng test --code-coverage\r\n\r\n# E2E (Playwright)\r\nnpm install -D @playwright/test\r\nnpx playwright test\r\n```\r\n\r\n---\r\n\r\n## 2. Unit Testing a Service\r\n\r\n```typescript\r\n// product.service.spec.ts\r\nimport { TestBed }       from \u0027@angular/core/testing\u0027;\r\nimport { HttpClientTestingModule, HttpTestingController } from \u0027@angular/common/http/testing\u0027;\r\nimport { ProductService } from \u0027./product.service\u0027;\r\n\r\ndescribe(\u0027ProductService\u0027, () =\u003e {\r\n  let service: ProductService;\r\n  let httpMock: HttpTestingController;\r\n\r\n  beforeEach(() =\u003e {\r\n    TestBed.configureTestingModule({\r\n      imports: [HttpClientTestingModule],\r\n      providers: [ProductService],\r\n    });\r\n    service  = TestBed.inject(ProductService);\r\n    httpMock = TestBed.inject(HttpTestingController);\r\n  });\r\n\r\n  afterEach(() =\u003e httpMock.verify());  // assert no pending requests\r\n\r\n  it(\u0027should fetch all products\u0027, () =\u003e {\r\n    const mockProducts = [{ id: 1, name: \u0027Laptop\u0027, price: 999 }];\r\n\r\n    service.getAll().subscribe(products =\u003e {\r\n      expect(products.length).toBe(1);\r\n      expect(products[0].name).toBe(\u0027Laptop\u0027);\r\n    });\r\n\r\n    const req = httpMock.expectOne(\u0027/api/products\u0027);\r\n    expect(req.request.method).toBe(\u0027GET\u0027);\r\n    req.flush(mockProducts);   // supply mock response\r\n  });\r\n\r\n  it(\u0027should handle errors\u0027, () =\u003e {\r\n    service.getAll().subscribe({\r\n      error: err =\u003e expect(err.status).toBe(500),\r\n    });\r\n\r\n    httpMock.expectOne(\u0027/api/products\u0027).flush(\r\n      { message: \u0027Server error\u0027 },\r\n      { status: 500, statusText: \u0027Internal Server Error\u0027 }\r\n    );\r\n  });\r\n});\r\n```\r\n\r\n---\r\n\r\n## 3. Unit Testing a Component\r\n\r\n```typescript\r\n// product-card.component.spec.ts\r\nimport { ComponentFixture, TestBed } from \u0027@angular/core/testing\u0027;\r\nimport { By }                        from \u0027@angular/platform-browser\u0027;\r\nimport { ProductCardComponent }      from \u0027./product-card.component\u0027;\r\n\r\ndescribe(\u0027ProductCardComponent\u0027, () =\u003e {\r\n  let component: ProductCardComponent;\r\n  let fixture: ComponentFixture\u003cProductCardComponent\u003e;\r\n\r\n  const mockProduct = {\r\n    id: 1,\r\n    name: \u0027Laptop Pro\u0027,\r\n    price: 999,\r\n    imageUrl: \u0027/img/laptop.jpg\u0027,\r\n    inStock: true,\r\n    description: \u0027A great laptop\u0027,\r\n    rating: 4.5,\r\n    reviewCount: 120,\r\n  };\r\n\r\n  beforeEach(async () =\u003e {\r\n    await TestBed.configureTestingModule({\r\n      imports: [ProductCardComponent],  // standalone component — import directly\r\n    }).compileComponents();\r\n\r\n    fixture   = TestBed.createComponent(ProductCardComponent);\r\n    component = fixture.componentInstance;\r\n\r\n    // Set required signal input\r\n    fixture.componentRef.setInput(\u0027product\u0027, mockProduct);\r\n    fixture.detectChanges();\r\n  });\r\n\r\n  it(\u0027should display product name\u0027, () =\u003e {\r\n    const el = fixture.debugElement.query(By.css(\u0027.name\u0027));\r\n    expect(el.nativeElement.textContent).toContain(\u0027Laptop Pro\u0027);\r\n  });\r\n\r\n  it(\u0027should emit cartAdded when button clicked\u0027, () =\u003e {\r\n    const spy = spyOn(component.cartAdded, \u0027emit\u0027);\r\n\r\n    const button = fixture.debugElement.query(By.css(\u0027button\u0027));\r\n    button.triggerEventHandler(\u0027click\u0027);\r\n\r\n    expect(spy).toHaveBeenCalledWith(mockProduct);\r\n  });\r\n\r\n  it(\u0027should disable button when out of stock\u0027, () =\u003e {\r\n    fixture.componentRef.setInput(\u0027product\u0027, { ...mockProduct, inStock: false });\r\n    fixture.detectChanges();\r\n\r\n    const button = fixture.debugElement.query(By.css(\u0027button\u0027));\r\n    expect(button.nativeElement.disabled).toBeTrue();\r\n  });\r\n});\r\n```\r\n\r\n---\r\n\r\n## 4. Testing with Fake Services\r\n\r\n```typescript\r\n// auth.guard.spec.ts\r\nimport { TestBed }    from \u0027@angular/core/testing\u0027;\r\nimport { Router }     from \u0027@angular/router\u0027;\r\nimport { authGuard }  from \u0027./auth.guard\u0027;\r\nimport { AuthService } from \u0027../services/auth.service\u0027;\r\n\r\ndescribe(\u0027authGuard\u0027, () =\u003e {\r\n  let authService: jasmine.SpyObj\u003cAuthService\u003e;\r\n  let router: jasmine.SpyObj\u003cRouter\u003e;\r\n\r\n  beforeEach(() =\u003e {\r\n    authService = jasmine.createSpyObj(\u0027AuthService\u0027, [\u0027isLoggedIn\u0027]);\r\n    router      = jasmine.createSpyObj(\u0027Router\u0027, [\u0027createUrlTree\u0027]);\r\n\r\n    TestBed.configureTestingModule({\r\n      providers: [\r\n        { provide: AuthService, useValue: authService },\r\n        { provide: Router,      useValue: router },\r\n      ],\r\n    });\r\n  });\r\n\r\n  it(\u0027should return true when logged in\u0027, () =\u003e {\r\n    authService.isLoggedIn.and.returnValue(true);\r\n    const result = TestBed.runInInjectionContext(() =\u003e authGuard());\r\n    expect(result).toBeTrue();\r\n  });\r\n\r\n  it(\u0027should redirect when not logged in\u0027, () =\u003e {\r\n    authService.isLoggedIn.and.returnValue(false);\r\n    router.createUrlTree.and.returnValue(\u0027/login\u0027 as any);\r\n\r\n    const result = TestBed.runInInjectionContext(() =\u003e authGuard());\r\n    expect(router.createUrlTree).toHaveBeenCalledWith([\u0027/login\u0027], jasmine.any(Object));\r\n  });\r\n});\r\n```\r\n\r\n---\r\n\r\n## 5. Testing Signals\r\n\r\n```typescript\r\n// cart.service.spec.ts\r\nimport { TestBed }    from \u0027@angular/core/testing\u0027;\r\nimport { CartService } from \u0027./cart.service\u0027;\r\n\r\ndescribe(\u0027CartService\u0027, () =\u003e {\r\n  let service: CartService;\r\n\r\n  beforeEach(() =\u003e {\r\n    TestBed.configureTestingModule({});\r\n    service = TestBed.inject(CartService);\r\n  });\r\n\r\n  it(\u0027should start empty\u0027, () =\u003e {\r\n    expect(service.items()).toEqual([]);\r\n    expect(service.totalItems()).toBe(0);\r\n  });\r\n\r\n  it(\u0027should add an item\u0027, () =\u003e {\r\n    service.addItem({ id: 1, name: \u0027Laptop\u0027, price: 999 });\r\n\r\n    expect(service.items().length).toBe(1);\r\n    expect(service.totalItems()).toBe(1);\r\n    expect(service.totalPrice()).toBe(999);\r\n  });\r\n\r\n  it(\u0027should increment quantity for duplicate item\u0027, () =\u003e {\r\n    service.addItem({ id: 1, name: \u0027Laptop\u0027, price: 999 });\r\n    service.addItem({ id: 1, name: \u0027Laptop\u0027, price: 999 });\r\n\r\n    expect(service.items().length).toBe(1);\r\n    expect(service.items()[0].quantity).toBe(2);\r\n    expect(service.totalItems()).toBe(2);\r\n  });\r\n\r\n  it(\u0027should remove an item\u0027, () =\u003e {\r\n    service.addItem({ id: 1, name: \u0027Laptop\u0027, price: 999 });\r\n    service.removeItem(1);\r\n    expect(service.items()).toEqual([]);\r\n  });\r\n});\r\n```\r\n\r\n---\r\n\r\n## 6. TestBed with RouterTestingHarness (Angular 15+)\r\n\r\n```typescript\r\n// product-details.component.spec.ts\r\nimport { TestBed }            from \u0027@angular/core/testing\u0027;\r\nimport { RouterTestingHarness } from \u0027@angular/router/testing\u0027;\r\nimport { provideRouter }      from \u0027@angular/router\u0027;\r\nimport { ProductDetailsComponent } from \u0027./product-details.component\u0027;\r\n\r\ndescribe(\u0027ProductDetailsComponent routing\u0027, () =\u003e {\r\n  beforeEach(async () =\u003e {\r\n    await TestBed.configureTestingModule({\r\n      providers: [\r\n        provideRouter([\r\n          { path: \u0027products/:id\u0027, component: ProductDetailsComponent }\r\n        ]),\r\n      ],\r\n    }).compileComponents();\r\n  });\r\n\r\n  it(\u0027should read id from route params\u0027, async () =\u003e {\r\n    const harness = await RouterTestingHarness.create();\r\n    const component = await harness.navigateByUrl(\r\n      \u0027/products/42\u0027,\r\n      ProductDetailsComponent\r\n    );\r\n\r\n    expect(component.id).toBe(\u002742\u0027);\r\n  });\r\n});\r\n```\r\n\r\n---\r\n\r\n## 7. Component Harnesses (CDK)\r\n\r\nHarnesses provide a high-level API to interact with components in tests — no brittle DOM queries.\r\n\r\n```typescript\r\n// Example with Angular Material MatButton harness\r\nimport { HarnessLoader }        from \u0027@angular/cdk/testing\u0027;\r\nimport { TestbedHarnessEnvironment } from \u0027@angular/cdk/testing/testbed\u0027;\r\nimport { MatButtonHarness }     from \u0027@angular/material/button/testing\u0027;\r\n\r\ndescribe(\u0027with harnesses\u0027, () =\u003e {\r\n  let loader: HarnessLoader;\r\n\r\n  beforeEach(async () =\u003e {\r\n    await TestBed.configureTestingModule({ imports: [MyComponent] }).compileComponents();\r\n    const fixture = TestBed.createComponent(MyComponent);\r\n    loader = TestbedHarnessEnvironment.loader(fixture);\r\n    fixture.detectChanges();\r\n  });\r\n\r\n  it(\u0027should click save button\u0027, async () =\u003e {\r\n    const saveBtn = await loader.getHarness(MatButtonHarness.with({ text: \u0027Save\u0027 }));\r\n    await saveBtn.click();\r\n    // assertions...\r\n  });\r\n});\r\n```\r\n\r\n---\r\n\r\n## 8. Writing a Custom Harness\r\n\r\n```typescript\r\n// product-card.harness.ts\r\nimport { ComponentHarness } from \u0027@angular/cdk/testing\u0027;\r\n\r\nexport class ProductCardHarness extends ComponentHarness {\r\n  static hostSelector = \u0027app-product-card\u0027;\r\n\r\n  private nameEl   = this.locatorFor(\u0027.name\u0027);\r\n  private priceEl  = this.locatorFor(\u0027.price\u0027);\r\n  private addBtn   = this.locatorFor(\u0027button.btn-add\u0027);\r\n\r\n  async getName():  Promise\u003cstring\u003e { return (await this.nameEl()).text(); }\r\n  async getPrice(): Promise\u003cstring\u003e { return (await this.priceEl()).text(); }\r\n  async clickAdd(): Promise\u003cvoid\u003e   { return (await this.addBtn()).click(); }\r\n  async isAddDisabled(): Promise\u003cboolean\u003e {\r\n    return (await this.addBtn()).getAttribute(\u0027disabled\u0027).then(v =\u003e v !== null);\r\n  }\r\n}\r\n```\r\n\r\n```typescript\r\n// In tests\r\nconst card = await loader.getHarness(ProductCardHarness);\r\nexpect(await card.getName()).toBe(\u0027Laptop Pro\u0027);\r\nawait card.clickAdd();\r\n```\r\n\r\n---\r\n\r\n## 9. E2E Testing with Playwright\r\n\r\n```bash\r\nnpm install -D @playwright/test\r\nnpx playwright install\r\n```\r\n\r\n```typescript\r\n// e2e/store.spec.ts\r\nimport { test, expect } from \u0027@playwright/test\u0027;\r\n\r\ntest.describe(\u0027Store page\u0027, () =\u003e {\r\n  test.beforeEach(async ({ page }) =\u003e {\r\n    await page.goto(\u0027/store\u0027);\r\n  });\r\n\r\n  test(\u0027should display products\u0027, async ({ page }) =\u003e {\r\n    await expect(page.locator(\u0027app-product-card\u0027)).toHaveCount(12);\r\n  });\r\n\r\n  test(\u0027should filter products by search\u0027, async ({ page }) =\u003e {\r\n    await page.fill(\u0027[placeholder=\"Search…\"]\u0027, \u0027laptop\u0027);\r\n    await expect(page.locator(\u0027app-product-card\u0027)).toHaveCountGreaterThan(0);\r\n    await expect(page.locator(\u0027.name\u0027).first()).toContainText(/laptop/i);\r\n  });\r\n\r\n  test(\u0027should add product to cart\u0027, async ({ page }) =\u003e {\r\n    await page.locator(\u0027app-product-card\u0027).first().locator(\u0027button\u0027).click();\r\n    await expect(page.locator(\u0027.cart-badge\u0027)).toHaveText(\u00271\u0027);\r\n  });\r\n\r\n  test(\u0027should navigate to product details\u0027, async ({ page }) =\u003e {\r\n    await page.locator(\u0027app-product-card\u0027).first().click();\r\n    await expect(page).toHaveURL(/\\/products\\/\\d+/);\r\n  });\r\n});\r\n```\r\n\r\n```json\r\n// playwright.config.ts\r\nimport { defineConfig } from \u0027@playwright/test\u0027;\r\n\r\nexport default defineConfig({\r\n  testDir: \u0027./e2e\u0027,\r\n  use: {\r\n    baseURL: \u0027http://localhost:4200\u0027,\r\n    screenshot: \u0027only-on-failure\u0027,\r\n  },\r\n  webServer: {\r\n    command: \u0027ng serve\u0027,\r\n    url: \u0027http://localhost:4200\u0027,\r\n    reuseExistingServer: true,\r\n  },\r\n});\r\n```\r\n\r\n---\r\n\r\n## 10. Code Coverage\r\n\r\n```bash\r\nng test --code-coverage\r\n# Opens: coverage/index.html\r\n```\r\n\r\n```json\r\n// angular.json — enforce minimum coverage\r\n\"test\": {\r\n  \"options\": {\r\n    \"codeCoverage\": true,\r\n    \"codeCoverageExclude\": [\"**/index.ts\", \"**/*.spec.ts\"],\r\n    \"karmaConfig\": \"karma.conf.js\"\r\n  }\r\n}\r\n```\r\n\r\n```javascript\r\n// karma.conf.js — fail below threshold\r\ncoverageReporter: {\r\n  thresholds: {\r\n    statements: 80,\r\n    branches:   70,\r\n    functions:  80,\r\n    lines:      80,\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 11. Jest (alternative to Karma/Jasmine)\r\n\r\n```bash\r\nnpm install -D jest @types/jest jest-preset-angular\r\n\r\n# Remove karma: ng test will use jest\r\n```\r\n\r\n```javascript\r\n// jest.config.js\r\nmodule.exports = {\r\n  preset: \u0027jest-preset-angular\u0027,\r\n  setupFilesAfterFramework: [\u0027\u003crootDir\u003e/setup-jest.ts\u0027],\r\n};\r\n```\r\n\r\n```typescript\r\n// setup-jest.ts\r\nimport \u0027jest-preset-angular/setup-jest\u0027;\r\n```\r\n\r\nJest tests use the same `TestBed` API — just replace Jasmine matchers:\r\n\r\n```typescript\r\nexpect(result).toBe(5);          // same\
