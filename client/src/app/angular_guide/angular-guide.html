r\nexpect(spy).toHaveBeenCalled();  // same\r\nexpect(result).toEqual({});       // same\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| What to test | API |\r\n|-------------|-----|\r\n| Service logic | Plain TypeScript + `TestBed.inject()` |\r\n| HTTP calls | `HttpClientTestingModule` + `HttpTestingController` |\r\n| Component rendering | `TestBed.createComponent()` + `fixture.detectChanges()` |\r\n| Component inputs | `fixture.componentRef.setInput()` |\r\n| User interactions | `element.triggerEventHandler(\u0027click\u0027)` |\r\n| Signal outputs | `spyOn(component.output, \u0027emit\u0027)` |\r\n| Routing | `RouterTestingHarness` |\r\n| UI interactions | Component Harnesses (CDK) |\r\n| Browser-level E2E | Playwright |\r\n\r\n**Next:** [12 — Advanced Patterns →](./12-advanced.md)\r\n",
  "12-advanced": "# Chapter 12 — Advanced Patterns\r\n\r\n---\r\n\r\n## 1. Dynamic Components\r\n\r\nRender a component at runtime without knowing it at compile time.\r\n\r\n```typescript\r\n// dynamic-host.component.ts\r\nimport { Component, ViewChild, ViewContainerRef, Type, inject } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-dynamic-host\u0027,\r\n  standalone: true,\r\n  template: `\u003cng-container #host\u003e\u003c/ng-container\u003e`,\r\n})\r\nexport class DynamicHostComponent {\r\n  @ViewChild(\u0027host\u0027, { read: ViewContainerRef }) host!: ViewContainerRef;\r\n\r\n  loadComponent\u003cT\u003e(component: Type\u003cT\u003e, inputs?: Partial\u003cT\u003e) {\r\n    this.host.clear();\r\n    const ref = this.host.createComponent(component);\r\n\r\n    // Set inputs\r\n    if (inputs) {\r\n      Object.entries(inputs).forEach(([key, value]) =\u003e {\r\n        ref.setInput(key, value);\r\n      });\r\n    }\r\n\r\n    return ref;\r\n  }\r\n}\r\n```\r\n\r\n```typescript\r\n// Usage — render a widget based on user config\r\n@Component({ ... })\r\nexport class DashboardComponent {\r\n  @ViewChild(DynamicHostComponent) host!: DynamicHostComponent;\r\n\r\n  async loadWidget(type: string) {\r\n    const widgetMap: Record\u003cstring, () =\u003e Promise\u003cType\u003cany\u003e\u003e\u003e = {\r\n      \u0027chart\u0027:  () =\u003e import(\u0027./widgets/chart.component\u0027).then(m =\u003e m.ChartComponent),\r\n      \u0027table\u0027:  () =\u003e import(\u0027./widgets/table.component\u0027).then(m =\u003e m.TableComponent),\r\n      \u0027stats\u0027:  () =\u003e import(\u0027./widgets/stats.component\u0027).then(m =\u003e m.StatsComponent),\r\n    };\r\n\r\n    const component = await widgetMap[type]();\r\n    this.host.loadComponent(component, { data: this.widgetData });\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 2. Component Portal (CDK)\r\n\r\nRender a component in a different part of the DOM (useful for modals, tooltips, toasts).\r\n\r\n```bash\r\nnpm install @angular/cdk\r\n```\r\n\r\n```typescript\r\n// overlay.service.ts\r\nimport { Injectable, inject } from \u0027@angular/core\u0027;\r\nimport { Overlay, OverlayRef }  from \u0027@angular/cdk/overlay\u0027;\r\nimport { ComponentPortal }      from \u0027@angular/cdk/portal\u0027;\r\nimport { ToastComponent }       from \u0027../components/toast.component\u0027;\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class ToastService {\r\n  private overlay = inject(Overlay);\r\n\r\n  show(message: string) {\r\n    const overlayRef: OverlayRef = this.overlay.create({\r\n      positionStrategy: this.overlay.position()\r\n        .global()\r\n        .bottom(\u002720px\u0027)\r\n        .centerHorizontally(),\r\n    });\r\n\r\n    const portal = new ComponentPortal(ToastComponent);\r\n    const ref    = overlayRef.attach(portal);\r\n    ref.setInput(\u0027message\u0027, message);\r\n\r\n    // Auto-dismiss after 3 seconds\r\n    setTimeout(() =\u003e overlayRef.dispose(), 3000);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 3. Reactive Data Patterns\r\n\r\n### Resource API (Angular 19+)\r\n\r\n```typescript\r\nimport { resource, signal } from \u0027@angular/core\u0027;\r\n\r\n@Component({ ... })\r\nexport class ProductComponent {\r\n  private http = inject(HttpClient);\r\n\r\n  productId = signal(1);\r\n\r\n  // Automatically re-fetches when productId changes\r\n  product = resource({\r\n    request: () =\u003e this.productId(),   // dependency\r\n    loader: ({ request: id }) =\u003e\r\n      this.http.get\u003cProduct\u003e(`/api/products/${id}`).toPromise(),\r\n  });\r\n\r\n  // product.value() — the data\r\n  // product.isLoading() — loading state\r\n  // product.error() — any error\r\n  // product.reload() — manually trigger refetch\r\n}\r\n```\r\n\r\n```html\r\n@if (product.isLoading()) {\r\n  \u003capp-spinner /\u003e\r\n} @else if (product.error()) {\r\n  \u003cp\u003eError: {{ product.error() }}\u003c/p\u003e\r\n} @else {\r\n  \u003ch2\u003e{{ product.value()?.name }}\u003c/h2\u003e\r\n}\r\n```\r\n\r\n---\r\n\r\n## 4. Custom Decorators\r\n\r\n```typescript\r\n// decorators/log.decorator.ts\r\nexport function Log(target: any, methodName: string, descriptor: PropertyDescriptor) {\r\n  const original = descriptor.value;\r\n  descriptor.value = function (...args: any[]) {\r\n    console.log(`[${target.constructor.name}] ${methodName}(`, args, \u0027)\u0027);\r\n    const result = original.apply(this, args);\r\n    console.log(`[${target.constructor.name}] ${methodName} returned:`, result);\r\n    return result;\r\n  };\r\n  return descriptor;\r\n}\r\n\r\n// Usage\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class ProductService {\r\n  @Log\r\n  getById(id: number) { ... }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 5. Abstract Base Service\r\n\r\n```typescript\r\n// base.service.ts\r\nimport { inject } from \u0027@angular/core\u0027;\r\nimport { HttpClient } from \u0027@angular/common/http\u0027;\r\nimport { Observable } from \u0027rxjs\u0027;\r\nimport { environment } from \u0027../../environments/environment\u0027;\r\n\r\nexport abstract class BaseService\u003cT\u003e {\r\n  protected http      = inject(HttpClient);\r\n  protected apiUrl    = `${environment.apiUrl}/${this.endpoint}`;\r\n\r\n  constructor(protected endpoint: string) {}\r\n\r\n  getAll():                Observable\u003cT[]\u003e  { return this.http.get\u003cT[]\u003e(this.apiUrl); }\r\n  getById(id: number):     Observable\u003cT\u003e    { return this.http.get\u003cT\u003e(`${this.apiUrl}/${id}`); }\r\n  create(dto: Partial\u003cT\u003e): Observable\u003cT\u003e    { return this.http.post\u003cT\u003e(this.apiUrl, dto); }\r\n  update(id: number, dto: Partial\u003cT\u003e): Observable\u003cT\u003e {\r\n    return this.http.put\u003cT\u003e(`${this.apiUrl}/${id}`, dto);\r\n  }\r\n  delete(id: number):      Observable\u003cvoid\u003e { return this.http.delete\u003cvoid\u003e(`${this.apiUrl}/${id}`); }\r\n}\r\n```\r\n\r\n```typescript\r\n// product.service.ts\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class ProductService extends BaseService\u003cProduct\u003e {\r\n  constructor() { super(\u0027products\u0027); }\r\n\r\n  // Add product-specific methods\r\n  search(term: string): Observable\u003cProduct[]\u003e {\r\n    return this.http.get\u003cProduct[]\u003e(`${this.apiUrl}/search`, {\r\n      params: new HttpParams().set(\u0027q\u0027, term),\r\n    });\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 6. Reactive Store Pattern (without NgRx)\r\n\r\n```typescript\r\n// Generic reactive store\r\nimport { signal, computed, Signal } from \u0027@angular/core\u0027;\r\n\r\nexport class Store\u003cT extends object\u003e {\r\n  private _state: ReturnType\u003ctypeof signal\u003cT\u003e\u003e;\r\n\r\n  constructor(initialState: T) {\r\n    this._state = signal\u003cT\u003e(initialState);\r\n  }\r\n\r\n  select\u003cK extends keyof T\u003e(key: K): Signal\u003cT[K]\u003e {\r\n    return computed(() =\u003e this._state()[key]);\r\n  }\r\n\r\n  selectDerived\u003cR\u003e(selector: (state: T) =\u003e R): Signal\u003cR\u003e {\r\n    return computed(() =\u003e selector(this._state()));\r\n  }\r\n\r\n  patch(partial: Partial\u003cT\u003e) {\r\n    this._state.update(s =\u003e ({ ...s, ...partial }));\r\n  }\r\n\r\n  reset(state: T) {\r\n    this._state.set(state);\r\n  }\r\n\r\n  snapshot(): T {\r\n    return this._state();\r\n  }\r\n}\r\n```\r\n\r\n```typescript\r\n// Usage\r\ninterface AppState {\r\n  user: User | null;\r\n  cart: CartItem[];\r\n  theme: \u0027light\u0027 | \u0027dark\u0027;\r\n}\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class AppStore extends Store\u003cAppState\u003e {\r\n  constructor() {\r\n    super({ user: null, cart: [], theme: \u0027light\u0027 });\r\n  }\r\n\r\n  user     = this.select(\u0027user\u0027);\r\n  cart     = this.select(\u0027cart\u0027);\r\n  theme    = this.select(\u0027theme\u0027);\r\n  cartSize = this.selectDerived(s =\u003e s.cart.length);\r\n\r\n  setUser(user: User)  { this.patch({ user }); }\r\n  toggleTheme()        { this.patch({ theme: this.theme() === \u0027light\u0027 ? \u0027dark\u0027 : \u0027light\u0027 }); }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 7. Animations\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { provideAnimations } from \u0027@angular/platform-browser/animations\u0027;\r\nproviders: [provideAnimations()]\r\n```\r\n\r\n```typescript\r\n// product-card.component.ts\r\nimport { trigger, state, style, animate, transition } from \u0027@angular/animations\u0027;\r\n\r\n@Component({\r\n  animations: [\r\n    trigger(\u0027fadeIn\u0027, [\r\n      transition(\u0027:enter\u0027, [\r\n        style({ opacity: 0, transform: \u0027translateY(-10px)\u0027 }),\r\n        animate(\u0027300ms ease-out\u0027, style({ opacity: 1, transform: \u0027translateY(0)\u0027 })),\r\n      ]),\r\n      transition(\u0027:leave\u0027, [\r\n        animate(\u0027200ms ease-in\u0027, style({ opacity: 0, transform: \u0027translateY(-10px)\u0027 })),\r\n      ]),\r\n    ]),\r\n    trigger(\u0027cardState\u0027, [\r\n      state(\u0027normal\u0027,   style({ transform: \u0027scale(1)\u0027 })),\r\n      state(\u0027hovered\u0027,  style({ transform: \u0027scale(1.03)\u0027, boxShadow: \u00270 8px 24px rgba(0,0,0,0.2)\u0027 })),\r\n      transition(\u0027normal \u003c=\u003e hovered\u0027, animate(\u0027200ms ease\u0027)),\r\n    ]),\r\n  ],\r\n  template: `\r\n    \u003carticle @fadeIn [@cardState]=\"cardState\"\r\n      (mouseenter)=\"cardState=\u0027hovered\u0027\"\r\n      (mouseleave)=\"cardState=\u0027normal\u0027\"\u003e\r\n      ...\r\n    \u003c/article\u003e\r\n  `,\r\n})\r\nexport class ProductCardComponent {\r\n  cardState = \u0027normal\u0027;\r\n}\r\n```\r\n\r\n---\r\n\r\n## 8. Internationalization (i18n)\r\n\r\n```html\r\n\u003c!-- Mark text for translation --\u003e\r\n\u003ch1 i18n=\"@@homeTitle\"\u003eWelcome to MyShop\u003c/h1\u003e\r\n\u003cp i18n\u003e{{ product.name }} is in stock.\u003c/p\u003e\r\n```\r\n\r\n```bash\r\n# Extract messages\r\nng extract-i18n --output-path src/locale\r\n\r\n# This creates: src/locale/messages.xlf\r\n```\r\n\r\n```xml\r\n\u003c!-- src/locale/messages.fr.xlf --\u003e\r\n\u003ctrans-unit id=\"homeTitle\"\u003e\r\n  \u003csource\u003eWelcome to MyShop\u003c/source\u003e\r\n  \u003ctarget\u003eBienvenue chez MyShop\u003c/target\u003e\r\n\u003c/trans-unit\u003e\r\n```\r\n\r\n```bash\r\n# Build for French\r\nng build --localize\r\n```\r\n\r\n---\r\n\r\n## 9. Micro-Frontend Architecture\r\n\r\nAngular supports Module Federation via `@angular-architects/module-federation`:\r\n\r\n```bash\r\nnpm install @angular-architects/module-federation\r\nng add @angular-architects/module-federation --project shell --port 4200 --type host\r\nng add @angular-architects/module-federation --project mfe-store --port 4201 --type remote\r\n```\r\n\r\n```javascript\r\n// mfe-store/webpack.config.js\r\nmodule.exports = withModuleFederationPlugin({\r\n  name: \u0027mfeStore\u0027,\r\n  exposes: {\r\n    \u0027./StoreModule\u0027: \u0027./src/app/store/store.routes.ts\u0027,\r\n  },\r\n});\r\n```\r\n\r\n```javascript\r\n// shell/webpack.config.js\r\nmodule.exports = withModuleFederationPlugin({\r\n  remotes: {\r\n    mfeStore: \u0027mfeStore@http://localhost:4201/remoteEntry.js\u0027,\r\n  },\r\n});\r\n```\r\n\r\n```typescript\r\n// shell/app.routes.ts\r\n{\r\n  path: \u0027store\u0027,\r\n  loadChildren: () =\u003e loadRemoteModule({\r\n    type: \u0027module\u0027,\r\n    remoteEntry: \u0027http://localhost:4201/remoteEntry.js\u0027,\r\n    exposedModule: \u0027./StoreModule\u0027,\r\n  }).then(m =\u003e m.storeRoutes),\r\n}\r\n```\r\n\r\n---\r\n\r\n## 10. Nx Monorepo (enterprise-scale)\r\n\r\n```bash\r\nnpx create-nx-workspace@latest myorg --preset=angular\r\ncd myorg\r\n\r\n# Generate apps and libraries\r\nnx generate @nx/angular:app my-app\r\nnx generate @nx/angular:lib shared-ui\r\nnx generate @nx/angular:lib feature-store\r\n\r\n# Run\r\nnx serve my-app\r\nnx test my-app\r\nnx affected --target=test   # only test changed code\r\n```\r\n\r\n---\r\n\r\n## 11. Design Patterns Summary\r\n\r\n| Pattern | When to use |\r\n|---------|------------|\r\n| Smart/Dumb components | Split data-fetching (smart) from presentation (dumb) |\r\n| Facade service | Hide NgRx complexity from components |\r\n| Repository service | Abstract data access layer |\r\n| Strategy pattern | Swap algorithms at runtime (e.g., different payment providers) |\r\n| Observer (EventEmitter) | Child → Parent communication |\r\n| Singleton service | Shared state across entire app |\r\n| Factory function | Create instances with dependencies (useFactory) |\r\n| Decorator | Cross-cutting concerns (logging, caching) |\r\n\r\n---\r\n\r\n## 12. Angular 20 New Features Recap\r\n\r\n| Feature | Status |\r\n|---------|--------|\r\n| Signal-based components | Stable |\r\n| `input()`, `output()`, `model()` | Stable |\r\n| `@if`, `@for`, `@switch` | Stable |\r\n| `@defer` / Deferrable Views | Stable |\r\n| Zoneless change detection | Stable (experimental flag) |\r\n| `resource()` API | Developer Preview |\r\n| Hydration (Full App) | Stable |\r\n| Incremental Hydration | Developer Preview |\r\n| View Transitions | Stable |\r\n| `withComponentInputBinding()` | Stable |\r\n| Typed Reactive Forms | Stable |\r\n| `inject()` function | Stable |\r\n| Functional guards/interceptors | Stable |\r\n| `takeUntilDestroyed()` | Stable |\r\n| `toSignal()` / `toObservable()` | Stable |\r\n\r\n---\r\n\r\n## 13. Angular Style Guide Quick Reference\r\n\r\n```typescript\r\n// ✅ DO\r\n// File naming: feature.type.ts\r\nproduct-card.component.ts\r\nproduct.service.ts\r\nauth.guard.ts\r\n\r\n// Class naming: FeatureType\r\nProductCardComponent\r\nProductService\r\nAuthGuard\r\n\r\n// Use standalone: true for all new components\r\n// Use inject() over constructor injection\r\n// Use OnPush change detection\r\n// Use signals for reactive state\r\n// Use @for with track\r\n// Use functional guards\r\n// Use async/await over .subscribe() where possible\r\n\r\n// ❌ DON\u0027T\r\n// Don\u0027t use any type\r\n// Don\u0027t subscribe without unsubscribing (use async pipe or takeUntilDestroyed)\r\n// Don\u0027t manipulate DOM directly (use Angular APIs)\r\n// Don\u0027t put business logic in components (use services)\r\n// Don\u0027t use NgModule for new code\r\n// Don\u0027t use *ngIf/*ngFor for new code (use @if/@for)\r\n```\r\n\r\n---\r\n\r\n## Congratulations! 🎉\r\n\r\nYou have completed the **Angular 20 Zero to Pro Guide**.\r\n\r\n### What you learned:\r\n1. Project setup and CLI\r\n2. Components, inputs, outputs, lifecycle hooks\r\n3. Templates, data binding, and directives\r\n4. Services and dependency injection\r\n5. Angular Router with guards, resolvers, and lazy loading\r\n6. Template-driven and reactive forms\r\n7. HTTP Client with interceptors\r\n8. Signals and state management\r\n9. Standalone APIs\r\n10. Performance optimization\r\n11. Testing (unit, component, E2E)\r\n12. Advanced patterns\r\n\r\n### Next steps:\r\n- Build the full **eShoppingAPI** client using these patterns\r\n- Explore [Angular Material](https://material.angular.io) for UI components\r\n- Learn [NgRx SignalStore](https://ngrx.io/guide/signals) for state management\r\n- Read the [official Angular docs](https://angular.dev)\r\n",
};


// ── CHAPTER META ────────────────────────
const CHAPTER_META = [
  { key: "README",                             title: "Introduction",                     icon: "🏠" },
  { key: "01-getting-started",                 title: "01 — Getting Started",             icon: "🚀" },
  { key: "02-components",                      title: "02 — Components",                  icon: "🧩" },
  { key: "03-templates-binding-directives",    title: "03 — Templates & Directives",      icon: "📄" },
  { key: "04-services-di",                     title: "04 — Services & DI",               icon: "💉" },
  { key: "05-router",                          title: "05 — Router",                      icon: "🗺️" },
  { key: "06-forms",                           title: "06 — Forms",                       icon: "📝" },
  { key: "07-http-client",                     title: "07 — HTTP Client",                 icon: "🌐" },
  { key: "08-signals-state",                   title: "08 — Signals & State",             icon: "⚡" },
  { key: "09-standalone",                      title: "09 — Standalone APIs",             icon: "🔌" },
  { key: "10-performance",                     title: "10 — Performance",                 icon: "🏎️" },
  { key: "11-testing",                         title: "11 — Testing",                     icon: "🧪" },
  { key: "12-advanced",                        title: "12 — Advanced Patterns",           icon: "🎓" },
];

// ── STATE ────────────────────────────────
let currentIdx = 0;
const STORAGE_KEY = 'ng20-guide';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"done":[],"last":0}'); }
  catch { return { done: [], last: 0 }; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

let appState = loadState();

// ── MARKED CONFIG ────────────────────────
marked.setOptions({ breaks: true, gfm: true });

const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  const rawCode = (typeof code === 'object' && code !== null) ? (code.text || '') : String(code || '');
  const rawLang = (typeof code === 'object' && code !== null) ? (code.lang || lang || '') : String(lang || '');
  const language = rawLang && hljs.getLanguage(rawLang) ? rawLang : 'plaintext';
  const highlighted = hljs.highlight(rawCode, { language }).value;
  return `<div class="code-wrapper">
    <span class="code-lang">${rawLang || ''}</span>
    <button class="copy-btn" onclick="copyCode(this)">Copy</button>
    <pre><code class="hljs language-${language}">${highlighted}</code></pre>
  </div>`;
};

// Make internal chapter links work
renderer.link = function(href, title, text) {
  const rawHref = (typeof href === 'object' && href !== null) ? (href.href || '') : String(href || '');
  const rawText = (typeof href === 'object' && href !== null) ? (href.text || text || '') : String(text || '');
  const rawTitle = (typeof href === 'object' && href !== null) ? (href.title || title || '') : String(title || '');
  if (rawHref && rawHref.match(/^\.\//)) {
    const mdKey = rawHref.replace(/^\.\//, '').replace(/\.md$/, '');
    const chIdx = CHAPTER_META.findIndex(c => c.key === mdKey);
    if (chIdx !== -1) {
      return `<a href="#" onclick="navigateTo(${chIdx});return false;" title="${rawTitle}">${rawText}</a>`;
    }
  }
  const titleAttr = rawTitle ? ` title="${rawTitle}"` : '';
  return `<a href="${rawHref}" target="_blank" rel="noopener"${titleAttr}>${rawText}</a>`;
};

marked.use({ renderer });

// ── RENDER CHAPTER ───────────────────────
function renderChapter(idx) {
  currentIdx = idx;
  const meta = CHAPTER_META[idx];
  const md = CHAPTERS[meta.key] || '# Not found';

  document.getElementById('content').innerHTML = marked.parse(md);
  document.getElementById('chapter-title').textContent = meta.title;
  document.getElementById('content-wrap').scrollTop = 0;

  buildToc();
  updateSidebar();
  updateNavFooter();
  updateMarkDoneBtn();
  attachScrollSpy();

  document.title = `${meta.title} | Angular 20 Guide`;

  // Update URL hash for bookmarking
  history.replaceState(null, '', `#${meta.key}`);
}

// ── TOC ──────────────────────────────────
function buildToc() {
  const headings = document.querySelectorAll('#content h2, #content h3');
  const tocEl = document.getElementById('toc-links');
  tocEl.innerHTML = '';

  headings.forEach((h, i) => {
    const id = 'h-' + i;
    h.id = id;
    const a = document.createElement('a');
    a.className = 'toc-link' + (h.tagName === 'H3' ? ' toc-h3' : '');
    a.href = '#' + id;
    a.textContent = h.textContent;
    a.onclick = (e) => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }); };
    tocEl.appendChild(a);
  });
}

function attachScrollSpy() {
  const wrap = document.getElementById('content-wrap');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll('.toc-link').forEach(a => a.classList.remove('active-toc'));
        const link = document.querySelector(`.toc-link[href="#${e.target.id}"]`);
        if (link) link.classList.add('active-toc');
      }
    });
  }, { root: wrap, rootMargin: '-20% 0px -70% 0px' });

  document.querySelectorAll('#content h2, #content h3').forEach(h => observer.observe(h));
}

// ── SIDEBAR ──────────────────────────────
function buildSidebar() {
  const list = document.getElementById('chapter-list');
  list.innerHTML = '';
  CHAPTER_META.forEach((m, i) => {
    const done = appState.done.includes(m.key);
    const div = document.createElement('div');
    div.className = 'ch-item' + (done ? ' done' : '') + (i === currentIdx ? ' active' : '');
    div.dataset.idx = i;
    div.innerHTML = `<div class="ch-check">${done ? '✓' : ''}</div>
      <span class="ch-label">${m.icon} ${m.title}</span>`;
    div.onclick = () => navigateTo(i);
    list.appendChild(div);
  });
  updateProgress();
}

function updateSidebar() {
  document.querySelectorAll('.ch-item').forEach((el, i) => {
    const key = CHAPTER_META[i].key;
    const done = appState.done.includes(key);
    el.classList.toggle('active', i === currentIdx);
    el.classList.toggle('done', done);
    el.querySelector('.ch-check').textContent = done ? '✓' : '';
  });
  updateProgress();
}

function updateProgress() {
  const total = CHAPTER_META.length - 1; // exclude README
  const done  = appState.done.filter(k => k !== 'README').length;
  const pct   = Math.round((done / total) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total} chapters complete`;
}

// ── NAV FOOTER ───────────────────────────
function updateNavFooter() {
  const footer = document.getElementById('nav-footer');
  const prev = currentIdx > 0 ? CHAPTER_META[currentIdx - 1] : null;
  const next = currentIdx < CHAPTER_META.length - 1 ? CHAPTER_META[currentIdx + 1] : null;

  footer.innerHTML = '';
  if (prev) {
    const a = document.createElement('a');
    a.className = 'nav-card';
    a.href = '#';
    a.innerHTML = `<div class="nav-dir">← Previous</div><div class="nav-title">${prev.title}</div>`;
    a.onclick = (e) => { e.preventDefault(); navigateTo(currentIdx - 1); };
    footer.appendChild(a);
  }
  if (next) {
    const a = document.createElement('a');
    a.className = 'nav-card next-card';
    a.href = '#';
    a.innerHTML = `<div class="nav-dir">Next →</div><div class="nav-title">${next.title}</div>`;
    a.onclick = (e) => { e.preventDefault(); navigateTo(currentIdx + 1); };
    footer.appendChild(a);
  }
}

// ── MARK DONE ────────────────────────────
function toggleDone() {
  const key = CHAPTER_META[currentIdx].key;
  if (appState.done.includes(key)) {
    appState.done = appState.done.filter(k => k !== key);
  } else {
    appState.done.push(key);
  }
  saveState(appState);
  updateSidebar();
  updateMarkDoneBtn();
}

function updateMarkDoneBtn() {
  const key  = CHAPTER_META[currentIdx].key;
  const done = appState.done.includes(key);
  const btn  = document.getElementById('mark-done-btn');
  btn.textContent = done ? '✓ Completed' : '✓ Mark as done';
  btn.classList.toggle('marked', done);
}

// ── COPY CODE ────────────────────────────
function copyCode(btn) {
  const code = btn.nextElementSibling.querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── NAVIGATION ───────────────────────────
function navigateTo(idx) {
  if (idx < 0 || idx >= CHAPTER_META.length) return;
  appState.last = idx;
  saveState(appState);
  renderChapter(idx);
  buildSidebar();
  // Close sidebar on mobile
  if (window.innerWidth <= 768) closeSidebar();
}

// ── SEARCH ───────────────────────────────
let searchTimer;
document.getElementById('search-box').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(this.value.trim()), 200);
});

document.getElementById('search-box').addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { this.value = ''; document.getElementById('search-results').innerHTML = ''; }
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('#sidebar-header')) {
    document.getElementById('search-results').innerHTML = '';
  }
});

function doSearch(term) {
  const box = document.getElementById('search-results');
  if (!term || term.length < 2) { box.innerHTML = ''; return; }

  const results = [];
  const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

  CHAPTER_META.forEach((m, i) => {
    const lines = (CHAPTERS[m.key] || '').split('\n');
    lines.forEach(line => {
      if (re.test(line)) {
        const cleaned = line.replace(/[#*`_\[\]]/g, '').trim();
        if (cleaned.length > 5 && results.length < 20) {
          results.push({ idx: i, title: m.title, icon: m.icon,
            match: cleaned.replace(re, '<mark>$&</mark>') });
        }
        re.lastIndex = 0;
      }
    });
  });

  if (results.length === 0) {
    box.innerHTML = '<div class="sr-item" style="color:var(--muted);font-size:13px">No results found</div>';
    return;
  }

  box.innerHTML = results.map((r, ri) => `
    <div class="sr-item" data-idx="${r.idx}">
      <div class="sr-chapter">${r.icon} ${r.title}</div>
      <div class="sr-match">${r.match}</div>
    </div>
  `).join('');

  box.querySelectorAll('.sr-item[data-idx]').forEach(el => {
    el.onclick = () => {
      navigateTo(+el.dataset.idx);
      document.getElementById('search-box').value = '';
      box.innerHTML = '';
    };
  });
}

// ── THEME ────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.dataset.theme === 'dark';
  html.dataset.theme = isDark ? 'light' : 'dark';
  // Swap hljs theme
  document.getElementById('hljs-theme').href = isDark
    ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css'
    : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
  localStorage.setItem('ng20-theme', html.dataset.theme);
}

// ── SIDEBAR TOGGLE ───────────────────────
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('menu-btn').addEventListener('click', () => {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show', sb.classList.contains('open'));
  } else {
    sb.classList.toggle('collapsed');
  }
});
document.getElementById('overlay').addEventListener('click', closeSidebar);

// ── KEYBOARD NAV ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') navigateTo(currentIdx + 1);
  if (e.key === 'ArrowLeft')  navigateTo(currentIdx - 1);
});

// ── BUTTONS ──────────────────────────────
document.getElementById('prev-btn').onclick     = () => navigateTo(currentIdx - 1);
document.getElementById('next-btn').onclick     = () => navigateTo(currentIdx + 1);
document.getElementById('mark-done-btn').onclick = toggleDone;
document.getElementById('theme-btn').onclick    = toggleTheme;

// ── BOOT ─────────────────────────────────
(function init() {
  // Restore theme
  const savedTheme = localStorage.getItem('ng20-theme');
  if (savedTheme) {
    document.documentElement.dataset.theme = savedTheme;
    if (savedTheme === 'light') {
      document.getElementById('hljs-theme').href =
        'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
    }
  }

  // Restore last position or URL hash
  const hash = location.hash.replace('#', '');
  const hashIdx = hash ? CHAPTER_META.findIndex(c => c.key === hash) : -1;
  const startIdx = hashIdx !== -1 ? hashIdx : (appState.last || 0);

  buildSidebar();
  renderChapter(startIdx);
})();
</script>
</body>
