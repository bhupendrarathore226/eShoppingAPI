<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Angular 20 — Zero to Pro Guide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--sidebar:#161b22;--surface:#1c2128;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--accent2:#bc8cff;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;--code-bg:#161b22;
  --heading:#f0f6fc;--scrollbar:#30363d;--sidebar-w:280px;
}
[data-theme="light"]{
  --bg:#ffffff;--sidebar:#f6f8fa;--surface:#f0f2f5;--border:#d0d7de;
  --text:#1f2328;--muted:#57606a;--accent:#0969da;--accent2:#8250df;
  --green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--code-bg:#f6f8fa;
  --heading:#1f2328;--scrollbar:#d0d7de;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow:hidden}

/* ── SIDEBAR ─────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden;
  transition:transform .3s ease;z-index:100;
}
#sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)))}
#sidebar-header{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
#sidebar-header h1{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
#search-box{width:100%;padding:7px 10px;background:var(--surface);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-size:13px;outline:none}
#search-box:focus{border-color:var(--accent)}
#search-box::placeholder{color:var(--muted)}
#progress-bar-wrap{margin-top:10px;background:var(--surface);border-radius:4px;height:4px;overflow:hidden}
#progress-bar{height:100%;background:var(--green);border-radius:4px;transition:width .4s ease;width:0%}
#progress-label{font-size:11px;color:var(--muted);margin-top:4px}

#chapter-list{overflow-y:auto;flex:1;padding:8px 0}
#chapter-list::-webkit-scrollbar{width:4px}
#chapter-list::-webkit-scrollbar-track{background:transparent}
#chapter-list::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}
.ch-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;
  border-radius:0;transition:background .15s;border-left:3px solid transparent;user-select:none}
.ch-item:hover{background:var(--surface)}
.ch-item.active{background:var(--surface);border-left-color:var(--accent);color:var(--accent)}
.ch-item.done .ch-label{color:var(--green)}
.ch-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .2s}
.ch-item.done .ch-check{background:var(--green);border-color:var(--green);color:#fff}
.ch-label{font-size:13px;line-height:1.4;color:var(--text);flex:1}
.ch-item.active .ch-label{color:var(--accent);font-weight:600}

#toc-panel{border-top:1px solid var(--border);padding:12px 16px;max-height:220px;overflow-y:auto;flex-shrink:0}
#toc-panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.toc-link{display:block;font-size:12px;color:var(--muted);padding:3px 0;text-decoration:none;
  border-left:2px solid transparent;padding-left:8px;transition:all .15s}
.toc-link:hover{color:var(--accent)}
.toc-link.toc-h3{padding-left:20px;font-size:11px}
.toc-link.active-toc{color:var(--accent);border-left-color:var(--accent)}

/* ── MAIN ─────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;
  border-bottom:1px solid var(--border);background:var(--sidebar);flex-shrink:0;position:sticky;top:0;z-index:50}
#menu-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;line-height:1}
#menu-btn:hover{color:var(--text)}
#breadcrumb{font-size:13px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#breadcrumb span{color:var(--text);font-weight:600}
.topbar-btn{background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  padding:5px 12px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;
  white-space:nowrap;transition:all .15s}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent)}
.topbar-btn.done-btn.marked{border-color:var(--green);color:var(--green)}
#theme-btn{padding:5px 10px}

#content-wrap{flex:1;overflow-y:auto;padding:40px 48px;max-width:900px;width:100%;margin:0 auto}
#content-wrap::-webkit-scrollbar{width:6px}
#content-wrap::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}

/* ── MARKDOWN STYLES ──────────────────── */
#content h1{font-size:2em;font-weight:700;color:var(--heading);margin:0 0 24px;
  padding-bottom:16px;border-bottom:1px solid var(--border)}
#content h2{font-size:1.4em;font-weight:700;color:var(--heading);margin:40px 0 16px;
  padding-bottom:8px;border-bottom:1px solid var(--border)}
#content h3{font-size:1.1em;font-weight:600;color:var(--heading);margin:28px 0 12px}
#content h4{font-size:1em;font-weight:600;color:var(--muted);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.05em}
#content p{margin:0 0 16px;line-height:1.75;color:var(--text)}
#content ul,#content ol{margin:0 0 16px 20px;line-height:1.75}
#content li{margin:4px 0}
#content strong{color:var(--heading);font-weight:600}
#content em{color:var(--accent2)}
#content a{color:var(--accent);text-decoration:none}
#content a:hover{text-decoration:underline}
#content blockquote{border-left:4px solid var(--accent);padding:12px 16px;
  background:var(--surface);border-radius:0 6px 6px 0;margin:16px 0;color:var(--muted)}
#content blockquote p{margin:0;color:var(--muted)}
#content hr{border:none;border-top:1px solid var(--border);margin:32px 0}
#content img{max-width:100%;border-radius:6px}
#content table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
#content th{background:var(--surface);padding:10px 14px;text-align:left;
  border:1px solid var(--border);font-weight:600;color:var(--heading);white-space:nowrap}
#content td{padding:9px 14px;border:1px solid var(--border);color:var(--text);vertical-align:top}
#content tr:nth-child(even) td{background:rgba(255,255,255,.02)}
[data-theme="light"] #content tr:nth-child(even) td{background:rgba(0,0,0,.02)}

/* ── CODE BLOCKS ──────────────────────── */
.code-wrapper{position:relative;margin:16px 0}
.code-wrapper .code-lang{position:absolute;top:0;left:0;font-size:11px;
  color:var(--muted);padding:6px 12px;font-family:ui-monospace,"SFMono-Regular","Fira Code",monospace;z-index:1}
.code-wrapper .copy-btn{position:absolute;top:6px;right:8px;background:var(--surface);
  border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:4px 10px;
  border-radius:5px;font-size:11px;opacity:0;transition:opacity .2s,color .2s;z-index:1}
.code-wrapper:hover .copy-btn{opacity:1}
.copy-btn.copied{color:var(--green);border-color:var(--green)}
#content pre{margin:0;border-radius:8px;overflow:hidden}
#content pre code.hljs{padding:36px 16px 16px!important;font-size:13px;line-height:1.6;
  border-radius:8px;display:block}
#content code:not(.hljs){background:var(--code-bg);color:var(--accent2);
  padding:2px 6px;border-radius:4px;font-size:.875em;
  font-family:ui-monospace,"SFMono-Regular","Fira Code",monospace}

/* ── NAVIGATION ───────────────────────── */
#nav-footer{display:flex;justify-content:space-between;padding:24px 0 0;margin-top:48px;
  border-top:1px solid var(--border);gap:16px}
.nav-card{flex:1;max-width:280px;padding:16px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;cursor:pointer;
  transition:border-color .2s,transform .15s;text-decoration:none;display:block}
.nav-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.nav-card .nav-dir{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.nav-card .nav-title{font-size:14px;font-weight:600;color:var(--text)}
.nav-card.next-card{margin-left:auto;text-align:right}

/* ── SEARCH RESULTS ───────────────────── */
#search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--sidebar);
  border:1px solid var(--border);border-radius:8px;max-height:320px;overflow-y:auto;
  z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#search-results:empty{display:none}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--surface)}
.sr-chapter{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.sr-match{font-size:13px;color:var(--text)}
.sr-match mark{background:rgba(88,166,255,.25);color:var(--accent);border-radius:2px;padding:0 2px}

/* ── MISC ─────────────────────────────── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
#overlay.show{display:block}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:20px}
.badge.new{background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3)}

/* ── SPINNER ──────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:24px;height:24px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:80px auto}

/* ── RESPONSIVE ───────────────────────── */
@media(max-width:768px){
  #content-wrap{padding:24px 20px}
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{width:100%}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>

<script>
const CHAPTERS = {
  "README": "# Angular 20 — Zero to Pro Developer Guide\r\n\r\n\u003e A complete, practical, example-driven guide covering every core and advanced Angular 20 concept.\r\n\r\n---\r\n\r\n## Table of Contents\r\n\r\n| # | Chapter | Topics Covered |\r\n|---|---------|----------------|\r\n| 01 | [Getting Started](./01-getting-started.md) | Installation, CLI, project structure, first app |\r\n| 02 | [Components](./02-components.md) | Class, decorator, lifecycle hooks, view encapsulation, inputs/outputs |\r\n| 03 | [Templates, Binding \u0026 Directives](./03-templates-binding-directives.md) | Interpolation, property/event/two-way binding, built-in directives, pipes |\r\n| 04 | [Services \u0026 Dependency Injection](./04-services-di.md) | Providers, hierarchical DI, InjectionToken, inject() |\r\n| 05 | [Angular Router](./05-router.md) | Routes, lazy loading, guards, resolvers, query params |\r\n| 06 | [Forms](./06-forms.md) | Template-driven forms, Reactive forms, validators, async validators |\r\n| 07 | [HTTP Client](./07-http-client.md) | HttpClient, interceptors, error handling, caching |\r\n| 08 | [Signals \u0026 State](./08-signals-state.md) | signal(), computed(), effect(), NgRx SignalStore |\r\n| 09 | [Standalone APIs](./09-standalone.md) | Standalone components, bootstrapApplication, importProvidersFrom |\r\n| 10 | [Performance](./10-performance.md) | OnPush, trackBy, deferrable views, SSR, hydration |\r\n| 11 | [Testing](./11-testing.md) | Unit tests, TestBed, component harnesses, E2E with Playwright |\r\n| 12 | [Advanced Patterns](./12-advanced.md) | Dynamic components, portals, custom decorators, micro-frontends |\r\n\r\n---\r\n\r\n## Prerequisites\r\n\r\n| Skill | Level needed |\r\n|-------|-------------|\r\n| HTML / CSS | Basic |\r\n| JavaScript (ES2022+) | Intermediate |\r\n| TypeScript | Basic (guide teaches as needed) |\r\n\r\n---\r\n\r\n## What is Angular 20?\r\n\r\nAngular 20 is a **platform and framework** for building single-page client applications in HTML and TypeScript.  \r\nKey pillars of modern Angular (v16 → v20):\r\n\r\n- **Signals** — fine-grained reactivity without Zone.js\r\n- **Standalone** — no NgModule boilerplate required\r\n- **Deferrable Views** — built-in lazy-loading inside templates\r\n- **SSR + Hydration** — first-class server-side rendering\r\n- **Typed Forms** — fully type-safe reactive forms\r\n- **esbuild / Vite** — blazing fast builds\r\n\r\n---\r\n\r\n## Quick-start (3 commands)\r\n\r\n```bash\r\nnpm install -g @angular/cli@20\r\nng new my-app --standalone --style=scss\r\ncd my-app \u0026\u0026 ng serve\r\n```\r\n\r\nOpen **http://localhost:4200** — your first Angular 20 app is running!\r\n\r\n---\r\n\r\n\u003e Start with [01-getting-started.md](./01-getting-started.md) and work through each chapter in order.\r\n",
  "01-getting-started": "# Chapter 01 — Getting Started with Angular 20\r\n\r\n---\r\n\r\n## 1. Installing the Tools\r\n\r\n```bash\r\n# Node.js 22+ required — check version\r\nnode -v     # should be \u003e= 22.0.0\r\nnpm -v      # should be \u003e= 10.0.0\r\n\r\n# Install Angular CLI globally\r\nnpm install -g @angular/cli@20\r\n\r\n# Verify\r\nng version\r\n```\r\n\r\n---\r\n\r\n## 2. Creating Your First Project\r\n\r\n```bash\r\nng new my-shop \\\r\n  --standalone \\        # no NgModule boilerplate\r\n  --routing \\           # generates app routing\r\n  --style=scss \\        # SCSS for styles\r\n  --strict              # strict TypeScript\r\n```\r\n\r\n**What each flag means:**\r\n\r\n| Flag | Purpose |\r\n|------|---------|\r\n| `--standalone` | Every component is standalone (Angular 20 default) |\r\n| `--routing` | Creates `app.routes.ts` and wires up the router |\r\n| `--style=scss` | Use SCSS instead of plain CSS |\r\n| `--strict` | Enables strict TypeScript \u0026 template type-checking |\r\n\r\n---\r\n\r\n## 3. Project Structure Explained\r\n\r\n```\r\nmy-shop/\r\n├── angular.json          ← Workspace / build config\r\n├── package.json          ← npm dependencies\r\n├── tsconfig.json         ← TypeScript root config\r\n├── tsconfig.app.json     ← App-specific TS config\r\n├── tsconfig.spec.json    ← Test-specific TS config\r\n└── src/\r\n    ├── index.html        ← Single HTML shell\r\n    ├── main.ts           ← Bootstrap entry point\r\n    ├── styles.scss       ← Global styles\r\n    └── app/\r\n        ├── app.component.ts        ← Root component\r\n        ├── app.component.html\r\n        ├── app.component.scss\r\n        ├── app.component.spec.ts   ← Unit tests\r\n        └── app.routes.ts           ← Route definitions\r\n```\r\n\r\n### `main.ts` — Bootstrap (Standalone style)\r\n\r\n```typescript\r\nimport { bootstrapApplication } from \u0027@angular/platform-browser\u0027;\r\nimport { appConfig }            from \u0027./app/app.config\u0027;\r\nimport { AppComponent }         from \u0027./app/app.component\u0027;\r\n\r\nbootstrapApplication(AppComponent, appConfig)\r\n  .catch(err =\u003e console.error(err));\r\n```\r\n\r\n### `app.config.ts`\r\n\r\n```typescript\r\nimport { ApplicationConfig } from \u0027@angular/core\u0027;\r\nimport { provideRouter }     from \u0027@angular/router\u0027;\r\nimport { routes }            from \u0027./app.routes\u0027;\r\n\r\nexport const appConfig: ApplicationConfig = {\r\n  providers: [\r\n    provideRouter(routes),\r\n  ],\r\n};\r\n```\r\n\r\n### `app.routes.ts`\r\n\r\n```typescript\r\nimport { Routes } from \u0027@angular/router\u0027;\r\n\r\nexport const routes: Routes = [\r\n  { path: \u0027\u0027, redirectTo: \u0027home\u0027, pathMatch: \u0027full\u0027 },\r\n  // add more routes here\r\n];\r\n```\r\n\r\n---\r\n\r\n## 4. Angular CLI Cheat Sheet\r\n\r\n```bash\r\n# Serve with live reload\r\nng serve\r\n\r\n# Serve on a custom port\r\nng serve --port 4300\r\n\r\n# Generate a standalone component\r\nng generate component features/product-list\r\n\r\n# Shorthand\r\nng g c features/product-list\r\n\r\n# Generate a service\r\nng g s core/services/product\r\n\r\n# Generate a guard\r\nng g guard core/guards/auth\r\n\r\n# Run tests\r\nng test\r\n\r\n# Build for production\r\nng build --configuration production\r\n\r\n# Analyze bundle\r\nng build --stats-json\r\nnpx webpack-bundle-analyzer dist/my-shop/stats.json\r\n```\r\n\r\n---\r\n\r\n## 5. Understanding `angular.json`\r\n\r\nKey sections you will touch most:\r\n\r\n```json\r\n{\r\n  \"projects\": {\r\n    \"my-shop\": {\r\n      \"architect\": {\r\n        \"build\": {\r\n          \"options\": {\r\n            \"outputPath\": \"dist/my-shop\",\r\n            \"index\": \"src/index.html\",\r\n            \"main\": \"src/main.ts\",\r\n            \"styles\": [\"src/styles.scss\"],\r\n            \"assets\": [\"src/favicon.ico\", \"src/assets\"]\r\n          },\r\n          \"configurations\": {\r\n            \"production\": {\r\n              \"optimization\": true,\r\n              \"sourceMap\": false,\r\n              \"budgets\": [\r\n                { \"type\": \"initial\", \"maximumWarning\": \"500kB\", \"maximumError\": \"1MB\" }\r\n              ]\r\n            }\r\n          }\r\n        }\r\n      }\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 6. TypeScript Basics You Need for Angular\r\n\r\n### Decorators\r\n\r\n```typescript\r\n// A decorator is just a function that modifies a class\r\nfunction Log(target: any) {\r\n  console.log(\u0027Class created:\u0027, target.name);\r\n}\r\n\r\n@Log\r\nclass MyService {}\r\n```\r\n\r\n### Interfaces \u0026 Types\r\n\r\n```typescript\r\n// Prefer interfaces for object shapes\r\ninterface Product {\r\n  id: number;\r\n  name: string;\r\n  price: number;\r\n  inStock?: boolean;   // optional\r\n}\r\n\r\n// Type alias for union types\r\ntype Status = \u0027active\u0027 | \u0027inactive\u0027 | \u0027pending\u0027;\r\n```\r\n\r\n### Generics\r\n\r\n```typescript\r\n// A wrapper that can hold any type\r\ninterface ApiResponse\u003cT\u003e {\r\n  data: T;\r\n  total: number;\r\n  page: number;\r\n}\r\n\r\n// Usage\r\nconst response: ApiResponse\u003cProduct[]\u003e = {\r\n  data: [...],\r\n  total: 100,\r\n  page: 1,\r\n};\r\n```\r\n\r\n### Optional chaining \u0026 Nullish coalescing\r\n\r\n```typescript\r\nconst city = user?.address?.city ?? \u0027Unknown\u0027;\r\n```\r\n\r\n---\r\n\r\n## 7. Hello World — Step by Step\r\n\r\n### Step 1: Edit `app.component.ts`\r\n\r\n```typescript\r\nimport { Component } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-root\u0027,          // HTML tag: \u003capp-root\u003e\r\n  standalone: true,              // no NgModule needed\r\n  template: `\r\n    \u003ch1\u003eHello, {{ name }}!\u003c/h1\u003e\r\n    \u003cbutton (click)=\"changeName()\"\u003eChange Name\u003c/button\u003e\r\n  `,\r\n  styles: [`h1 { color: steelblue; }`]\r\n})\r\nexport class AppComponent {\r\n  name = \u0027Angular 20\u0027;\r\n\r\n  changeName() {\r\n    this.name = \u0027Developer!\u0027;\r\n  }\r\n}\r\n```\r\n\r\n### Step 2: `ng serve` and open the browser\r\n\r\nYou see: **Hello, Angular 20!**  \r\nClick the button and it changes to **Hello, Developer!**\r\n\r\nThis is Angular in its simplest form:\r\n- **Class property** `name` = the data (model)\r\n- **`{{ name }}`** = interpolation binding (view reads the model)\r\n- **`(click)`** = event binding (user interaction updates the model)\r\n\r\n---\r\n\r\n## 8. Environment Configuration\r\n\r\n```\r\nsrc/environments/\r\n  environment.ts          ← development\r\n  environment.prod.ts     ← production\r\n```\r\n\r\n```typescript\r\n// environment.ts\r\nexport const environment = {\r\n  production: false,\r\n  apiUrl: \u0027https://localhost:5001/api\u0027,\r\n};\r\n\r\n// environment.prod.ts\r\nexport const environment = {\r\n  production: true,\r\n  apiUrl: \u0027https://api.myshop.com\u0027,\r\n};\r\n```\r\n\r\n**Use it anywhere:**\r\n\r\n```typescript\r\nimport { environment } from \u0027../../environments/environment\u0027;\r\n\r\nconst url = `${environment.apiUrl}/products`;\r\n```\r\n\r\nAngular CLI automatically swaps the file based on the build configuration.\r\n\r\n---\r\n\r\n## 9. VS Code Extensions for Angular\r\n\r\n| Extension | Purpose |\r\n|-----------|---------|\r\n| Angular Language Service | Template IntelliSense |\r\n| ESLint | Linting |\r\n| Prettier | Code formatting |\r\n| Angular Snippets | Code snippets |\r\n| Material Icon Theme | Better file icons |\r\n\r\n---\r\n\r\n## Summary\r\n\r\n- Angular 20 uses **standalone components** by default (no NgModule).\r\n- The entry point is `main.ts` → `bootstrapApplication()`.\r\n- `angular.json` controls build, serve, and test targets.\r\n- Angular CLI (`ng`) is your best friend for generating code.\r\n\r\n**Next:** [02 — Components →](./02-components.md)\r\n",
  "02-components": "# Chapter 02 — Components\r\n\r\nA **component** is the fundamental building block of every Angular application.  \r\nEvery UI element — a button, a product card, a full page — is a component.\r\n\r\n---\r\n\r\n## 1. Anatomy of a Component\r\n\r\n```typescript\r\nimport { Component, OnInit } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-card\u0027,    // 1. HTML tag\r\n  standalone: true,                // 2. No NgModule\r\n  templateUrl: \u0027./product-card.component.html\u0027,  // 3. Template\r\n  styleUrls: [\u0027./product-card.component.scss\u0027],  // 4. Styles\r\n})\r\nexport class ProductCardComponent implements OnInit {\r\n  // 5. Properties (state / data)\r\n  title = \u0027Laptop\u0027;\r\n  price = 999;\r\n\r\n  // 6. Lifecycle hook\r\n  ngOnInit(): void {\r\n    console.log(\u0027ProductCard initialised\u0027);\r\n  }\r\n}\r\n```\r\n\r\n| Part | Purpose |\r\n|------|---------|\r\n| `selector` | The HTML tag used to render this component: `\u003capp-product-card\u003e` |\r\n| `standalone: true` | Component manages its own imports — no NgModule required |\r\n| `templateUrl` | External HTML file (or use inline `template`) |\r\n| `styleUrls` | External SCSS/CSS files (or use inline `styles`) |\r\n\r\n---\r\n\r\n## 2. Inline vs External Template/Styles\r\n\r\n### Inline (good for tiny components)\r\n\r\n```typescript\r\n@Component({\r\n  selector: \u0027app-badge\u0027,\r\n  standalone: true,\r\n  template: `\u003cspan class=\"badge\"\u003e{{ label }}\u003c/span\u003e`,\r\n  styles: [`.badge { background: gold; padding: 4px 8px; border-radius: 4px; }`]\r\n})\r\nexport class BadgeComponent {\r\n  label = \u0027NEW\u0027;\r\n}\r\n```\r\n\r\n### External files (preferred for most components)\r\n\r\n```\r\nbadge/\r\n  badge.component.ts\r\n  badge.component.html\r\n  badge.component.scss\r\n  badge.component.spec.ts\r\n```\r\n\r\n---\r\n\r\n## 3. Component Inputs — Passing Data In\r\n\r\nUse `@Input()` to accept data from a parent component.\r\n\r\n```typescript\r\n// child: product-card.component.ts\r\nimport { Component, Input } from \u0027@angular/core\u0027;\r\n\r\ninterface Product {\r\n  id: number;\r\n  name: string;\r\n  price: number;\r\n  imageUrl: string;\r\n}\r\n\r\n@Component({\r\n  selector: \u0027app-product-card\u0027,\r\n  standalone: true,\r\n  template: `\r\n    \u003cdiv class=\"card\"\u003e\r\n      \u003cimg [src]=\"product.imageUrl\" [alt]=\"product.name\" /\u003e\r\n      \u003ch3\u003e{{ product.name }}\u003c/h3\u003e\r\n      \u003cp\u003e{{ product.price | currency }}\u003c/p\u003e\r\n    \u003c/div\u003e\r\n  `,\r\n})\r\nexport class ProductCardComponent {\r\n  @Input({ required: true }) product!: Product;\r\n  // Angular 20: required input — compiler error if parent forgets it\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- parent template --\u003e\r\n\u003capp-product-card [product]=\"selectedProduct\" /\u003e\r\n```\r\n\r\n### Input with transform (Angular 16+)\r\n\r\n```typescript\r\nimport { Input, booleanAttribute, numberAttribute } from \u0027@angular/core\u0027;\r\n\r\n@Component({ selector: \u0027app-toggle\u0027, standalone: true, template: `...` })\r\nexport class ToggleComponent {\r\n  @Input({ transform: booleanAttribute }) disabled = false;\r\n  @Input({ transform: numberAttribute }) tabIndex = 0;\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- No need to bind: disabled=\"true\", just use the attribute --\u003e\r\n\u003capp-toggle disabled tabIndex=\"3\" /\u003e\r\n```\r\n\r\n---\r\n\r\n## 4. Component Outputs — Emitting Events\r\n\r\nUse `@Output()` with `EventEmitter` to send data to the parent.\r\n\r\n```typescript\r\n// child\r\nimport { Component, Input, Output, EventEmitter } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-card\u0027,\r\n  standalone: true,\r\n  template: `\r\n    \u003cdiv class=\"card\"\u003e\r\n      \u003ch3\u003e{{ product.name }}\u003c/h3\u003e\r\n      \u003cbutton (click)=\"addToCart()\"\u003eAdd to Cart\u003c/button\u003e\r\n    \u003c/div\u003e\r\n  `,\r\n})\r\nexport class ProductCardComponent {\r\n  @Input({ required: true }) product!: any;\r\n  @Output() cartAdded = new EventEmitter\u003cnumber\u003e(); // emits the product id\r\n\r\n  addToCart() {\r\n    this.cartAdded.emit(this.product.id);\r\n  }\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- parent --\u003e\r\n\u003capp-product-card\r\n  [product]=\"p\"\r\n  (cartAdded)=\"onCartAdded($event)\"\r\n/\u003e\r\n```\r\n\r\n```typescript\r\n// parent class\r\nonCartAdded(productId: number) {\r\n  console.log(\u0027Added product\u0027, productId);\r\n}\r\n```\r\n\r\n---\r\n\r\n## 5. Modern Signal-based Inputs \u0026 Outputs (Angular 17+)\r\n\r\nAngular 20 recommends the new signal-based API:\r\n\r\n```typescript\r\nimport { Component, input, output } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-card\u0027,\r\n  standalone: true,\r\n  template: `\r\n    \u003ch3\u003e{{ product().name }}\u003c/h3\u003e   \u003c!-- call as function --\u003e\r\n    \u003cbutton (click)=\"addToCart()\"\u003eAdd\u003c/button\u003e\r\n  `,\r\n})\r\nexport class ProductCardComponent {\r\n  // Signal input — reactive, no @Input decorator\r\n  product = input.required\u003cProduct\u003e();\r\n\r\n  // Signal output — replaces EventEmitter\r\n  cartAdded = output\u003cnumber\u003e();\r\n\r\n  addToCart() {\r\n    this.cartAdded.emit(this.product().id);\r\n  }\r\n}\r\n```\r\n\r\n\u003e **Signal inputs** are read-only signals — use `product()` to get the value.  \r\n\u003e Changes propagate without Zone.js.\r\n\r\n---\r\n\r\n## 6. Lifecycle Hooks\r\n\r\nAngular calls lifecycle hooks in this order:\r\n\r\n```\r\nconstructor()\r\n  ↓\r\nngOnChanges()    ← called when @Input values change\r\n  ↓\r\nngOnInit()       ← called once after first ngOnChanges\r\n  ↓\r\nngDoCheck()      ← every change detection cycle\r\n  ↓\r\nngAfterContentInit()   ← after projected content initialised\r\n  ↓\r\nngAfterContentChecked()\r\n  ↓\r\nngAfterViewInit()      ← after the component\u0027s view initialised\r\n  ↓\r\nngAfterViewChecked()\r\n  ↓\r\nngOnDestroy()    ← just before component is removed from DOM\r\n```\r\n\r\n### Practical examples\r\n\r\n```typescript\r\nimport {\r\n  Component, OnInit, OnDestroy, OnChanges,\r\n  SimpleChanges, AfterViewInit, ViewChild, ElementRef\r\n} from \u0027@angular/core\u0027;\r\n\r\n@Component({ selector: \u0027app-demo\u0027, standalone: true, template: `\u003ccanvas #chart\u003e\u003c/canvas\u003e` })\r\nexport class DemoComponent implements OnInit, OnChanges, AfterViewInit, OnDestroy {\r\n  @ViewChild(\u0027chart\u0027) canvasRef!: ElementRef\u003cHTMLCanvasElement\u003e;\r\n\r\n  ngOnChanges(changes: SimpleChanges): void {\r\n    // changes[\u0027inputName\u0027].currentValue / previousValue / firstChange\r\n    if (changes[\u0027product\u0027]) {\r\n      console.log(\u0027Product changed:\u0027, changes[\u0027product\u0027].currentValue);\r\n    }\r\n  }\r\n\r\n  ngOnInit(): void {\r\n    // Good place to: fetch initial data, subscribe to route params\r\n    console.log(\u0027Component initialised\u0027);\r\n  }\r\n\r\n  ngAfterViewInit(): void {\r\n    // DOM is ready — safe to use ViewChild references\r\n    const ctx = this.canvasRef.nativeElement.getContext(\u00272d\u0027);\r\n  }\r\n\r\n  ngOnDestroy(): void {\r\n    // Unsubscribe from observables, clear intervals, destroy third-party instances\r\n    this.subscription?.unsubscribe();\r\n  }\r\n\r\n  private subscription: any;\r\n}\r\n```\r\n\r\n---\r\n\r\n## 7. ViewChild \u0026 ViewChildren\r\n\r\nAccess child component instances or DOM elements from the class.\r\n\r\n```typescript\r\nimport { Component, ViewChild, ViewChildren, QueryList, AfterViewInit } from \u0027@angular/core\u0027;\r\nimport { NgForm } from \u0027@angular/forms\u0027;\r\nimport { ProductCardComponent } from \u0027./product-card.component\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-list\u0027,\r\n  standalone: true,\r\n  imports: [ProductCardComponent],\r\n  template: `\r\n    \u003capp-product-card #firstCard [product]=\"products[0]\" /\u003e\r\n    \u003capp-product-card *ngFor=\"let p of products\" [product]=\"p\" /\u003e\r\n  `,\r\n})\r\nexport class ProductListComponent implements AfterViewInit {\r\n  @ViewChild(\u0027firstCard\u0027) firstCard!: ProductCardComponent;\r\n  @ViewChildren(ProductCardComponent) allCards!: QueryList\u003cProductCardComponent\u003e;\r\n\r\n  ngAfterViewInit() {\r\n    console.log(\u0027First card:\u0027, this.firstCard);\r\n    console.log(\u0027All cards count:\u0027, this.allCards.length);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 8. Content Projection (ng-content)\r\n\r\nBuild wrapper/layout components that accept arbitrary HTML from the parent.\r\n\r\n```typescript\r\n// card-shell.component.ts\r\n@Component({\r\n  selector: \u0027app-card-shell\u0027,\r\n  standalone: true,\r\n  template: `\r\n    \u003cdiv class=\"shell\"\u003e\r\n      \u003cdiv class=\"header\"\u003e\r\n        \u003cng-content select=\"[slot=header]\" /\u003e\r\n      \u003c/div\u003e\r\n      \u003cdiv class=\"body\"\u003e\r\n        \u003cng-content /\u003e          \u003c!-- default slot --\u003e\r\n      \u003c/div\u003e\r\n      \u003cdiv class=\"footer\"\u003e\r\n        \u003cng-content select=\"[slot=footer]\" /\u003e\r\n      \u003c/div\u003e\r\n    \u003c/div\u003e\r\n  `,\r\n})\r\nexport class CardShellComponent {}\r\n```\r\n\r\n```html\r\n\u003c!-- usage --\u003e\r\n\u003capp-card-shell\u003e\r\n  \u003ch2 slot=\"header\"\u003eProduct Title\u003c/h2\u003e\r\n  \u003cp\u003eMain body content goes here.\u003c/p\u003e\r\n  \u003cbutton slot=\"footer\"\u003eBuy Now\u003c/button\u003e\r\n\u003c/app-card-shell\u003e\r\n```\r\n\r\n---\r\n\r\n## 9. View Encapsulation\r\n\r\nControls how component styles are scoped.\r\n\r\n```typescript\r\nimport { Component, ViewEncapsulation } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-demo\u0027,\r\n  standalone: true,\r\n  template: `\u003cp class=\"text\"\u003eHello\u003c/p\u003e`,\r\n  styles: [`.text { color: red; }`],\r\n  encapsulation: ViewEncapsulation.Emulated,  // DEFAULT — scoped via attributes\r\n  // encapsulation: ViewEncapsulation.None,   // Global styles (no scoping)\r\n  // encapsulation: ViewEncapsulation.ShadowDom, // Native Shadow DOM\r\n})\r\nexport class DemoComponent {}\r\n```\r\n\r\n| Mode | Behaviour |\r\n|------|-----------|\r\n| `Emulated` (default) | Angular adds unique attributes to scope styles — safest |\r\n| `None` | Styles are global — can cause leakage |\r\n| `ShadowDom` | Uses browser\u0027s native Shadow DOM — true isolation |\r\n\r\n---\r\n\r\n## 10. Change Detection\r\n\r\nAngular checks for changes and updates the DOM.\r\n\r\n### Default strategy\r\n\r\nEvery browser event (click, HTTP response, timer) triggers change detection on the **entire component tree**.\r\n\r\n### `OnPush` — for performance\r\n\r\n```typescript\r\nimport { Component, ChangeDetectionStrategy, Input } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-card\u0027,\r\n  standalone: true,\r\n  changeDetection: ChangeDetectionStrategy.OnPush,\r\n  template: `\u003ch3\u003e{{ product.name }}\u003c/h3\u003e`,\r\n})\r\nexport class ProductCardComponent {\r\n  @Input() product!: any;\r\n  // Angular only re-renders this when:\r\n  // 1. An @Input reference changes\r\n  // 2. An Observable emits via async pipe\r\n  // 3. You manually call markForCheck()\r\n}\r\n```\r\n\r\n---\r\n\r\n## 11. Real-World Example — Product Card\r\n\r\n```typescript\r\n// models/product.model.ts\r\nexport interface Product {\r\n  id: number;\r\n  name: string;\r\n  description: string;\r\n  price: number;\r\n  imageUrl: string;\r\n  rating: number;\r\n  reviewCount: number;\r\n  inStock: boolean;\r\n}\r\n```\r\n\r\n```typescript\r\n// product-card.component.ts\r\nimport { Component, input, output, ChangeDetectionStrategy } from \u0027@angular/core\u0027;\r\nimport { CurrencyPipe, NgClass } from \u0027@angular/common\u0027;\r\nimport { Product } from \u0027../../models/product.model\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-card\u0027,\r\n  standalone: true,\r\n  imports: [CurrencyPipe, NgClass],\r\n  changeDetection: ChangeDetectionStrategy.OnPush,\r\n  template: `\r\n    \u003carticle class=\"card\" [ngClass]=\"{ \u0027out-of-stock\u0027: !product().inStock }\"\u003e\r\n      \u003cimg [src]=\"product().imageUrl\" [alt]=\"product().name\" loading=\"lazy\" /\u003e\r\n\r\n      \u003cdiv class=\"info\"\u003e\r\n        \u003ch3 class=\"name\"\u003e{{ product().name }}\u003c/h3\u003e\r\n        \u003cp class=\"description\"\u003e{{ product().description }}\u003c/p\u003e\r\n\r\n        \u003cdiv class=\"meta\"\u003e\r\n          \u003cspan class=\"price\"\u003e{{ product().price | currency }}\u003c/span\u003e\r\n          \u003cspan class=\"rating\"\u003e⭐ {{ product().rating }} ({{ product().reviewCount }})\u003c/span\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cbutton\r\n          class=\"btn-add\"\r\n          [disabled]=\"!product().inStock\"\r\n          (click)=\"addToCart()\"\u003e\r\n          {{ product().inStock ? \u0027Add to Cart\u0027 : \u0027Out of Stock\u0027 }}\r\n        \u003c/button\u003e\r\n      \u003c/div\u003e\r\n    \u003c/article\u003e\r\n  `,\r\n})\r\nexport class ProductCardComponent {\r\n  product = input.required\u003cProduct\u003e();\r\n  cartAdded = output\u003cProduct\u003e();\r\n\r\n  addToCart() {\r\n    if (this.product().inStock) {\r\n      this.cartAdded.emit(this.product());\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Concept | Key API |\r\n|---------|---------|\r\n| Define component | `@Component({ selector, standalone, template })` |\r\n| Accept data from parent | `input()` / `@Input()` |\r\n| Emit events to parent | `output()` / `@Output() EventEmitter` |\r\n| Lifecycle | `ngOnInit`, `ngOnDestroy`, `ngAfterViewInit` … |\r\n| Access DOM / child | `@ViewChild`, `@ViewChildren` |\r\n| Project content | `\u003cng-content\u003e` |\r\n| Performance | `ChangeDetectionStrategy.OnPush` |\r\n\r\n**Next:** [03 — Templates, Binding \u0026 Directives →](./03-templates-binding-directives.md)\r\n",
  "03-templates-binding-directives": "# Chapter 03 — Templates, Data Binding \u0026 Directives\r\n\r\n---\r\n\r\n## 1. Interpolation `{{ }}`\r\n\r\nRenders a TypeScript expression as text.\r\n\r\n```html\r\n\u003ch1\u003e{{ title }}\u003c/h1\u003e\r\n\u003cp\u003ePrice: {{ product.price | currency }}\u003c/p\u003e\r\n\u003cp\u003eSum: {{ 5 + 3 }}\u003c/p\u003e\r\n\u003cp\u003eStatus: {{ isActive ? \u0027Active\u0027 : \u0027Inactive\u0027 }}\u003c/p\u003e\r\n```\r\n\r\n\u003e **Rule:** Expressions inside `{{ }}` must not have side effects (no assignments, no `new`, no `;`).\r\n\r\n---\r\n\r\n## 2. Property Binding `[ ]`\r\n\r\nSets a DOM property or component `@Input` from a class value.\r\n\r\n```html\r\n\u003c!-- DOM property --\u003e\r\n\u003cimg [src]=\"product.imageUrl\" [alt]=\"product.name\" /\u003e\r\n\u003cbutton [disabled]=\"isLoading\"\u003eSave\u003c/button\u003e\r\n\u003cinput [value]=\"username\" /\u003e\r\n\r\n\u003c!-- Component input --\u003e\r\n\u003capp-product-card [product]=\"selectedProduct\" /\u003e\r\n\r\n\u003c!-- Class \u0026 style binding --\u003e\r\n\u003cdiv [class.active]=\"isActive\"\u003e...\u003c/div\u003e\r\n\u003cdiv [style.color]=\"isError ? \u0027red\u0027 : \u0027black\u0027\"\u003e...\u003c/div\u003e\r\n\u003cdiv [ngClass]=\"{ active: isActive, error: hasError }\"\u003e...\u003c/div\u003e\r\n\u003cdiv [ngStyle]=\"{ fontSize: fontSize + \u0027px\u0027, color: themeColor }\"\u003e...\u003c/div\u003e\r\n```\r\n\r\n**Difference: attribute vs property**\r\n\r\n```html\r\n\u003c!-- Attribute (HTML) — sets the initial value only --\u003e\r\n\u003cinput value=\"hello\" /\u003e\r\n\r\n\u003c!-- Property (DOM) — live binding --\u003e\r\n\u003cinput [value]=\"username\" /\u003e\r\n```\r\n\r\n---\r\n\r\n## 3. Event Binding `( )`\r\n\r\nListen to DOM events or component output events.\r\n\r\n```html\r\n\u003c!-- DOM events --\u003e\r\n\u003cbutton (click)=\"onSave()\"\u003eSave\u003c/button\u003e\r\n\u003cinput (input)=\"onInput($event)\" /\u003e\r\n\u003cinput (keyup.enter)=\"onEnter()\" /\u003e\r\n\u003cform (submit)=\"onSubmit($event)\"\u003e...\u003c/form\u003e\r\n\u003cdiv (mouseover)=\"showTooltip()\" (mouseout)=\"hideTooltip()\"\u003e...\u003c/div\u003e\r\n\r\n\u003c!-- Prevent default --\u003e\r\n\u003ca href=\"#\" (click)=\"navigate($event); $event.preventDefault()\"\u003eLink\u003c/a\u003e\r\n```\r\n\r\n```typescript\r\nexport class DemoComponent {\r\n  onInput(event: Event) {\r\n    const value = (event.target as HTMLInputElement).value;\r\n    console.log(value);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 4. Two-Way Binding `[( )]` — \"Banana in a box\"\r\n\r\nCombines property + event binding. The most common use is with forms.\r\n\r\n```html\r\n\u003c!-- Requires FormsModule imported --\u003e\r\n\u003cinput [(ngModel)]=\"username\" /\u003e\r\n\u003cp\u003eHello, {{ username }}\u003c/p\u003e\r\n```\r\n\r\n```typescript\r\nimport { Component } from \u0027@angular/core\u0027;\r\nimport { FormsModule } from \u0027@angular/forms\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-demo\u0027,\r\n  standalone: true,\r\n  imports: [FormsModule],\r\n  template: `\r\n    \u003cinput [(ngModel)]=\"username\" placeholder=\"Type your name\" /\u003e\r\n    \u003cp\u003eHello, {{ username }}\u003c/p\u003e\r\n  `,\r\n})\r\nexport class DemoComponent {\r\n  username = \u0027\u0027;\r\n}\r\n```\r\n\r\n**Custom two-way binding** (no FormsModule needed):\r\n\r\n```typescript\r\n// counter.component.ts\r\nimport { Component, model } from \u0027@angular/core\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-counter\u0027,\r\n  standalone: true,\r\n  template: `\r\n    \u003cbutton (click)=\"decrement()\"\u003e-\u003c/button\u003e\r\n    \u003cspan\u003e{{ count() }}\u003c/span\u003e\r\n    \u003cbutton (click)=\"increment()\"\u003e+\u003c/button\u003e\r\n  `,\r\n})\r\nexport class CounterComponent {\r\n  count = model(0);   // Angular 17+ model() signal\r\n\r\n  increment() { this.count.update(v =\u003e v + 1); }\r\n  decrement() { this.count.update(v =\u003e v - 1); }\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- parent — two-way bound to parentValue signal --\u003e\r\n\u003capp-counter [(count)]=\"parentValue\" /\u003e\r\n```\r\n\r\n---\r\n\r\n## 5. Built-in Control Flow (Angular 17+)\r\n\r\nAngular 20 uses the new `@if`, `@for`, `@switch` syntax (replacing `*ngIf`, `*ngFor`).\r\n\r\n### @if\r\n\r\n```html\r\n@if (isLoggedIn) {\r\n  \u003cp\u003eWelcome back!\u003c/p\u003e\r\n} @else if (isLoading) {\r\n  \u003capp-spinner /\u003e\r\n} @else {\r\n  \u003ca routerLink=\"/login\"\u003ePlease log in\u003c/a\u003e\r\n}\r\n```\r\n\r\n### @for\r\n\r\n```html\r\n@for (product of products; track product.id) {\r\n  \u003capp-product-card [product]=\"product\" /\u003e\r\n} @empty {\r\n  \u003cp\u003eNo products found.\u003c/p\u003e\r\n}\r\n```\r\n\r\n\u003e `track` is **required** in `@for` — it tells Angular how to identify each item for efficient DOM updates. Use a unique field like `id`.\r\n\r\n### @switch\r\n\r\n```html\r\n@switch (orderStatus) {\r\n  @case (\u0027pending\u0027) {\r\n    \u003cspan class=\"badge pending\"\u003ePending\u003c/span\u003e\r\n  }\r\n  @case (\u0027shipped\u0027) {\r\n    \u003cspan class=\"badge shipped\"\u003eShipped\u003c/span\u003e\r\n  }\r\n  @case (\u0027delivered\u0027) {\r\n    \u003cspan class=\"badge delivered\"\u003eDelivered\u003c/span\u003e\r\n  }\r\n  @default {\r\n    \u003cspan class=\"badge\"\u003eUnknown\u003c/span\u003e\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 6. Legacy Structural Directives (still supported)\r\n\r\n```html\r\n\u003c!-- *ngIf --\u003e\r\n\u003cdiv *ngIf=\"isLoggedIn; else loginBlock\"\u003eWelcome!\u003c/div\u003e\r\n\u003cng-template #loginBlock\u003e\u003ca routerLink=\"/login\"\u003eLogin\u003c/a\u003e\u003c/ng-template\u003e\r\n\r\n\u003c!-- *ngFor --\u003e\r\n\u003cul\u003e\r\n  \u003cli *ngFor=\"let item of items; let i = index; trackBy: trackById\"\u003e\r\n    {{ i + 1 }}. {{ item.name }}\r\n  \u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003c!-- *ngSwitch --\u003e\r\n\u003cdiv [ngSwitch]=\"role\"\u003e\r\n  \u003cp *ngSwitchCase=\"\u0027admin\u0027\"\u003eAdmin Panel\u003c/p\u003e\r\n  \u003cp *ngSwitchCase=\"\u0027user\u0027\"\u003eUser Dashboard\u003c/p\u003e\r\n  \u003cp *ngSwitchDefault\u003eGuest View\u003c/p\u003e\r\n\u003c/div\u003e\r\n```\r\n\r\n```typescript\r\ntrackById(index: number, item: { id: number }) {\r\n  return item.id;\r\n}\r\n```\r\n\r\n---\r\n\r\n## 7. Attribute Directives\r\n\r\nAttribute directives **change the appearance or behaviour** of an existing element.\r\n\r\n### `NgClass`\r\n\r\n```html\r\n\u003cdiv [ngClass]=\"cardClasses\"\u003eCard\u003c/div\u003e\r\n```\r\n\r\n```typescript\r\nget cardClasses() {\r\n  return {\r\n    \u0027card\u0027: true,\r\n    \u0027card--featured\u0027: this.product.featured,\r\n    \u0027card--sold-out\u0027: !this.product.inStock,\r\n  };\r\n}\r\n```\r\n\r\n### `NgStyle`\r\n\r\n```html\r\n\u003cdiv [ngStyle]=\"{ \u0027font-size.px\u0027: fontSize, color: textColor }\"\u003eText\u003c/div\u003e\r\n```\r\n\r\n### Building a Custom Attribute Directive\r\n\r\n```typescript\r\n// highlight.directive.ts\r\nimport { Directive, ElementRef, HostListener, Input } from \u0027@angular/core\u0027;\r\n\r\n@Directive({\r\n  selector: \u0027[appHighlight]\u0027,\r\n  standalone: true,\r\n})\r\nexport class HighlightDirective {\r\n  @Input() appHighlight = \u0027yellow\u0027;   // color passed as attribute value\r\n\r\n  constructor(private el: ElementRef) {}\r\n\r\n  @HostListener(\u0027mouseenter\u0027)\r\n  onMouseEnter() {\r\n    this.el.nativeElement.style.backgroundColor = this.appHighlight;\r\n  }\r\n\r\n  @HostListener(\u0027mouseleave\u0027)\r\n  onMouseLeave() {\r\n    this.el.nativeElement.style.backgroundColor = \u0027\u0027;\r\n  }\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- usage --\u003e\r\n\u003cp appHighlight=\"lightblue\"\u003eHover over me!\u003c/p\u003e\r\n\u003cp appHighlight\u003eUses default yellow\u003c/p\u003e\r\n```\r\n\r\n---\r\n\r\n## 8. Structural Directive — Build Your Own\r\n\r\n```typescript\r\n// unless.directive.ts  (opposite of *ngIf)\r\nimport { Directive, Input, TemplateRef, ViewContainerRef } from \u0027@angular/core\u0027;\r\n\r\n@Directive({\r\n  selector: \u0027[appUnless]\u0027,\r\n  standalone: true,\r\n})\r\nexport class UnlessDirective {\r\n  private rendered = false;\r\n\r\n  constructor(\r\n    private tpl: TemplateRef\u003cany\u003e,\r\n    private vcr: ViewContainerRef,\r\n  ) {}\r\n\r\n  @Input() set appUnless(condition: boolean) {\r\n    if (!condition \u0026\u0026 !this.rendered) {\r\n      this.vcr.createEmbeddedView(this.tpl);\r\n      this.rendered = true;\r\n    } else if (condition \u0026\u0026 this.rendered) {\r\n      this.vcr.clear();\r\n      this.rendered = false;\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n```html\r\n\u003cp *appUnless=\"isLoggedIn\"\u003ePlease log in to continue.\u003c/p\u003e\r\n```\r\n\r\n---\r\n\r\n## 9. Pipes\r\n\r\nPipes **transform displayed values** without changing the underlying data.\r\n\r\n### Built-in Pipes\r\n\r\n```html\r\n\u003c!-- DatePipe --\u003e\r\n{{ today | date }}                     \u003c!-- May 5, 2026 --\u003e\r\n{{ today | date:\u0027dd/MM/yyyy\u0027 }}        \u003c!-- 05/05/2026 --\u003e\r\n{{ today | date:\u0027shortTime\u0027 }}         \u003c!-- 10:30 AM --\u003e\r\n\r\n\u003c!-- CurrencyPipe --\u003e\r\n{{ price | currency }}                 \u003c!-- $999.00 --\u003e\r\n{{ price | currency:\u0027EUR\u0027:\u0027symbol\u0027 }}  \u003c!-- €999.00 --\u003e\r\n\r\n\u003c!-- DecimalPipe --\u003e\r\n{{ 3.14159 | number:\u00271.2-2\u0027 }}        \u003c!-- 3.14 --\u003e\r\n\r\n\u003c!-- PercentPipe --\u003e\r\n{{ 0.75 | percent }}                   \u003c!-- 75% --\u003e\r\n\r\n\u003c!-- UpperCase / LowerCase / TitleCase --\u003e\r\n{{ \u0027hello world\u0027 | titlecase }}        \u003c!-- Hello World --\u003e\r\n\r\n\u003c!-- SlicePipe --\u003e\r\n{{ items | slice:0:5 }}               \u003c!-- first 5 items --\u003e\r\n\r\n\u003c!-- JsonPipe (debug) --\u003e\r\n\u003cpre\u003e{{ someObject | json }}\u003c/pre\u003e\r\n\r\n\u003c!-- AsyncPipe — subscribes automatically --\u003e\r\n{{ products$ | async | json }}\r\n```\r\n\r\n### Chaining Pipes\r\n\r\n```html\r\n{{ product.name | uppercase | slice:0:10 }}\r\n```\r\n\r\n### Custom Pipe\r\n\r\n```typescript\r\n// truncate.pipe.ts\r\nimport { Pipe, PipeTransform } from \u0027@angular/core\u0027;\r\n\r\n@Pipe({\r\n  name: \u0027truncate\u0027,\r\n  standalone: true,\r\n})\r\nexport class TruncatePipe implements PipeTransform {\r\n  transform(value: string, limit = 50, ellipsis = \u0027…\u0027): string {\r\n    if (!value) return \u0027\u0027;\r\n    return value.length \u003e limit ? value.substring(0, limit) + ellipsis : value;\r\n  }\r\n}\r\n```\r\n\r\n```html\r\n\u003c!-- import TruncatePipe in the component\u0027s imports array --\u003e\r\n{{ product.description | truncate:80 }}\r\n```\r\n\r\n---\r\n\r\n## 10. Template Reference Variables\r\n\r\n```html\r\n\u003c!-- Grab a DOM element reference --\u003e\r\n\u003cinput #nameInput type=\"text\" /\u003e\r\n\u003cbutton (click)=\"greet(nameInput.value)\"\u003eGreet\u003c/button\u003e\r\n\r\n\u003c!-- Grab a component/directive reference --\u003e\r\n\u003capp-product-card #card [product]=\"p\" /\u003e\r\n\u003cbutton (click)=\"card.addToCart()\"\u003eQuick Add\u003c/button\u003e\r\n\r\n\u003c!-- Grab NgForm --\u003e\r\n\u003cform #loginForm=\"ngForm\" (ngSubmit)=\"submit(loginForm)\"\u003e\r\n  \u003cinput name=\"email\" ngModel required /\u003e\r\n  \u003cbutton type=\"submit\" [disabled]=\"loginForm.invalid\"\u003eLogin\u003c/button\u003e\r\n\u003c/form\u003e\r\n```\r\n\r\n---\r\n\r\n## 11. `ng-container` \u0026 `ng-template`\r\n\r\n### `ng-container` — logical grouping, renders no DOM element\r\n\r\n```html\r\n\u003c!-- Apply multiple structural directives without adding a wrapping div --\u003e\r\n\u003cng-container *ngIf=\"isAdmin\"\u003e\r\n  \u003cbutton\u003eEdit\u003c/button\u003e\r\n  \u003cbutton\u003eDelete\u003c/button\u003e\r\n\u003c/ng-container\u003e\r\n\r\n\u003c!-- New syntax --\u003e\r\n@if (isAdmin) {\r\n  \u003cbutton\u003eEdit\u003c/button\u003e\r\n  \u003cbutton\u003eDelete\u003c/button\u003e\r\n}\r\n```\r\n\r\n### `ng-template` — define reusable template fragments\r\n\r\n```html\r\n\u003cng-template #loading\u003e\r\n  \u003capp-spinner /\u003e\r\n  \u003cp\u003eLoading…\u003c/p\u003e\r\n\u003c/ng-template\u003e\r\n\r\n@if (products.length; else loading) {\r\n  \u003capp-product-card *ngFor=\"let p of products\" [product]=\"p\" /\u003e\r\n}\r\n```\r\n\r\n---\r\n\r\n## 12. Deferrable Views `@defer` (Angular 17+)\r\n\r\nLazy-load heavy parts of the template:\r\n\r\n```html\r\n@defer (on viewport) {\r\n  \u003c!-- Loaded only when this area scrolls into view --\u003e\r\n  \u003capp-heavy-chart [data]=\"chartData\" /\u003e\r\n} @placeholder {\r\n  \u003cdiv class=\"placeholder\"\u003eChart loading…\u003c/div\u003e\r\n} @loading (minimum 300ms) {\r\n  \u003capp-spinner /\u003e\r\n} @error {\r\n  \u003cp\u003eFailed to load chart.\u003c/p\u003e\r\n}\r\n```\r\n\r\n**Triggers:**\r\n\r\n| Trigger | Description |\r\n|---------|-------------|\r\n| `on idle` | When browser is idle (default) |\r\n| `on viewport` | When element enters the viewport |\r\n| `on interaction` | On first click or focus |\r\n| `on hover` | On first hover |\r\n| `on timer(2s)` | After a delay |\r\n| `when condition` | When a boolean expression is true |\r\n\r\n---\r\n\r\n## 13. Full Example — Product List Template\r\n\r\n```typescript\r\n// product-list.component.ts\r\nimport { Component, OnInit, signal } from \u0027@angular/core\u0027;\r\nimport { CurrencyPipe, NgClass, SlicePipe } from \u0027@angular/common\u0027;\r\nimport { ProductCardComponent } from \u0027./product-card.component\u0027;\r\nimport { TruncatePipe } from \u0027../pipes/truncate.pipe\u0027;\r\nimport { Product } from \u0027../models/product.model\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-product-list\u0027,\r\n  standalone: true,\r\n  imports: [CurrencyPipe, NgClass, SlicePipe, ProductCardComponent, TruncatePipe],\r\n  template: `\r\n    \u003csection class=\"product-list\"\u003e\r\n      \u003cheader\u003e\r\n        \u003ch2\u003eProducts ({{ products().length }})\u003c/h2\u003e\r\n        \u003cinput\r\n          #searchInput\r\n          type=\"text\"\r\n          placeholder=\"Search…\"\r\n          (input)=\"search(searchInput.value)\"\r\n        /\u003e\r\n      \u003c/header\u003e\r\n\r\n      @if (isLoading()) {\r\n        \u003capp-spinner /\u003e\r\n      } @else if (filtered().length === 0) {\r\n        \u003cp class=\"empty\"\u003eNo products match \"{{ searchTerm() }}\".\u003c/p\u003e\r\n      } @else {\r\n        \u003cdiv class=\"grid\"\u003e\r\n          @for (product of filtered(); track product.id) {\r\n            \u003capp-product-card\r\n              [product]=\"product\"\r\n              (cartAdded)=\"onCartAdded($event)\"\r\n            /\u003e\r\n          }\r\n        \u003c/div\u003e\r\n      }\r\n    \u003c/section\u003e\r\n  `,\r\n})\r\nexport class ProductListComponent implements OnInit {\r\n  products = signal\u003cProduct[]\u003e([]);\r\n  searchTerm = signal(\u0027\u0027);\r\n  isLoading = signal(true);\r\n\r\n  filtered = computed(() =\u003e\r\n    this.products().filter(p =\u003e\r\n      p.name.toLowerCase().includes(this.searchTerm().toLowerCase())\r\n    )\r\n  );\r\n\r\n  ngOnInit() {\r\n    // Simulated fetch\r\n    setTimeout(() =\u003e {\r\n      this.products.set([\r\n        { id: 1, name: \u0027Laptop Pro\u0027, price: 1499, /* ... */ } as Product,\r\n        { id: 2, name: \u0027Wireless Mouse\u0027, price: 39, /* ... */ } as Product,\r\n      ]);\r\n      this.isLoading.set(false);\r\n    }, 1000);\r\n  }\r\n\r\n  search(term: string) {\r\n    this.searchTerm.set(term);\r\n  }\r\n\r\n  onCartAdded(product: Product) {\r\n    console.log(\u0027Cart:\u0027, product.name);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Syntax | Purpose |\r\n|--------|---------|\r\n| `{{ expr }}` | Interpolation — display data |\r\n| `[prop]=\"expr\"` | Property binding — set DOM property |\r\n| `(event)=\"handler()\"` | Event binding — react to events |\r\n| `[(ngModel)]` | Two-way binding |\r\n| `@if / @for / @switch` | Control flow (modern) |\r\n| `*ngIf / *ngFor` | Control flow (legacy, still supported) |\r\n| `\\| pipeName` | Transform display values |\r\n| `#ref` | Template reference variable |\r\n| `@defer` | Lazy-load template blocks |\r\n\r\n**Next:** [04 — Services \u0026 Dependency Injection →](./04-services-di.md)\r\n",
  "04-services-di": "# Chapter 04 — Services \u0026 Dependency Injection\r\n\r\n---\r\n\r\n## 1. What is a Service?\r\n\r\nA **service** is a TypeScript class that:\r\n- Encapsulates **business logic** (data fetching, calculations, state)\r\n- Is **shared** across multiple components\r\n- Is **injectable** — Angular creates and manages one instance for you\r\n\r\n\u003e **Rule of thumb:** If logic doesn\u0027t belong to a specific component\u0027s view, put it in a service.\r\n\r\n---\r\n\r\n## 2. Creating a Service\r\n\r\n```bash\r\nng generate service core/services/product\r\n# Creates: src/app/core/services/product.service.ts\r\n```\r\n\r\n```typescript\r\n// product.service.ts\r\nimport { Injectable } from \u0027@angular/core\u0027;\r\n\r\n@Injectable({\r\n  providedIn: \u0027root\u0027,   // Singleton — one instance for the whole app\r\n})\r\nexport class ProductService {\r\n  private products = [\r\n    { id: 1, name: \u0027Laptop\u0027, price: 999 },\r\n    { id: 2, name: \u0027Mouse\u0027,  price: 29  },\r\n  ];\r\n\r\n  getAll() {\r\n    return this.products;\r\n  }\r\n\r\n  getById(id: number) {\r\n    return this.products.find(p =\u003e p.id === id);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 3. Injecting a Service — Three Ways\r\n\r\n### (A) Constructor injection (classic)\r\n\r\n```typescript\r\nimport { Component, OnInit } from \u0027@angular/core\u0027;\r\nimport { ProductService } from \u0027../services/product.service\u0027;\r\n\r\n@Component({ selector: \u0027app-list\u0027, standalone: true, template: `...` })\r\nexport class ProductListComponent implements OnInit {\r\n  constructor(private productService: ProductService) {}\r\n\r\n  ngOnInit() {\r\n    const products = this.productService.getAll();\r\n  }\r\n}\r\n```\r\n\r\n### (B) `inject()` function (Angular 14+ — recommended for Angular 20)\r\n\r\n```typescript\r\nimport { Component, OnInit, inject } from \u0027@angular/core\u0027;\r\nimport { ProductService } from \u0027../services/product.service\u0027;\r\n\r\n@Component({ selector: \u0027app-list\u0027, standalone: true, template: `...` })\r\nexport class ProductListComponent implements OnInit {\r\n  private productService = inject(ProductService);  // no constructor needed\r\n\r\n  ngOnInit() {\r\n    const products = this.productService.getAll();\r\n  }\r\n}\r\n```\r\n\r\n\u003e **Prefer `inject()`** in Angular 20. It works in class fields, functions, and injection contexts.\r\n\r\n### (C) inject() in a standalone function (e.g., functional guards, resolvers)\r\n\r\n```typescript\r\nexport const authGuard = () =\u003e {\r\n  const authService = inject(AuthService);  // works in injection context\r\n  return authService.isLoggedIn() || inject(Router).navigate([\u0027/login\u0027]);\r\n};\r\n```\r\n\r\n---\r\n\r\n## 4. Provider Scopes\r\n\r\nWhere you provide a service determines its **lifetime and sharing**.\r\n\r\n```\r\nApp (root injector)\r\n └── Feature Module injector\r\n       └── Component injector\r\n```\r\n\r\n### `providedIn: \u0027root\u0027` — App-wide singleton\r\n\r\n```typescript\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class CartService { }\r\n```\r\n\r\nOne instance shared everywhere. Destroyed when the app closes.\r\n\r\n### `providedIn: \u0027platform\u0027` — Shared across micro-frontends\r\n\r\n```typescript\r\n@Injectable({ providedIn: \u0027platform\u0027 })\r\nexport class ThemeService { }\r\n```\r\n\r\n### Component-level provider — New instance per component\r\n\r\n```typescript\r\n@Component({\r\n  selector: \u0027app-wizard\u0027,\r\n  standalone: true,\r\n  providers: [WizardStateService],   // fresh instance for this component tree\r\n  template: `...`,\r\n})\r\nexport class WizardComponent { }\r\n```\r\n\r\nEach `\u003capp-wizard\u003e` gets its own `WizardStateService`.\r\n\r\n### Route-level provider\r\n\r\n```typescript\r\n// app.routes.ts\r\n{\r\n  path: \u0027checkout\u0027,\r\n  component: CheckoutComponent,\r\n  providers: [CheckoutService],  // new instance scoped to this route\r\n}\r\n```\r\n\r\n---\r\n\r\n## 5. `InjectionToken` — Inject Non-Class Values\r\n\r\nUse `InjectionToken` when you need to inject a value, configuration object, or interface.\r\n\r\n```typescript\r\n// tokens.ts\r\nimport { InjectionToken } from \u0027@angular/core\u0027;\r\n\r\nexport interface AppConfig {\r\n  apiUrl: string;\r\n  maxRetries: number;\r\n}\r\n\r\nexport const APP_CONFIG = new InjectionToken\u003cAppConfig\u003e(\u0027APP_CONFIG\u0027);\r\n```\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { ApplicationConfig } from \u0027@angular/core\u0027;\r\nimport { APP_CONFIG } from \u0027./tokens\u0027;\r\n\r\nexport const appConfig: ApplicationConfig = {\r\n  providers: [\r\n    {\r\n      provide: APP_CONFIG,\r\n      useValue: { apiUrl: \u0027https://api.myshop.com\u0027, maxRetries: 3 },\r\n    },\r\n  ],\r\n};\r\n```\r\n\r\n```typescript\r\n// product.service.ts\r\nimport { Injectable, inject } from \u0027@angular/core\u0027;\r\nimport { APP_CONFIG, AppConfig } from \u0027../tokens\u0027;\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class ProductService {\r\n  private config = inject(APP_CONFIG);\r\n\r\n  getProducts() {\r\n    return fetch(`${this.config.apiUrl}/products`);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 6. useClass, useExisting, useFactory\r\n\r\n```typescript\r\nproviders: [\r\n  // 1. useClass — provide a different implementation\r\n  { provide: LoggerService, useClass: ConsoleLoggerService },\r\n\r\n  // 2. useExisting — alias one token to another (same instance)\r\n  { provide: AbstractCache, useExisting: MemoryCacheService },\r\n\r\n  // 3. useFactory — build instance with custom logic\r\n  {\r\n    provide: AuthService,\r\n    useFactory: (http: HttpClient, config: AppConfig) =\u003e {\r\n      return config.production\r\n        ? new OAuthService(http)\r\n        : new MockAuthService();\r\n    },\r\n    deps: [HttpClient, APP_CONFIG],\r\n  },\r\n\r\n  // 4. useValue — plain value or object\r\n  { provide: API_URL, useValue: \u0027https://api.myshop.com\u0027 },\r\n]\r\n```\r\n\r\n---\r\n\r\n## 7. Real-World Example — Cart Service with Signals\r\n\r\n```typescript\r\n// cart.service.ts\r\nimport { Injectable, computed, signal } from \u0027@angular/core\u0027;\r\n\r\nexport interface CartItem {\r\n  productId: number;\r\n  name: string;\r\n  price: number;\r\n  quantity: number;\r\n}\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class CartService {\r\n  // Private writable signal\r\n  private _items = signal\u003cCartItem[]\u003e([]);\r\n\r\n  // Public read-only view\r\n  readonly items = this._items.asReadonly();\r\n\r\n  // Derived/computed values\r\n  readonly totalItems = computed(() =\u003e\r\n    this._items().reduce((sum, item) =\u003e sum + item.quantity, 0)\r\n  );\r\n\r\n  readonly totalPrice = computed(() =\u003e\r\n    this._items().reduce((sum, item) =\u003e sum + item.price * item.quantity, 0)\r\n  );\r\n\r\n  addItem(product: { id: number; name: string; price: number }) {\r\n    this._items.update(items =\u003e {\r\n      const existing = items.find(i =\u003e i.productId === product.id);\r\n      if (existing) {\r\n        return items.map(i =\u003e\r\n          i.productId === product.id\r\n            ? { ...i, quantity: i.quantity + 1 }\r\n            : i\r\n        );\r\n      }\r\n      return [...items, { productId: product.id, name: product.name, price: product.price, quantity: 1 }];\r\n    });\r\n  }\r\n\r\n  removeItem(productId: number) {\r\n    this._items.update(items =\u003e items.filter(i =\u003e i.productId !== productId));\r\n  }\r\n\r\n  updateQuantity(productId: number, quantity: number) {\r\n    if (quantity \u003c= 0) {\r\n      this.removeItem(productId);\r\n      return;\r\n    }\r\n    this._items.update(items =\u003e\r\n      items.map(i =\u003e i.productId === productId ? { ...i, quantity } : i)\r\n    );\r\n  }\r\n\r\n  clear() {\r\n    this._items.set([]);\r\n  }\r\n}\r\n```\r\n\r\n### Using CartService in a component\r\n\r\n```typescript\r\n// header.component.ts\r\nimport { Component, inject } from \u0027@angular/core\u0027;\r\nimport { CartService } from \u0027../services/cart.service\u0027;\r\n\r\n@Component({\r\n  selector: \u0027app-header\u0027,\r\n  standalone: true,\r\n  template: `\r\n    \u003cnav\u003e\r\n      \u003ca routerLink=\"/store\"\u003eShop\u003c/a\u003e\r\n      \u003ca routerLink=\"/cart\"\u003e\r\n        Cart\r\n        @if (cart.totalItems() \u003e 0) {\r\n          \u003cspan class=\"badge\"\u003e{{ cart.totalItems() }}\u003c/span\u003e\r\n        }\r\n      \u003c/a\u003e\r\n    \u003c/nav\u003e\r\n  `,\r\n})\r\nexport class HeaderComponent {\r\n  cart = inject(CartService);  // signals auto-update the template\r\n}\r\n```\r\n\r\n---\r\n\r\n## 8. Service with HTTP (preview — full details in Chapter 07)\r\n\r\n```typescript\r\n// product.service.ts\r\nimport { Injectable, inject } from \u0027@angular/core\u0027;\r\nimport { HttpClient }         from \u0027@angular/common/http\u0027;\r\nimport { Observable }         from \u0027rxjs\u0027;\r\nimport { environment }        from \u0027../../environments/environment\u0027;\r\n\r\nexport interface Product {\r\n  id: number;\r\n  name: string;\r\n  price: number;\r\n}\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class ProductService {\r\n  private http   = inject(HttpClient);\r\n  private apiUrl = `${environment.apiUrl}/products`;\r\n\r\n  getAll(): Observable\u003cProduct[]\u003e {\r\n    return this.http.get\u003cProduct[]\u003e(this.apiUrl);\r\n  }\r\n\r\n  getById(id: number): Observable\u003cProduct\u003e {\r\n    return this.http.get\u003cProduct\u003e(`${this.apiUrl}/${id}`);\r\n  }\r\n\r\n  create(product: Omit\u003cProduct, \u0027id\u0027\u003e): Observable\u003cProduct\u003e {\r\n    return this.http.post\u003cProduct\u003e(this.apiUrl, product);\r\n  }\r\n\r\n  update(id: number, product: Partial\u003cProduct\u003e): Observable\u003cProduct\u003e {\r\n    return this.http.put\u003cProduct\u003e(`${this.apiUrl}/${id}`, product);\r\n  }\r\n\r\n  delete(id: number): Observable\u003cvoid\u003e {\r\n    return this.http.delete\u003cvoid\u003e(`${this.apiUrl}/${id}`);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 9. Hierarchical Injector Tree\r\n\r\n```\r\nRoot Injector (bootstrapApplication)\r\n │\r\n ├── RouteLevelInjector (route providers:[])\r\n │     └── ComponentInjector (providers:[])\r\n │\r\n └── AnotherComponent\r\n```\r\n\r\nWhen Angular needs to resolve a dependency it walks **up** the tree.  \r\nThe first injector that has the provider wins.\r\n\r\n```typescript\r\n// Skip self — look in parent injectors only\r\nconstructor(@SkipSelf() private logger: LoggerService) {}\r\n\r\n// Optional — null if not found, don\u0027t throw\r\nconstructor(@Optional() private config: ConfigService) {}\r\n\r\n// Only look in self — don\u0027t go up\r\nconstructor(@Self() private service: LocalService) {}\r\n\r\n// Inject the HOST component (used in directives)\r\nconstructor(@Host() private form: NgForm) {}\r\n```\r\n\r\n---\r\n\r\n## 10. Multi Providers\r\n\r\nRegister multiple values for the same token (e.g., multiple validators, interceptors):\r\n\r\n```typescript\r\n// Registers multiple interceptors\r\nproviders: [\r\n  { provide: HTTP_INTERCEPTORS, useClass: AuthInterceptor,  multi: true },\r\n  { provide: HTTP_INTERCEPTORS, useClass: ErrorInterceptor, multi: true },\r\n]\r\n```\r\n\r\n```typescript\r\n// Custom multi-provider pattern\r\nexport const VALIDATORS = new InjectionToken\u003cValidator[]\u003e(\u0027VALIDATORS\u0027);\r\n\r\nproviders: [\r\n  { provide: VALIDATORS, useClass: EmailValidator,  multi: true },\r\n  { provide: VALIDATORS, useClass: PhoneValidator,  multi: true },\r\n]\r\n\r\n// Consume\r\nconst validators = inject(VALIDATORS); // Validator[]\r\n```\r\n\r\n---\r\n\r\n## Summary\r\n\r\n| Concept | Code |\r\n|---------|------|\r\n| Create service | `@Injectable({ providedIn: \u0027root\u0027 })` |\r\n| Inject service | `inject(MyService)` |\r\n| App-wide singleton | `providedIn: \u0027root\u0027` |\r\n| Component-scoped | `@Component({ providers: [MyService] })` |\r\n| Inject value/config | `InjectionToken\u003cT\u003e` |\r\n| Multiple providers | `{ provide: TOKEN, useClass: X, multi: true }` |\r\n| Decorate DI | `@Optional()`, `@Self()`, `@SkipSelf()` |\r\n\r\n**Next:** [05 — Angular Router →](./05-router.md)\r\n",
  "05-router": "# Chapter 05 — Angular Router\r\n\r\n---\r\n\r\n## 1. Setup\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { ApplicationConfig }             from \u0027@angular/core\u0027;\r\nimport { provideRouter, withPreloading, PreloadAllModules, withComponentInputBinding } from \u0027@angular/router\u0027;\r\nimport { routes }                        from \u0027./app.routes\u0027;\r\n\r\nexport const appConfig: ApplicationConfig = {\r\n  providers: [\r\n    provideRouter(\r\n      routes,\r\n      withPreloading(PreloadAllModules),    // preload lazy modules in background\r\n      withComponentInputBinding(),          // bind route params directly to @Input\r\n    ),\r\n  ],\r\n};\r\n```\r\n\r\n---\r\n\r\n## 2. Defining Routes\r\n\r\n```typescript\r\n// app.routes.ts\r\nimport { Routes } from \u0027@angular/router\u0027;\r\n\r\nexport const routes: Routes = [\r\n  // Redirect\r\n  { path: \u0027\u0027, redirectTo: \u0027home\u0027, pathMatch: \u0027full\u0027 },\r\n\r\n  // Eager-loaded\r\n  { path: \u0027home\u0027, component: HomeComponent },\r\n\r\n  // Lazy-loaded (standalone component)\r\n  {\r\n    path: \u0027store\u0027,\r\n    loadComponent: () =\u003e\r\n      import(\u0027./store/store.component\u0027).then(m =\u003e m.StoreComponent),\r\n  },\r\n\r\n  // Lazy-loaded (feature routes file)\r\n  {\r\n    path: \u0027checkout\u0027,\r\n    loadChildren: () =\u003e\r\n      import(\u0027./checkout/checkout.routes\u0027).then(m =\u003e m.checkoutRoutes),\r\n  },\r\n\r\n  // Route with parameter\r\n  { path: \u0027products/:id\u0027, component: ProductDetailsComponent },\r\n\r\n  // Nested routes\r\n  {\r\n    path: \u0027admin\u0027,\r\n    component: AdminLayoutComponent,\r\n    children: [\r\n      { path: \u0027\u0027,          redirectTo: \u0027dashboard\u0027, pathMatch: \u0027full\u0027 },\r\n      { path: \u0027dashboard\u0027, component: DashboardComponent },\r\n      { path: \u0027users\u0027,     component: UserListComponent },\r\n    ],\r\n  },\r\n\r\n  // Wildcard — must be last\r\n  { path: \u0027**\u0027, component: NotFoundComponent },\r\n];\r\n```\r\n\r\n---\r\n\r\n## 3. RouterOutlet — Where to Render\r\n\r\n```html\r\n\u003c!-- app.component.html --\u003e\r\n\u003capp-navbar /\u003e\r\n\u003cmain\u003e\r\n  \u003crouter-outlet /\u003e   \u003c!-- routed components render here --\u003e\r\n\u003c/main\u003e\r\n\u003capp-footer /\u003e\r\n```\r\n\r\nFor nested routes, add a second `\u003crouter-outlet\u003e` inside the parent layout:\r\n\r\n```html\r\n\u003c!-- admin-layout.component.html --\u003e\r\n\u003caside\u003e\u003capp-admin-sidebar /\u003e\u003c/aside\u003e\r\n\u003csection\u003e\r\n  \u003crouter-outlet /\u003e\r\n\u003c/section\u003e\r\n```\r\n\r\n---\r\n\r\n## 4. RouterLink — Navigation in Templates\r\n\r\n```html\r\n\u003c!-- Basic --\u003e\r\n\u003ca routerLink=\"/store\"\u003eShop\u003c/a\u003e\r\n\r\n\u003c!-- With parameter --\u003e\r\n\u003ca [routerLink]=\"[\u0027/products\u0027, product.id]\"\u003eView\u003c/a\u003e\r\n\r\n\u003c!-- With query params \u0026 fragment --\u003e\r\n\u003ca [routerLink]=\"[\u0027/store\u0027]\"\r\n   [queryParams]=\"{ category: \u0027electronics\u0027, page: 1 }\"\r\n   fragment=\"results\"\u003e\r\n  Electronics\r\n\u003c/a\u003e\r\n\r\n\u003c!-- Active class --\u003e\r\n\u003ca routerLink=\"/home\" routerLinkActive=\"active-link\"\u003eHome\u003c/a\u003e\r\n\r\n\u003c!-- Exact match only --\u003e\r\n\u003ca routerLink=\"/\" routerLinkActive=\"active\" [routerLinkActiveOptions]=\"{ exact: true }\"\u003e\r\n  Home\r\n\u003c/a\u003e\r\n```\r\n\r\n---\r\n\r\n## 5. Programmatic Navigation\r\n\r\n```typescript\r\nimport { Component, inject } from \u0027@angular/core\u0027;\r\nimport { Router, ActivatedRoute } from \u0027@angular/router\u0027;\r\n\r\n@Component({ selector: \u0027app-login\u0027, standalone: true, template: `...` })\r\nexport class LoginComponent {\r\n  private router = inject(Router);\r\n  private route  = inject(ActivatedRoute);\r\n\r\n  login() {\r\n    // ... auth logic ...\r\n\r\n    // Navigate to absolute path\r\n    this.router.navigate([\u0027/dashboard\u0027]);\r\n\r\n    // Navigate relative to current route\r\n    this.router.navigate([\u0027../home\u0027], { relativeTo: this.route });\r\n\r\n    // With query params \u0026 extras\r\n    this.router.navigate([\u0027/store\u0027], {\r\n      queryParams: { sort: \u0027price\u0027 },\r\n      queryParamsHandling: \u0027merge\u0027,   // keep existing params\r\n    });\r\n\r\n    // Replace history entry (no back button)\r\n    this.router.navigate([\u0027/home\u0027], { replaceUrl: true });\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 6. Reading Route Parameters\r\n\r\n### Method A — `ActivatedRoute` observables\r\n\r\n```typescript\r\nimport { Component, OnInit, inject } from \u0027@angular/core\u0027;\r\nimport { ActivatedRoute } from \u0027@angular/router\u0027;\r\nimport { switchMap } from \u0027rxjs\u0027;\r\n\r\n@Component({ selector: \u0027app-product-details\u0027, standalone: true, template: `...` })\r\nexport class ProductDetailsComponent implements OnInit {\r\n  private route          = inject(ActivatedRoute);\r\n  private productService = inject(ProductService);\r\n  product$               = this.route.paramMap.pipe(\r\n    switchMap(params =\u003e this.productService.getById(+params.get(\u0027id\u0027)!))\r\n  );\r\n}\r\n```\r\n\r\n### Method B — `withComponentInputBinding()` (Angular 16+ — cleanest)\r\n\r\n```typescript\r\n// app.config.ts — provideRouter(routes, withComponentInputBinding())\r\n\r\n// product-details.component.ts\r\nimport { Component, Input, OnChanges } from \u0027@angular/core\u0027;\r\n\r\n@Component({ selector: \u0027app-product-details\u0027, standalone: true, template: `...` })\r\nexport class ProductDetailsComponent implements OnChanges {\r\n  @Input() id!: string;              // ← route param :id mapped here automatically\r\n  @Input() category?: string;        // ← query param ?category= mapped here\r\n  @Input() fragment?: string;        // ← fragment #xxx mapped here\r\n\r\n  ngOnChanges() {\r\n    console.log(\u0027Route id:\u0027, this.id);\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 7. Route Guards\r\n\r\nGuards protect routes from unauthorized access.\r\n\r\n### Functional Guard (Angular 15+ — recommended)\r\n\r\n```typescript\r\n// auth.guard.ts\r\nimport { inject }   from \u0027@angular/core\u0027;\r\nimport { Router }   from \u0027@angular/router\u0027;\r\nimport { AuthService } from \u0027../services/auth.service\u0027;\r\n\r\nexport const authGuard = () =\u003e {\r\n  const auth   = inject(AuthService);\r\n  const router = inject(Router);\r\n\r\n  if (auth.isLoggedIn()) return true;\r\n\r\n  // Redirect to login and save the attempted URL\r\n  return router.createUrlTree([\u0027/login\u0027], {\r\n    queryParams: { returnUrl: router.url }\r\n  });\r\n};\r\n```\r\n\r\n```typescript\r\n// app.routes.ts\r\n{\r\n  path: \u0027account\u0027,\r\n  canActivate: [authGuard],\r\n  loadComponent: () =\u003e import(\u0027./account/account.component\u0027).then(m =\u003e m.AccountComponent),\r\n},\r\n```\r\n\r\n### canActivateChild — protect all children\r\n\r\n```typescript\r\n{\r\n  path: \u0027admin\u0027,\r\n  canActivateChild: [authGuard],\r\n  children: [...]\r\n}\r\n```\r\n\r\n### canDeactivate — warn before leaving\r\n\r\n```typescript\r\n// unsaved-changes.guard.ts\r\nexport interface CanComponentDeactivate {\r\n  canDeactivate: () =\u003e boolean | Observable\u003cboolean\u003e;\r\n}\r\n\r\nexport const unsavedChangesGuard = (component: CanComponentDeactivate) =\u003e {\r\n  return component.canDeactivate?.() ?? true;\r\n};\r\n```\r\n\r\n```typescript\r\n// edit-product.component.ts\r\nexport class EditProductComponent implements CanComponentDeactivate {\r\n  isDirty = false;\r\n\r\n  canDeactivate(): boolean {\r\n    if (this.isDirty) {\r\n      return confirm(\u0027You have unsaved changes. Leave anyway?\u0027);\r\n    }\r\n    return true;\r\n  }\r\n}\r\n```\r\n\r\n### canMatch — conditionally match a route (A/B testing, feature flags)\r\n\r\n```typescript\r\n{\r\n  path: \u0027dashboard\u0027,\r\n  canMatch: [() =\u003e inject(FeatureFlagService).isEnabled(\u0027new-dashboard\u0027)],\r\n  component: NewDashboardComponent,\r\n},\r\n{\r\n  path: \u0027dashboard\u0027,\r\n  component: OldDashboardComponent,\r\n},\r\n```\r\n\r\n---\r\n\r\n## 8. Route Resolvers — Pre-fetch Data\r\n\r\nResolvers load data **before** a route activates, avoiding empty states.\r\n\r\n```typescript\r\n// product.resolver.ts\r\nimport { inject }          from \u0027@angular/core\u0027;\r\nimport { ResolveFn }       from \u0027@angular/router\u0027;\r\nimport { ProductService }  from \u0027../services/product.service\u0027;\r\nimport { Product }         from \u0027../models/product.model\u0027;\r\n\r\nexport const productResolver: ResolveFn\u003cProduct\u003e = (route) =\u003e {\r\n  const id = +route.paramMap.get(\u0027id\u0027)!;\r\n  return inject(ProductService).getById(id);\r\n};\r\n```\r\n\r\n```typescript\r\n// app.routes.ts\r\n{\r\n  path: \u0027products/:id\u0027,\r\n  component: ProductDetailsComponent,\r\n  resolve: { product: productResolver },\r\n}\r\n```\r\n\r\n```typescript\r\n// product-details.component.ts\r\nimport { Component, inject } from \u0027@angular/core\u0027;\r\nimport { ActivatedRoute }    from \u0027@angular/router\u0027;\r\n\r\n@Component({ selector: \u0027app-product-details\u0027, standalone: true, template: `\r\n  \u003ch2\u003e{{ product.name }}\u003c/h2\u003e\r\n  \u003cp\u003e{{ product.price | currency }}\u003c/p\u003e\r\n`})\r\nexport class ProductDetailsComponent {\r\n  private route = inject(ActivatedRoute);\r\n  product = this.route.snapshot.data[\u0027product\u0027] as Product;\r\n}\r\n```\r\n\r\n---\r\n\r\n## 9. Lazy Loading with Feature Routes\r\n\r\n```typescript\r\n// checkout/checkout.routes.ts\r\nimport { Routes } from \u0027@angular/router\u0027;\r\n\r\nexport const checkoutRoutes: Routes = [\r\n  {\r\n    path: \u0027\u0027,\r\n    component: CheckoutComponent,\r\n    children: [\r\n      { path: \u0027address\u0027,  component: AddressStepComponent },\r\n      { path: \u0027payment\u0027,  component: PaymentStepComponent },\r\n      { path: \u0027review\u0027,   component: ReviewStepComponent },\r\n    ],\r\n  },\r\n];\r\n```\r\n\r\n```typescript\r\n// app.routes.ts\r\n{\r\n  path: \u0027checkout\u0027,\r\n  canActivate: [authGuard],\r\n  loadChildren: () =\u003e\r\n    import(\u0027./checkout/checkout.routes\u0027).then(m =\u003e m.checkoutRoutes),\r\n},\r\n```\r\n\r\n---\r\n\r\n## 10. Router Events — Track Navigation\r\n\r\n```typescript\r\nimport { Component, inject, OnInit } from \u0027@angular/core\u0027;\r\nimport { Router, NavigationStart, NavigationEnd, NavigationError } from \u0027@angular/router\u0027;\r\nimport { filter } from \u0027rxjs\u0027;\r\n\r\n@Component({ selector: \u0027app-root\u0027, standalone: true, template: `...` })\r\nexport class AppComponent implements OnInit {\r\n  private router = inject(Router);\r\n  isLoading = false;\r\n\r\n  ngOnInit() {\r\n    this.router.events.pipe(\r\n      filter(e =\u003e e instanceof NavigationStart || e instanceof NavigationEnd || e instanceof NavigationError)\r\n    ).subscribe(event =\u003e {\r\n      if (event instanceof NavigationStart) this.isLoading = true;\r\n      if (event instanceof NavigationEnd)   this.isLoading = false;\r\n      if (event instanceof NavigationError) {\r\n        this.isLoading = false;\r\n        console.error(\u0027Navigation error:\u0027, event.error);\r\n      }\r\n    });\r\n  }\r\n}\r\n```\r\n\r\n---\r\n\r\n## 11. Title Strategy — Update Page Title\r\n\r\n```typescript\r\n// app.config.ts\r\nimport { TitleStrategy } from \u0027@angular/router\u0027;\r\nimport { Injectable }    from \u0027@angular/core\u0027;\r\nimport { Title }         from \u0027@angular/platform-browser\u0027;\r\n\r\n@Injectable({ providedIn: \u0027root\u0027 })\r\nexport class AppTitleStrategy extends TitleStrategy {\r\n  constructor(private title: Title) { super(); }\r\n\r\n  override updateTitle(snapshot: RouterStateSnapshot) {\r\n    const pageTitle = this.buildTitle(snapshot);\r\n    this.title.setTitle(pageTitle ? `${pageTitle} | MyShop` : \u0027MyShop\u0027);\r\n  }\r\n}\r\n\r\n// Register in app.config.ts providers:\r\n{ provide: TitleStrategy, useClass: AppTitleStrategy }\r\n```\r\n\r\n```typescript\r\n// app.routes.ts\r\n{ path: \u0027store\u0027, title: \u0027Store\u0027, component: StoreComponent }\r\n```\r\n\r\n---\r\n\r\n## 12. Named Router Outlets (advanced)\r\n\r\n```html\r\n\u003c!-- template --\u003e\r\n\u003crouter-outlet /\u003e                        \u003c!-- primary outlet --\u003e\r\n\u003crouter-outlet name=\"sidebar\" /\u003e         \u003c!-- named outlet --\u003e\r\n```\r\n\r\n```typescript\r\n// route definition\r\n{ path: \u0027help\u0027, component: HelpComponent, outlet: \u0027sidebar\u0027 }\r\n```\r\n\r\n```typescript\r\n// navigate to named outlet\r\nthis.router.navigate([{ outlets: { primary: [\u0027store\u0027], sidebar: [\u0027help\u0027] } }]);\r\n```\r\n\r\n---\r\n\r\n## 13. Complete Route Configuration Example\r\n\r\n```typescript\r\n// app.routes.ts\r\nimport { Routes } from \u0027@angular/router\u0027;\r\nimport { authGuard }         from \u0027./core/guards/auth.guard\u0027;\r\nimport { productResolver }   from \u0027./store/resolvers/product.resolver\u0027;\r\nimport { HomeComponent }     from \u0027./home/home.component\u0027;\r\n\r\nexport const routes: Routes = [\r\n  { path: \u0027\u0027, redirectTo: \u0027home\u0027, pathMatch: \u0027full\u0027 },\r\n\r\n  { path: \u0027home\u0027, component: HomeComponent, title: \u0027Home\u0027 },\r\n\r\n  {\r\n    path: \u0027store\u0027,\r\n    title: \u0027Store\u0027,\r\n    loadChildren: () =\u003e\r\n      import(\u0027./store/store.routes\u0027).then(m =\u003e m.storeRoutes),\r\n  },\r\n\r\n  {\r\n    path: \u0027products/:id\u0027,\r\n    title: \u0027Product D
