<div class="product-card" *ngIf="product">
  <div class="product-card__image-wrap">
    <img [src]="product.imageFile" [alt]="product.name" class="product-card__img" />
    <div class="product-card__overlay">
      <button (click)="addItemToBasket()" class="product-card__action-btn" type="button">
        <i class="fa fa-shopping-cart"></i>
      </button>
      <button [routerLink]="['/store', product.id]" class="product-card__action-btn" type="button">
        <i class="fa fa-eye"></i>
      </button>
    </div>
  </div>
  <div class="product-card__body">
    <h6 class="product-card__name">{{ product.name }}</h6>
    <span class="product-card__price">{{ product.price | currency:'INR' }}</span>
  </div>
</div>
