<div class="d-flex flex-column flex-md-row align-items-center justify-content-between luxury-nav fixed-top">
  <div class="d-flex align-items-center">
    <img src="/assets/images/logo.png" style="max-height: 70px;" alt="myview" class="logo" routerLink="/" />
  </div>

  <nav class="d-flex my-2 my-md-0 mr-md-3">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <span class="nav-link-luxury" [class.active]="true">Home</span>
    </a>
    <a routerLink="/store" routerLinkActive="active">
      <span class="nav-link-luxury">Store</span>
    </a>
  </nav>

  <div class="d-flex align-items-center" style="gap: 1rem;">
    <a routerLink="/basket" class="position-relative" style="text-decoration:none;">
      <i class="fa fa-shopping-cart fa-lg text-dark" style="font-size:1.4rem;"></i>
      <div *ngIf="(basketService.basketSource$ | async) as basket" class="cart-no">
        {{getBasketCount(basket.items)}}
      </div>
    </a>
    <section>
      <button *ngIf="!isUserAuthenticated" class="btn-luxury-outline btn-sm" (click)="login()">Login</button>
      <button *ngIf="isUserAuthenticated" class="btn-luxury-outline btn-sm" (click)="logout()">Logout</button>
    </section>
  </div>
</div>
<app-header></app-header>
