<div class="order-summary">
  <div class="order-summary__header">
    <span class="order-summary__title">Order Summary</span>
  </div>
  <div class="order-summary__body" *ngIf="(basketService.basketTotal$ | async) as total">
    <div class="order-summary__row">
      <span class="order-summary__label">Total</span>
      <span class="order-summary__value">{{ total.total | currency:'INR' }}</span>
    </div>
  </div>
</div>
