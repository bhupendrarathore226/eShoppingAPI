name: Build and deploy .NET Core application to Web App OrderingAPI20260424111008 with API Management Service eShopAPIGate-eshopAPIGateway
on:
  push:
    branches:
    - eshopAPIAzAppInsights
env:
  AZURE_WEBAPP_NAME: OrderingAPI20260424111008
  AZURE_WEBAPP_PACKAGE_PATH: Services/Ordering/Ordering.API/publish
  AZURE_APIM_RESOURCE_PATH: /ordering
  AZURE_APIM_RESOURCEGROUP: rg-eshop
  AZURE_APIM_SERVICENAME: eShopAPIGate
  AZURE_APIM_API_ID: eshopOrderingAPI
  AZURE_APIM_DISPLAY_NAME: Ordering API
  AZURE_APIM_APPSERVICEURL: https://orderingapi20260424111008.azurewebsites.net
  SWASHBUCLE_ASPNET_CORE_CLI_PACKAGE_VERSION: 5.6.3
  SWASHBUCKLE_DOTNET_CORE_VERSION: 3.1.x
  API_IMPORT_SPECIFICATION_PATH: Services/Ordering/Ordering.API/publish/swagger.json
  API_IMPORT_DLL: Services/Ordering/Ordering.API/bin/Release/net8.0/Ordering.API.dll
  API_IMPORT_VERSION: v1
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: Services/Ordering/Ordering.API
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Setup SwashBuckle .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.SWASHBUCKLE_DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore ${{ env.WORKING_DIRECTORY }}
    - name: Build
      run: dotnet build ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test ${{ env.WORKING_DIRECTORY }} --no-build
    - name: Publish
      run: dotnet publish ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Install Swashbuckle CLI .NET Global Tool
      run: dotnet tool install --global Swashbuckle.AspNetCore.Cli --version ${{ env.SWASHBUCLE_ASPNET_CORE_CLI_PACKAGE_VERSION }}
      working-directory: ${{ env.WORKING_DIRECTORY }}
    - name: Generate Open API Specification Document
      run: swagger tofile --output "${{ env.API_IMPORT_SPECIFICATION_PATH }}" "${{ env.API_IMPORT_DLL }}" "${{ env.API_IMPORT_VERSION }}"
      env:
        ConnectionStrings__OrderingConnectionString: "Server=sql5.freesqldatabase.com;Port=3306;Database=sql5824381;User=sql5824381;Password=G8HnKNYj1l;"
        EventBusSettings__HostAddress: "amqp://guest:guest@localhost:5672"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ordering-webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: ordering-webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.OrderingAPI20260424111008_A104 }}
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.eShopAPIGate_SPN }}
    - name: Import API into Azure API Management
      run: az apim api import --path "${{ env.AZURE_APIM_RESOURCE_PATH }}" --resource-group "${{ env.AZURE_APIM_RESOURCEGROUP }}" --service-name "${{ env.AZURE_APIM_SERVICENAME }}" --api-id "${{ env.AZURE_APIM_API_ID }}" --display-name "${{ env.AZURE_APIM_DISPLAY_NAME }}" --service-url "${{ env.AZURE_APIM_APPSERVICEURL }}" --specification-path "${{ env.API_IMPORT_SPECIFICATION_PATH }}" --specification-format OpenApi --subscription-required false
    - name: logout
      run: >
        az logout
